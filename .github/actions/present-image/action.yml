name: present image
description: >-
  Build the present container image from the repo root with buildx, and
  optionally push it to ghcr.io. Shared by the PR kind job (load only), the
  main-branch push, and the release job.
inputs:
  push:
    description: push to ghcr.io (the job needs packages write)
    default: "false"
  load:
    description: load a single-platform image into the runner's docker
    default: "false"
  platforms:
    description: comma-separated target platforms
    default: linux/amd64
  tags:
    description: comma-separated full image references
    required: true
  version:
    description: buildinfo Version to stamp
    default: dev
  tag:
    description: buildinfo Tag to stamp (the release tag, empty on main)
    default: ""
outputs:
  digest:
    description: digest of the built image (the pushed manifest when pushing)
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - if: inputs.push == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - id: stamp
      shell: bash
      run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: services/present/Dockerfile
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push == 'true' }}
        load: ${{ inputs.load == 'true' }}
        tags: ${{ inputs.tags }}
        build-args: |
          VERSION=${{ inputs.version }}
          COMMIT=${{ github.sha }}
          TAG=${{ inputs.tag }}
          BUILD_TIME=${{ steps.stamp.outputs.build_time }}
        cache-from: type=gha,scope=present
        cache-to: type=gha,mode=max,scope=present
