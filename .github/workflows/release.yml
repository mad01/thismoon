name: release

on:
  push:
    branches:
      - main

# Two merges to main racing release-please can double-process the release PR.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      # Per-path outputs are keyed "<path>--tag_name"; a job can't declare
      # dynamic output names, so the whole set is forwarded as one JSON blob.
      outputs_json: ${{ toJSON(steps.release.outputs) }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN: the default token may not
      # create PRs unless a repo-wide Actions toggle is flipped — too broad a
      # grant for a repo heading public — and PRs it opens never trigger
      # ci.yml checks. The App mints a fresh token per run that expires within
      # the hour, so there is no long-lived PAT to rotate; its PRs still
      # trigger ci.yml. The App grants Contents + Pull requests + Issues
      # read-write on this repo only (Issues for release-please labels).
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  artifacts:
    name: ${{ matrix.path }}
    needs: release-please
    if: needs.release-please.outputs.paths_released != '' && needs.release-please.outputs.paths_released != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the GitHub Release
      id-token: write # cosign keyless signing via GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    env:
      TAG: ${{ fromJSON(needs.release-please.outputs.outputs_json)[format('{0}--tag_name', matrix.path)] }}
      COMPONENT_PATH: ${{ matrix.path }}
    # csl ships no artifacts: it needs cgo (tree-sitter grammars), so a
    # CGO_ENABLED=0 cross-compile cannot build it — the fleet installs it
    # from source via ralph. Guarding every step (not the job: the matrix
    # context is unavailable in a job-level `if`, and a matrix `exclude`
    # fails the workflow when csl releases alone) turns its matrix entry
    # into a no-op success while the tag, changelog, and GitHub Release
    # from release-please still stand.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: matrix.path != 'services/csl'
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.path != 'services/csl'
        with:
          go-version-file: go.mod

      # darwin/arm64 only — the platform targets macOS (docs/adr/0007).
      # checksums.txt covers every tarball so a single cosign verify-blob
      # vouches for all artifacts of the release.
      - name: Build platform tarballs
        if: matrix.path != 'services/csl'
        run: |
          name=$(basename "$COMPONENT_PATH")
          version="${TAG##*/}"
          short_sha=$(git rev-parse --short HEAD)
          ldflags="-X github.com/mad01/thismoon/${COMPONENT_PATH}/internal/cli.Version=${version}-${short_sha}"
          mkdir -p dist
          for platform in darwin/arm64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" \
              -o "dist/${name}" "./${COMPONENT_PATH}/cmd/${name}"
            tar -C dist -czf "dist/${name}_${version}_${goos}_${goarch}.tar.gz" "$name"
            rm "dist/${name}"
          done
          cd dist && sha256sum ./*.tar.gz > checksums.txt

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: matrix.path != 'services/csl'

      # Verify with:
      #   cosign verify-blob \
      #     --bundle checksums.txt.bundle \
      #     --certificate-identity-regexp '^https://github.com/mad01/thismoon/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     checksums.txt
      - name: Sign checksums (keyless)
        if: matrix.path != 'services/csl'
        run: cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt

      - name: Upload release assets
        if: matrix.path != 'services/csl'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt dist/checksums.txt.bundle --clobber
