name: release

on:
  push:
    branches:
      - main
  # Rebuild the assets of a release that already exists. The tag names the
  # component; release-please-config.json maps it back to its path. Needed
  # when the run that cut a release created it but skipped the artifacts job.
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag, e.g. belt/v2.4.0"
        required: true
        type: string

# Two merges to main racing release-please can double-process the release PR.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      # Per-path outputs are keyed "<path>--tag_name"; a job can't declare
      # dynamic output names, so the whole set is forwarded as one JSON blob.
      outputs_json: ${{ toJSON(steps.release.outputs) }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN: the default token may not
      # create PRs unless a repo-wide Actions toggle is flipped — too broad a
      # grant for a public repo — and PRs it opens never trigger
      # ci.yml checks. The App mints a fresh token per run that expires within
      # the hour, so there is no long-lived PAT to rotate; its PRs still
      # trigger ci.yml. The App grants Contents + Pull requests + Issues
      # read-write on this repo only (Issues for release-please labels).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  # One matrix source for both triggers: on push, the paths release-please
  # just released and their tags; on workflow_dispatch, the one tag named by
  # the input, mapped to its path through release-please-config.json.
  plan:
    name: plan artifacts
    needs: release-please
    # release-please is skipped on workflow_dispatch; always() stops that skip
    # from cascading here, and the second clause still drops a failed run.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.plan.outputs.paths }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: github.event_name == 'workflow_dispatch'

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
          OUTPUTS_JSON: ${{ needs.release-please.outputs.outputs_json }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            component="${TAG%%/v*}"
            path=$(jq -r --arg c "$component" \
              '.packages | to_entries[] | select(.value.component == $c) | .key' \
              release-please-config.json)
            if [ -z "$path" ]; then
              echo "::error::no package with component '$component' in release-please-config.json"
              exit 1
            fi
            gh release view "$TAG" --json tagName > /dev/null
            paths=$(jq -cn --arg p "$path" '[$p]')
            tags=$(jq -cn --arg p "$path" --arg t "$TAG" '{($p): $t}')
          else
            paths="${PATHS_RELEASED:-[]}"
            # Per-path outputs are keyed "<path>--tag_name"; keep the released ones.
            tags=$(printf '%s' "${OUTPUTS_JSON:-null}" | jq -c --argjson paths "$paths" '
              (. // {})
              | with_entries(select(.key | endswith("--tag_name")))
              | with_entries(.key |= sub("--tag_name$"; ""))
              | with_entries(select(.key as $k | $paths | index($k) != null))
            ')
          fi
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "paths=$paths tags=$tags"

  # present is the one component with a container image (docs/adr/0018):
  # on a present release, build linux/amd64 and linux/arm64, push the semver
  # and latest tags to ghcr.io, and sign the manifest digest keyless. Its
  # own ubuntu job: the artifacts job runs on macOS, which has no Docker.
  image:
    name: present image
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.paths != '' && needs.plan.outputs.paths != '[]' && contains(fromJSON(needs.plan.outputs.paths), 'services/present') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing via GitHub OIDC
    env:
      TAG: ${{ fromJSON(needs.plan.outputs.tags)['services/present'] }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.TAG }}

      # Version matches the tarballs: v1.4.0-<short sha>; image tags carry
      # the bare semver plus latest.
      - id: meta
        run: |
          version="${TAG##*/}"
          echo "version=${version}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "semver=${version#v}" >> "$GITHUB_OUTPUT"

      - id: image
        uses: ./.github/actions/present-image
        with:
          push: "true"
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/mad01/present:${{ steps.meta.outputs.semver }},ghcr.io/mad01/present:latest
          version: ${{ steps.meta.outputs.version }}
          tag: ${{ env.TAG }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4

      # Verify with:
      #   cosign verify \
      #     --certificate-identity-regexp '^https://github.com/mad01/thismoon/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     ghcr.io/mad01/present:<semver>
      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/mad01/present@${{ steps.image.outputs.digest }}"

  artifacts:
    name: ${{ matrix.path }}
    needs: plan
    # On workflow_dispatch release-please is skipped, and a skip cascades
    # through every downstream job whose condition has no status function,
    # even past a plan job that ran. !cancelled() stops the cascade; the
    # explicit result check keeps a failed plan from building anything.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.paths != '' && needs.plan.outputs.paths != '[]' }}
    # macOS arm64 runner: artifacts are darwin/arm64 only (docs/adr/0007),
    # and csl needs cgo (tree-sitter grammars) — building natively on the
    # target platform sidesteps cross-compilation entirely.
    runs-on: macos-15
    permissions:
      contents: write # upload assets to the GitHub Release
      id-token: write # cosign keyless signing via GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.plan.outputs.paths) }}
    env:
      TAG: ${{ fromJSON(needs.plan.outputs.tags)[matrix.path] }}
      COMPONENT_PATH: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # darwin/arm64 only — the platform targets macOS (docs/adr/0007).
      # cgo stays off except for csl, whose tree-sitter grammars compile as
      # C; the runner is already darwin/arm64 so no cross-compile happens.
      # Swift components (a Package.swift in the component dir) build with
      # the runner's Swift toolchain; their version is baked into source by
      # release-please's generic updater, so no ldflags injection.
      # checksums.txt covers every tarball so a single cosign verify-blob
      # vouches for all artifacts of the release.
      - name: Build platform tarballs
        run: |
          # Go components name the binary after the sole cmd/ subdir, which can
          # differ from the component dir (services/keeper-of-facts -> kof).
          # Swift components have no cmd/ and keep the component dir name.
          name=$(basename "$COMPONENT_PATH")
          if [ -d "${COMPONENT_PATH}/cmd" ]; then
            name=$(basename "$(find "${COMPONENT_PATH}/cmd" -mindepth 1 -maxdepth 1 -type d | head -1)")
          fi
          version="${TAG##*/}"
          short_sha=$(git rev-parse --short HEAD)
          buildinfo="github.com/mad01/thismoon/buildinfo"
          ldflags="-X ${buildinfo}.Version=${version}-${short_sha}"
          ldflags="$ldflags -X ${buildinfo}.Commit=$(git rev-parse HEAD)"
          ldflags="$ldflags -X ${buildinfo}.Tag=${TAG}"
          ldflags="$ldflags -X ${buildinfo}.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cgo=0
          if [ "$COMPONENT_PATH" = "services/csl" ]; then cgo=1; fi
          mkdir -p dist
          for platform in darwin/arm64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            if [ -f "${COMPONENT_PATH}/Package.swift" ]; then
              # make build regenerates codegenned sources (e.g. toss-bin's
              # embedded operating doc) before compiling, so a stale
              # committed copy can never ship in a release.
              make -C "$COMPONENT_PATH" build
              cp "${COMPONENT_PATH}/.build/release/${name}" "dist/${name}"
            else
              CGO_ENABLED="$cgo" GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -ldflags "$ldflags" \
                -o "dist/${name}" "./${COMPONENT_PATH}/cmd/${name}"
            fi
            tar -C dist -czf "dist/${name}_${version}_${goos}_${goarch}.tar.gz" "$name"
            rm "dist/${name}"
          done
          cd dist && shasum -a 256 ./*.tar.gz > checksums.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4

      # Verify with:
      #   cosign verify-blob \
      #     --bundle checksums.txt.bundle \
      #     --certificate-identity-regexp '^https://github.com/mad01/thismoon/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     checksums.txt
      - name: Sign checksums (keyless)
        run: cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt dist/checksums.txt.bundle --clobber
