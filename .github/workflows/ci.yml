name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.matrix.outputs.components }}
      has_components: ${{ steps.matrix.outputs.has_components }}
      swift_components: ${{ steps.matrix.outputs.swift_components }}
      has_swift: ${{ steps.matrix.outputs.has_swift }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # A component missing from release-please-config.json would silently
      # never release — fail the PR instead.
      - name: Release config covers all components
        run: |
          diff \
            <(jq -r '.packages | keys[]' release-please-config.json | sort) \
            <(for dir in services/*/ tools/*/; do [ -f "${dir}Makefile" ] && echo "${dir%/}"; done | sort) \
            || { echo "::error::release-please-config.json packages out of sync with services/*, tools/*"; exit 1; }

      # Serve-bearing components must ship a doctor subcommand (ADR-0009,
      # docs/adr/0009-agent-facing-operating-docs.md). The list is explicit,
      # not inferred from directories: some tools carry MCP subcommands with
      # no doctor obligation, and belt/suspenders keep best-effort doctors
      # outside the requirement.
      - name: Serve-bearing components ship a doctor
        run: |
          required='
            services/keeper-of-facts
            services/events
            services/deps
            services/present
            services/speak
            services/status
            services/catalog
            services/csl
            services/d-man
          '
          fail=0
          for c in $required; do
            if [ ! -f "${c}/internal/cli/doctor.go" ] && ! grep -rq 'DoctorCommand(' --include='*.go' "$c" 2>/dev/null; then
              echo "::error::${c} ships no doctor subcommand (expected ${c}/internal/cli/doctor.go or a 'DoctorCommand(' registration) — required for serve-bearing components by ADR-0009"
              fail=1
            fi
          done
          exit $fail

      # Filters are generated, not hand-maintained: one filter per component
      # (a directory under services/ or tools/ with a Makefile) plus a fanout
      # filter for changes that affect every component.
      - name: Generate path filters
        run: |
          {
            echo "fanout:"
            echo "  - 'webkit/**'"
            echo "  - 'go.mod'"
            echo "  - 'go.sum'"
            echo "  - '.golangci.yml'"
            echo "  - '.github/workflows/**'"
            for dir in services/*/ tools/*/; do
              [ -f "${dir}Makefile" ] || continue
              c="${dir%/}"
              echo "${c}:"
              echo "  - '${c}/**'"
            done
          } > .github/filters.generated.yml
          cat .github/filters.generated.yml

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: .github/filters.generated.yml

      # Swift components (a Package.swift beside the Makefile) split into
      # their own matrix: the Go toolchain steps don't apply to them and
      # they need a macOS runner.
      - name: Build component matrix
        id: matrix
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          all=$(for dir in services/*/ tools/*/; do
            [ -f "${dir}Makefile" ] && echo "${dir%/}"
          done | jq -R . | jq -sc .)
          all_swift=$(for dir in services/*/ tools/*/; do
            [ -f "${dir}Makefile" ] && [ -f "${dir}Package.swift" ] && echo "${dir%/}"
          done | jq -R . | jq -sc .)
          if echo "$CHANGES" | jq -e 'index("fanout")' > /dev/null; then
            changed="$all"
          else
            changed=$(echo "$CHANGES" | jq -c .)
          fi
          components=$(echo "$changed" | jq -c --argjson swift "$all_swift" '. - $swift')
          swift_components=$(echo "$changed" | jq -c --argjson swift "$all_swift" 'map(select(IN($swift[])))')
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "has_components=$(echo "$components" | jq 'length > 0')" >> "$GITHUB_OUTPUT"
          echo "swift_components=$swift_components" >> "$GITHUB_OUTPUT"
          echo "has_swift=$(echo "$swift_components" | jq 'length > 0')" >> "$GITHUB_OUTPUT"
          echo "matrix: go=$components swift=$swift_components"

  component:
    name: ${{ matrix.component }}
    needs: changes
    if: needs.changes.outputs.has_components == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: ./${{ matrix.component }}/...

      - name: Test
        env:
          COMPONENT: ${{ matrix.component }}
        run: go test "./${COMPONENT}/..."

      - name: Build
        env:
          COMPONENT: ${{ matrix.component }}
        run: go build "./${COMPONENT}/..."

  component-swift:
    name: ${{ matrix.component }}
    needs: changes
    if: needs.changes.outputs.has_swift == 'true'
    # Swift components target macOS APIs; build and test on the platform
    # they ship to instead of standing up Swift on Linux.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.swift_components) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Test
        env:
          COMPONENT: ${{ matrix.component }}
        run: make -C "$COMPONENT" test

      # make test regenerates codegenned sources before running, so a stale
      # committed copy would pass silently — fail the PR if regeneration
      # changed what is checked in.
      - name: Generated files are committed
        run: git diff --exit-code tools/toss-bin/Sources/TossBinCore/OperatingDoc.generated.swift

      - name: Build
        env:
          COMPONENT: ${{ matrix.component }}
        run: make -C "$COMPONENT" build

  # present's shared mode runs in Kubernetes: build the image, stand up a
  # kind cluster, roll the manifests, and run the cluster-gated tests (the
  # store conformance suite against the API server and the HTTP end-to-end
  # test through a port-forward). Runs whenever present is in the matrix,
  # which includes fanout changes, since webkit and go.mod are baked in.
  present-kind:
    name: present in kind
    needs: changes
    if: needs.changes.outputs.has_components == 'true' && contains(fromJSON(needs.changes.outputs.components), 'services/present')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/present-image
        with:
          load: "true"
          platforms: linux/amd64
          tags: ghcr.io/mad01/present:ci
          version: ${{ github.sha }}

      # Same kind release and node image as the local kind-test target, so
      # CI and a developer machine exercise the same Kubernetes minor. The
      # binary comes straight from the kind release with its checksum
      # verified: helm/kind-action is not on this repo's allowed-actions list.
      - name: Create kind cluster
        env:
          KIND_VERSION: v0.32.0
          KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
          KIND_NODE_IMAGE: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
        run: |
          curl -fsSL -o kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind create cluster --name present --image "$KIND_NODE_IMAGE" --wait 120s

      - name: Load image and roll out
        run: |
          kind load docker-image ghcr.io/mad01/present:ci --name present
          kubectl apply -k services/present/deploy/overlays/kind
          kubectl -n present rollout status deploy/present --timeout=180s

      - name: Cluster-gated tests
        run: services/present/scripts/kind-e2e.sh

      - name: Dump cluster state
        if: failure()
        run: |
          kubectl -n present get all -o wide || true
          kubectl -n present describe pods || true
          kubectl -n present logs deploy/present --all-containers --tail=200 || true

  # Every push to main that touched present publishes a moving image tag
  # for machines that track main, next to the release job's semver tags.
  present-image-main:
    name: present image (main)
    needs: present-kind
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing via GitHub OIDC
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: image
        uses: ./.github/actions/present-image
        with:
          push: "true"
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/mad01/present:main,ghcr.io/mad01/present:sha-${{ steps.meta.outputs.short }}
          version: ${{ steps.meta.outputs.short }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4

      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/mad01/present@${{ steps.image.outputs.digest }}"

  repo-safety-net:
    name: Repo-wide vet and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Test recipes
        run: make test-recipes

      # go list exits non-zero both when the module has no packages AND when a
      # package is broken — only the first may skip; the second must fail loud
      # (a broken go:embed once turned this job into a silent false green).
      - name: Vet, build, test
        run: |
          if out=$(go list ./... 2>&1); then
            go vet ./...
            go build ./...
            go test ./...
          elif echo "$out" | grep -q "matched no packages"; then
            echo "no Go packages yet, skipping"
          else
            echo "$out"
            exit 1
          fi
