# The humanizer vale style pack is full of long rule regexes whose
# `tokens: '...'` lines pattern-match as secret assignments. Suppress scan
# findings from the style pack instead of mangling the rules.
#
# tools/suspenders and its scanner in kit/secretscan are full of
# secret-shaped fixtures by design: detection rules, test inputs, and README
# examples. Suppress scan findings from those paths instead of obfuscating
# the fixtures into dummy values that no longer exercise the rules (carried
# over from the standalone repo's own .suspenders.yaml, scoped to the
# component).
paths:
  - "**/tools/humanizer/internal/rules/vale/**"
  - "**/tools/suspenders/**/*_test.go"
  - "**/tools/suspenders/**/rules.go"
  - "**/tools/suspenders/tests/integration/**"
  - "**/tools/suspenders/README.md"
  - "**/kit/secretscan/*_test.go"
  - "**/kit/secretscan/rules.go"
  # brain refuses to write a note that holds a secret; the tests proving it
  # keep AWS's documented example key id in their secrets_test.go files.
  - "**/services/brain/internal/*/secrets_test.go"

# Go struct literals like `apiKey: cfg.APIKey` read as YAML-style secret
# assignments to the unquoted-secret-assignment rule; the right-hand side is
# a field reference, not a value. Patterns are literal substrings.
patterns:
  - cfg.APIKey
