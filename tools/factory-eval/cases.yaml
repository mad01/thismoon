# factory-eval cases file (MAD-402). The user signs this file off before the
# first paid run, and again after any change to it. To sign off, run
# `factory-eval run --dry-run`, then set sign_off.by to a name, sign_off.date
# to the date as YYYY-MM-DD, and sign_off.digest to the digest the dry run
# prints. The digest is the sha256 of this file with each sign_off line
# rewritten to its key and an empty value (`  by: ""`), so filling in the
# three values does not change it, and any other edit does: a paid run
# refuses when the digest no longer matches.
#
# Provenance labels:
#   measured   computed from the repo at the pinned commit (`factory-eval measure`)
#   spec       from MAD-402, the factory spec page, or the shared docs outline (MAD-217)
#   judgement  a choice made for this harness, open to the user's veto
version: 1
repo: ~/code/src/github.com/mad01/thismoon
commit: 45518e8b8461d491dc2a1aafaf1a8aa56702858a
sign_off:
  by: ""
  date: ""
  digest: ""
runs: 3                   # spec: three runs per arm
timeout_minutes: 90       # judgement: per arm run, wall clock
batch_ceiling_usd: 250    # judgement: a paid batch refuses to start when its worst case exceeds this

tiers:
  - name: mid
    model: sonnet
    effort: medium
    worker: factory-worker-medium
    budget_usd: 10          # judgement: about 2x the per-run estimate of $5 (sign-off digest)
    primary: true
    provenance: spec        # routing.md: a docs sweep is a known-domain unit, mid tier, medium effort
  - name: top
    model: opus
    effort: high
    worker: factory-worker-high
    budget_usd: 25          # judgement: about 2x the per-run estimate of $10 to $12 (sign-off digest)
    provenance: spec        # MAD-402: the same unit at a second tier seeds the routing table

outline:
  provenance: spec          # MAD-217 shared outline; present's CLAUDE.md is the exemplar
  claude_md:
    title: name-comma-purpose
    sections:
      - {heading: "Module layout", required: true}
      - {heading: "How it works", required: true}
      - {heading: "Data model & storage"}
      - {heading: "Build / install / test", required: true}
      - {heading: "HTTP API"}
      - {heading: "Commands"}
      - {heading: "MCP tools"}
      - {heading: "Shared UI: webkit"}
      - {heading: "Gotchas", required: true}
      - {heading: "See also", required: true}
  readme:
    title: name
    sections:
      - {heading: "How it works"}
      - {heading: "Install", required: true}
      - {heading: "Usage", required: true}
      - {heading: "Endpoints"}
      - {heading: "MCP"}
      - {heading: "Configuration"}
      - {heading: "Where things live"}
      - {heading: "Develop", required: true}
      - {heading: "License"}
      - {heading: "Docs", required: true}   # measured: every component README ends with it

humanizer:
  min_severity: warning     # spec: zero findings at warning level
  # measured: these two rules fire on every component doc at the pin, on text
  # the outline itself requires. TitleCaseHeadings flags "# events" and
  # "## MCP"; BoldOveruse flags a single bold lead-in. Counting them would
  # make the done criterion unreachable.
  ignore_rules:
    - Humanizer.TitleCaseHeadings
    - Humanizer.BoldOveruse
  provenance: measured

judge:
  model: haiku              # judgement: claude -p on Haiku 5.5, one credential for arms and judge
  budget_usd: 0.25
  provenance: judgement
  rubric: |
    Score the after version of both files from 0 to 10. Start at 10 and take points off:
    - Facts: take 3 points for each fact the after version invents, contradicts, or drops
      compared with the before version. Moving a fact to another section is not a loss.
    - Glossary: take 1 point for each place the after version uses a banned synonym for a
      glossary concept, whether it was there before or is new.
    - Clarity: take 1 point for each paragraph a reader has to read twice: a buried lead, a
      sentence that strings several clauses together, a pronoun with no clear referent.
    - Placement: take 1 point for each block of text that sits under a heading it does not
      belong to after the reorder.
    - Voice: take 1 point for each instance of filler, promotional wording, or hedging that the
      before version did not have.
    The score never goes below 0.
  do_not_fail:
    - Text that is shorter than the before version, when no fact was lost.
    - Wording kept from the before version where it was already clear.
    - Third-level headings that hold sections the outline does not list.
    - Headings the outline requires, such as "MCP tools", "HTTP API" or a lowercase component name.
    - Technical terms, code spans, command lines and file paths, even long ones.
    - Component-specific terms the glossary does not define.
    - Bold lead-ins on bullet points.
    - Lists and tables where the before version used them.
  # The judge gets each glossary file of the case (cases[].glossary, the root
  # CONTEXT.md when a case lists none) as it reads at the pinned commit, and
  # these notes beside them.
  glossary_notes: |
    Each glossary file lists its terms in bold. The _Avoid_ line under a term names the synonyms it bans.
    Exception: t-man's launchd Agents and Daemons are the correct LaunchAgents and LaunchDaemons terms.

arms:
  single:
    provenance: judgement
    preamble: |
      You are the single agent in one run of the factory eval. Work alone: do not spawn subagents.

      The repo is a throwaway clone of thismoon at {{.Repo}}, detached at commit {{.Commit}}. It has no remote.

      Do not push, and do not add a remote.
      Do not edit any file outside the allowed paths of the case you work on.
      The csl and kof tools are not attached in this run: use grep and git in their place.
      Do not ask questions: nobody can answer them during this run. Record a blocker in the final report and go on to the next case.

      Work through the cases in the order given. For each case:
      1. Run `git switch -c <branch> {{.Commit}}` in {{.Repo}}, with the case's branch.
      2. Do the case's task.
      3. Commit the changed files on that branch.
      4. Run `git switch --detach {{.Commit}}` before the next case.

      When every case is done or blocked, reply with the final report the JSON schema asks for: one entry per case with its component, branch, status and commit.
  factory:
    provenance: judgement
    preamble: |
      You are the factory orchestrator in one run of the factory eval. Use the factory skill: run each case below as one unit, with one worker per unit.

      The repo is a throwaway clone of thismoon at {{.Repo}}, detached at commit {{.Commit}}. It has no remote. Treat {{.Repo}} as the canonical checkout.

      Do not push, and do not add a remote.
      Do not edit files yourself: the workers make every edit.
      The csl and kof tools are not attached in this run: use grep and git in their place.
      Do not ask questions: nobody can answer them during this run. Record a blocked unit or an open question in the final report.

      These changes to the factory procedure apply to this run:
      - Claim each worktree under {{.Worktrees}}, not under ~/.worktrees: `git -C {{.Repo}} worktree add {{.Worktrees}}/<slug> -b <branch> {{.Commit}}`, with the case's branch.
      - Route every unit at model {{.Model}} and effort {{.Effort}}, with the worker definition {{.Worker}}.
      - Skip the board, the kof parking and the worklog checkpoints: those services are not part of this run. Run preflight check 4 only.
      - The harness sets the git identity in the local config of the clone, so commits in every worktree use it without a prompt.
      - Spawn all workers in one message so they run at the same time. Spawn them unnamed so each worker's final message comes back to you.
      - Do not land, merge or rebase the branches. Leave each unit committed on its own branch: the harness reads the branches.

      Each case below is one unit's task. Put its steps, the shared outline and the checks into that unit's task message.

      When every unit is ready or blocked, reply with the final report the JSON schema asks for: one entry per case with its component, branch, status and commit.

cases:
  # Selection (measured): `factory-eval measure` at the pinned commit ranks the components by
  # outline problems plus humanizer findings. These are the top four after three exclusions
  # (judgement): services/present is the outline's exemplar, services/csl builds with cgo and
  # is the slowest build by far, and tools/humanizer's docs quote the patterns it detects,
  # so zero findings could force dropping examples.
  - component: tools/belt
    branch: eval/docs-sweep-belt
    allowed_paths: [tools/belt/README.md, tools/belt/CLAUDE.md]
    task: |
      Bring the README.md and CLAUDE.md of the belt tool to the shared outline and to the glossary in CONTEXT.md at the repo root.

      Do not edit any file except tools/belt/README.md and tools/belt/CLAUDE.md.
      Do not invent, drop or trim facts. Move and reword text only.

      1. Open tools/belt/README.md and tools/belt/CLAUDE.md.
      2. Fix the first line of each file to the title form of the outline.
      3. Reorder the second-level sections of each file to the outline order.
      4. Move each section that the outline does not list under the nearest listed section, as a third-level heading.
      5. Replace each banned synonym with its glossary term.
      6. Run `humanizer detect --min-severity warning` on both files and fix each finding outside the ignored rules.
      7. Run `make -C tools/belt build test` and make sure that it passes.
      8. Commit both files on the branch eval/docs-sweep-belt.
    done: >-
      Both files follow the shared outline, humanizer finds nothing at warning level outside the ignored rules, `make -C tools/belt build test` passes, and the branch eval/docs-sweep-belt has commits that change only the allowed paths.
    deviation:            # measured: CLAUDE.md EmDashOveruse=12, SentenceLength=4; README.md SentenceLength=1
      claude_md: {outline: [], humanizer_warnings: 16}
      readme: {outline: ["unknown: Guards", "unknown: Hints", "unknown: Ledger and watcher"], humanizer_warnings: 1}
      total: 20
    provenance: {selection: measured, allowed_paths: spec, task: judgement, done: spec}
  - component: services/speak
    branch: eval/docs-sweep-speak
    allowed_paths: [services/speak/README.md, services/speak/CLAUDE.md]
    task: |
      Bring the README.md and CLAUDE.md of the speak service to the shared outline and to the glossary in CONTEXT.md at the repo root.

      Do not edit any file except services/speak/README.md and services/speak/CLAUDE.md.
      Do not invent, drop or trim facts. Move and reword text only.

      1. Open services/speak/README.md and services/speak/CLAUDE.md.
      2. Fix the first line of each file to the title form of the outline.
      3. Reorder the second-level sections of each file to the outline order.
      4. Move each section that the outline does not list under the nearest listed section, as a third-level heading.
      5. Replace each banned synonym with its glossary term.
      6. Run `humanizer detect --min-severity warning` on both files and fix each finding outside the ignored rules.
      7. Run `make -C services/speak build test` and make sure that it passes.
      8. Commit both files on the branch eval/docs-sweep-speak.
    done: >-
      Both files follow the shared outline, humanizer finds nothing at warning level outside the ignored rules, `make -C services/speak build test` passes, and the branch eval/docs-sweep-speak has commits that change only the allowed paths.
    deviation:            # measured: CLAUDE.md EmDashOveruse=5
      claude_md: {outline: ["order: MCP tools"], humanizer_warnings: 5}
      readme: {outline: ["unknown: Providers", "unknown: MCP server"], humanizer_warnings: 0}
      total: 8
    provenance: {selection: measured, allowed_paths: spec, task: judgement, done: spec}
  - component: tools/t-man
    branch: eval/docs-sweep-t-man
    allowed_paths: [tools/t-man/README.md, tools/t-man/CLAUDE.md]
    task: |
      Bring the README.md and CLAUDE.md of the t-man tool to the shared outline and to the glossary in CONTEXT.md at the repo root.

      Do not edit any file except tools/t-man/README.md and tools/t-man/CLAUDE.md.
      Do not invent, drop or trim facts. Move and reword text only.

      1. Open tools/t-man/README.md and tools/t-man/CLAUDE.md.
      2. Fix the first line of each file to the title form of the outline.
      3. Reorder the second-level sections of each file to the outline order.
      4. Move each section that the outline does not list under the nearest listed section, as a third-level heading.
      5. Replace each banned synonym with its glossary term.
      6. Run `humanizer detect --min-severity warning` on both files and fix each finding outside the ignored rules.
      7. Run `make -C tools/t-man build test` and make sure that it passes.
      8. Commit both files on the branch eval/docs-sweep-t-man.
    done: >-
      Both files follow the shared outline, humanizer finds nothing at warning level outside the ignored rules, `make -C tools/t-man build test` passes, and the branch eval/docs-sweep-t-man has commits that change only the allowed paths.
    deviation:            # measured: CLAUDE.md EmDashOveruse=4, SentenceLength=2; README.md SentenceLength=1
      claude_md: {outline: [], humanizer_warnings: 6}
      readme: {outline: ["unknown: Acknowledgments"], humanizer_warnings: 1}
      total: 8
    provenance: {selection: measured, allowed_paths: spec, task: judgement, done: spec}
  - component: tools/suspenders
    branch: eval/docs-sweep-suspenders
    allowed_paths: [tools/suspenders/README.md, tools/suspenders/CLAUDE.md]
    glossary: [CONTEXT.md, tools/suspenders/CONTEXT.md]   # spec: the task names both glossaries
    task: |
      Bring the README.md and CLAUDE.md of the suspenders tool to the shared outline and to the glossaries in CONTEXT.md at the repo root and in tools/suspenders/CONTEXT.md.

      Do not edit any file except tools/suspenders/README.md and tools/suspenders/CLAUDE.md.
      Do not invent, drop or trim facts. Move and reword text only.

      1. Open tools/suspenders/README.md and tools/suspenders/CLAUDE.md.
      2. Fix the first line of each file to the title form of the outline.
      3. Reorder the second-level sections of each file to the outline order.
      4. Move each section that the outline does not list under the nearest listed section, as a third-level heading.
      5. Replace each banned synonym with its glossary term.
      6. Run `humanizer detect --min-severity warning` on both files and fix each finding outside the ignored rules.
      7. Run `make -C tools/suspenders build test` and make sure that it passes.
      8. Commit both files on the branch eval/docs-sweep-suspenders.
    done: >-
      Both files follow the shared outline, humanizer finds nothing at warning level outside the ignored rules, `make -C tools/suspenders build test` passes, and the branch eval/docs-sweep-suspenders has commits that change only the allowed paths.
    deviation:            # measured: CLAUDE.md EmDashOveruse=2
      claude_md: {outline: ["unknown: Configuration"], humanizer_warnings: 2}
      readme: {outline: ["unknown: Quickstart", "unknown: When a block is wrong", "unknown: Features", "unknown: Detection rules"], humanizer_warnings: 0}
      total: 7
    provenance: {selection: measured, allowed_paths: spec, task: judgement, done: spec}
