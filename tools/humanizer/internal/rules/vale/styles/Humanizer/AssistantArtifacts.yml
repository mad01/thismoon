# humanizer-id: Humanizer.AssistantArtifacts
# humanizer-name: Assistant paste artifact
# humanizer-category: communication
# humanizer-summary: Machine tokens left by non-ChatGPT assistants (Gemini cite/span markers, Grok citation cards, DeepSeek lenticular citations, Perplexity upload paths).
# humanizer-rationale: Internal citation and rendering markers other chatbots emit; a human never types them, so their presence is near-certain paste residue. Complements Humanizer.ChatGPTArtifacts, which covers the OpenAI-specific tokens.
# humanizer-before: The market grew 40% in 2024 [cite: 3], driven by exports [span_1](start_span).
# humanizer-after: The market grew 40% in 2024, driven by exports.
# humanizer-reference: Wikipedia:Signs_of_AI_writing
extends: existence
message: "Assistant paste artifact: '%s' — remove; this is copy-paste residue from a chatbot."
level: error
nonword: true
tokens:
  - '\[cite:\s*\d+\]'
  - '\[span_\d+\]\(start_span\)'
  - '\(end_span\)'
  - 'grok_render_citation_card_json'
  - 'grok_card'
  - '【\d+†'
  - 'ppl-ai-file-upload'
  - ':::writing'
