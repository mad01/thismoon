# humanizer-id: Humanizer.AIVocabulary
# humanizer-name: AI vocabulary
# humanizer-category: language
# humanizer-summary: Words that spike in post-2023 LLM output (delve, tapestry, testament, pivotal, underscore, landscape...).
# humanizer-rationale: Individual words are fine; their co-occurrence is a strong LLM tell.
# humanizer-before: An enduring testament to Italian colonial influence, showcasing the culinary landscape.
# humanizer-after: Pasta dishes, introduced during Italian colonization, remain common in the south.
# humanizer-reference: Wikipedia:Signs_of_AI_writing#Overused_AI_vocabulary
extends: existence
message: "AI vocabulary word: '%s' — prefer a concrete alternative."
level: warning
ignorecase: true
