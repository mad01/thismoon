# humanizer-id: Humanizer.FillerPhrases
# humanizer-name: Filler phrases
# humanizer-category: communication
# humanizer-summary: Verbose phrases with concise equivalents.
# humanizer-rationale: AI output uses filler that stretches sentences without adding meaning.
# humanizer-before: In order to achieve this goal, due to the fact that it was raining, we adjusted the schedule.
# humanizer-after: To achieve this, because it was raining, we adjusted the schedule.
# humanizer-reference: Wikipedia:Signs_of_AI_writing#Filler_phrases
extends: substitution
message: "Use '%s' instead of '%s'."
level: suggestion
ignorecase: true
swap:
  'in order to': to
  'due to the fact that': because
  'at this point in time': now
  'at the present time': now
  'in the event that': if
  'in the process of': during
  'has the ability to': can
  'have the ability to': can
  'is able to': can
  'is capable of': can
  'prior to': before
  'subsequent to': after
  'in excess of': more than
  'the majority of': most
  'a majority of': most
  'a large number of': many
  'a small number of': a few
  'a number of': several
  'as a result of': because of
  'despite the fact that': although
  'in spite of the fact that': although
  'in spite of': despite
  'until such time as': until
  'whether or not': whether
  'in the near future': soon
  'in the vicinity of': near
  'in close proximity to': near
  'make a decision': decide
  'make use of': use
  'take into consideration': consider
  'give consideration to': consider
  'is in a position to': can
  'not in a position to': unable to
  'in a timely manner': promptly
  'at this time': now
  'at a later date': later
  'at all times': always
  'on a regular basis': regularly
  'in conjunction with': with
  'in the absence of': without
  'for the purpose of': to
  'with the exception of': except
  'in lieu of': instead of
  'with regard to': about
  'with respect to': about
  'in regard to': about
  'in relation to': about
  'in addition(?! to)': also
  'in order that': so that
  'in the case of': for
  'in many cases': often
  'in most cases': usually
  'in some cases': sometimes
  'as per': per
  'based on the fact that': because
  'by means of': by
  'by virtue of': because of
  'for the duration of': during
  'during the course of': during
  'came to the conclusion': concluded
  'reach a conclusion': conclude
  'come to an agreement': agree
  'are in agreement': agree
  'perform an assessment of': assess
  'conduct a review of': review
  'conduct an investigation': investigate
  'carry out an evaluation of': evaluate
  'in an effort to': to
  'has the capacity to': can
  'has the opportunity to': could
  'each and every': every
  'first and foremost': first
  'any and all': all
  'in a nutshell': in short
