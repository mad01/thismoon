# humanizer-id: Humanizer.AcronymFirstUse
# humanizer-name: Acronym never spelled out
# humanizer-category: clarity
# humanizer-summary: A 3 to 5 letter acronym used without ever being expanded in the document.
# humanizer-rationale: A reader who lands on the page cold has to guess what the letters stand for. Spell the full name out once, put the short form in parentheses, and use the short form after that. Acronyms every developer knows (HTTP, JSON, API, CLI) are exempt.
# humanizer-before: The SBOM is generated at release time and attached to the tarball beside the checksums.
# humanizer-after: The software bill of materials (SBOM) is generated at release time and attached to the tarball beside the checksums.
# humanizer-reference: https://vale.sh/explorer/Std (Std.Abbreviations.Acronyms)
extends: conditional
message: "'%s' is never spelled out. Expand it on first use, then keep the short form."
level: suggestion
ignorecase: false
first: '\b([A-Z]{3,5})\b(?!-\d)'
second: '\(([A-Z]{3,5})\)'
exceptions:
