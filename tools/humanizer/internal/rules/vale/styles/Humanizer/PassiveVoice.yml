# humanizer-id: Humanizer.PassiveVoice
# humanizer-name: Passive voice
# humanizer-category: language
# humanizer-summary: Be-verb + past participle ("was generated", "is handled by"), often hiding the actor.
# humanizer-rationale: LLM prose leans passive; active voice names the actor and reads more direct.
# humanizer-before: The report was generated by the system and the results were reviewed.
# humanizer-after: The system generated the report and we reviewed the results.
# humanizer-reference: Wikipedia:Signs_of_AI_writing#Tone
extends: existence
message: "Passive construction '%s' — prefer active voice that names the actor."
level: suggestion
ignorecase: true
tokens:
  - '\b(?:is|are|was|were|be|been|being)\s+(?:\w+ly\s+)?\w+ed\s+by\b'
  - '\b(?:is|are|was|were|be|been|being)\s+(?:\w+ly\s+)?(?:given|taken|made|done|shown|written|seen|known|held|kept|built|sent|told|found|brought|chosen|driven|handled|generated|produced|created|defined|determined|performed|conducted|preserved|stored|saved|applied|updated|removed|installed|configured)\b'
  - '(?m)^no [\w -]{1,40}(?:needed|required)\b'
