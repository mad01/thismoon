# humanizer vale config — embedded in the humanizer binary via go:embed.
# On first run, `humanizer` extracts this plus the Humanizer style pack
# under ~/.cache/humanizer/vale/ and invokes vale with --config pointing
# at the extracted copy. See internal/detect/vale.go.

StylesPath = styles

MinAlertLevel = suggestion

[formats]
txt = md

[*.md]
BasedOnStyles = Humanizer
