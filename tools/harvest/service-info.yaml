apiVersion: catalog.mad01/v1alpha1
kind: Component
metadata:
  name: harvest
  description: Saves what a Claude Code session learned to the brain vault inbox as raw captures, from a SessionEnd hook, and nudges about captures that wait for review
  tags: [go, cli, hooks]
spec:
  type: cli
  lifecycle: development
  owner: mad01
  system: thismoon
  # Sandbox access for the steps of `harvest run` (prepare, complete and
  # apply), rendered to recipes/harvest/harvest.srt.json by
  # `make sandbox-settings` (docs/SANDBOXING.md, "Declaring access"). The
  # state dir is the workdir; each run's job dir lives in it. prepare reads
  # the transcript under ~/.claude/projects. apply runs `brain capture`,
  # which reads ~/.config/brain, takes its write lock and updates its indexes
  # under ~/.local/state/brain, asks ollama on 127.0.0.1:11434 for the
  # duplicate check (a peer by name: allowLocalBinding covers it), and
  # commits the note with git, which reads ~/.gitconfig. The vault, the
  # targets of links such as config.yaml and ~/.gitconfig, and whatever the
  # vault's own commit hook reads differ per machine, so a machine grants
  # them in ~/.config/srt/harvest.local.json.
  # Only the complete step is handed a host: harvest passes the model
  # provider's host as SRT_RUN_ALLOW_DOMAINS to that step alone. The claude
  # CLI backend's model step runs outside srt, since its login is in the
  # keychain.
  access:
    sandbox: srt
    workdir: ~/.local/state/harvest
    local: [ollama]
    egress: [via SRT_RUN_ALLOW_DOMAINS]
    reads: [~/.claude/projects, ~/.config/brain, ~/.local/state/brain, ~/.gitconfig, ~/code/bin, workdir]
    writes: [workdir, ~/.local/state/brain, temp]
    tls: true
