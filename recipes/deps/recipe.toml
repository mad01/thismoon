[recipe]
name = "deps"
description = "deps, supply-chain dependency scanner: discovers deps across the tool repos, checks OSV.dev, notifies on flagged packages"
wave = 0
# No profile gate: depends on d-man + t-man (both ship from this repo) and a
# catalog registry; the machine's registry.yaml scopes which repos it scans.

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the paths below name that cache directly.
# Relative [dotfiles] sources DO resolve against the recipe dir in the cache.
[packages.deps]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/services/deps"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/deps"]

# Restart the serve agent when the freshly installed binary actually changed.
# ralph hashes install_paths and runs this only when the bytes differ. The
# `t-man status` guard skips the restart on first install, where this fires
# before [hooks.builds.deps_service] has registered the agent.
[packages.deps.service]
restart = "if command -v t-man >/dev/null && t-man status deps >/dev/null 2>&1; then t-man restart deps; fi"

[directories.deps_config]
target = "~/.config/deps"

# Discovery config (exclude_repos / exclude_paths). Managed here and symlinked
# into place. Editing it takes effect on the next scan with no restart.
[dotfiles.deps_config]
source = "config.toml"
target = "~/.config/deps/config.toml"
action = "symlink"

[hooks]
# Stop and remove the t-man-managed serve agent during cleanup, before the
# binary it runs is removed (ralph disable thismoon/deps && ralph up --enable-cleanup).
pre_uninstall = ["if command -v t-man >/dev/null; then t-man remove deps 2>/dev/null; fi || true"]

# Keep the serve launcher executable (git carries the mode bit, this is the
# belt-and-braces the present recipe uses for its launchers too).
[hooks.builds.deps_chmod_serve_launcher]
commands = ["chmod +x deps-serve.sh"]
working_dir = "~/.config/ralph/sources/thismoon/recipes/deps"
run = "always"
idempotent = true

# Register `deps serve` as a long-running launchd user agent via t-man. This
# process owns the scan store, runs the daily catch-up scan loop, and fires
# notifications; the MCP server (registered through the consuming repo's
# agent-sync servers.json) is a thin HTTP client to it. Idempotent;
# run = "always" keeps it registered and self-heals if removed. The agent runs
# deps-serve.sh rather than the binary: the launcher puts the mise shims on
# PATH so Go discovery finds `go`, which the launchd PATH below lacks.
[hooks.builds.deps_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name deps --path /opt/homebrew/bin:/usr/bin:/bin:/usr/local/bin --env GOPATH=$HOME/code --env GOMODCACHE=$HOME/code/pkg/mod -- $HOME/.config/ralph/sources/thismoon/recipes/deps/deps-serve.sh --port 7429 --workdir $HOME/.local/share/deps; else echo 'deps: skip service (t-man not on PATH; install t-man then run: t-man add --name deps -- deps serve --port 7429)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/deps"
run = "always"
depends_on = ["packages.deps", "packages.t_man"]
