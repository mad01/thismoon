[recipe]
name = "keep"
description = "keep — local assertion store with evidence pins; CLI + MCP + web view for an agent's world model"
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the paths below name that cache directly.
[packages.keep]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/services/keep"
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/keep"]

# Restart the serve agent when the freshly installed binary actually changed.
# ralph hashes install_paths and runs this only when the bytes differ. The
# `t-man status` guard skips the restart on first install, where this fires
# before [hooks.builds.keep_service] has registered the agent.
[packages.keep.service]
restart = "if command -v t-man >/dev/null && t-man status keep >/dev/null 2>&1; then t-man restart keep; fi"

[hooks]
# Stop and remove the t-man-managed serve agent during cleanup, before the
# binary it runs is removed (ralph disable thismoon/keep && ralph up --enable-cleanup).
pre_uninstall = ["if command -v t-man >/dev/null; then t-man remove keep 2>/dev/null; fi || true"]

# Register `keep serve` as a long-running launchd user agent via t-man. This
# process owns the assertions.json store; the MCP server (registered in the
# the consuming repo's recipes/claude-mcp/servers.json) is a thin HTTP client to it.
# Idempotent; run = "always" keeps it registered and self-heals if it was removed.
[hooks.builds.keep_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name keep -- $HOME/code/bin/keep serve --port 7431 --workdir $HOME/.local/share/keep; else echo 'keep: skip service (t-man not on PATH; install t-man then run: t-man add --name keep -- keep serve --port 7431)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/keep"
run = "always"
depends_on = ["packages.keep", "packages.t_man"]
