# codesign: creates and trusts the self-signed "mad01 Local Signing"
# certificate that every component Makefile's install path signs with, so a
# rebuilt binary keeps its code-signing identity (docs/adr/0004). No binary,
# no package: one hook.
[recipe]
name = "codesign"
description = "codesign: self-signed code signing certificate that gives locally built binaries a stable identity"
# wave 0, like the component recipes. Within a wave ralph orders builds and
# packages alphabetically by key, so builds.codesign_cert runs before every
# packages.* build.
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on builds, so the path below names that cache directly.
# run = "once": setup.sh skips when the cert already exists; run it by hand
# after a keychain reset.
[hooks.builds.codesign_cert]
commands = ["bash ./setup.sh"]
working_dir = "~/.config/ralph/sources/thismoon/recipes/codesign"
run = "once"
