# t-man — platform foundation: every service recipe in this repo hard-depends
# on packages.t_man (allowed for foundations, see docs/adr/0006).
[recipe]
name = "t-man"
description = "t-man — idempotent macOS launchd service manager (agents + daemons)"
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the path below names that cache directly.
#
# No service block and no t-man-add hook: t-man is a CLI, not a launchd
# service. Services launched from its plists keep running when the binary is
# rebuilt, so there is nothing to restart.
[packages.t_man]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/tools/t-man"
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/t-man"]
