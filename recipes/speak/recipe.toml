[recipe]
name = "speak"
description = "speak — the Go speak-web front-end for http://speak.this + the sandbox-watch seatbelt-denial notifier. The Kokoro TTS engine lives in the consuming repo's speak-tts recipe."
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the paths below name that cache directly.
#
# speak-web (Go, services/speak/) — upload-a-markdown-and-listen page + CORS
# reverse proxy /v1/audio/speech -> the TTS engine, so present/csl pages can
# fetch speech cross-origin. The engine it proxies to (speak-tts on
# 127.0.0.1:8765) is machine wiring and stays in the consuming repo; if its
# agent is down the page serves but the speech endpoints have nothing to reach.
#
# sandbox-watch — streams seatbelt denials for all sandboxed t-man services,
# so it lives here rather than with the engine: it is wanted on every machine
# that runs a sandboxed service, not just the ones with the TTS engine.

[packages.speak]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/services/speak"
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/speak"]

# Restart the web agent when the freshly installed binary actually changed.
# ralph hashes install_paths and runs this only when the bytes differ. The
# `t-man status` guard skips the restart on first install, where this fires
# before [hooks.builds.speak_web_service] has registered the agent.
[packages.speak.service]
restart = "if command -v t-man >/dev/null && t-man status speak-web >/dev/null 2>&1; then t-man restart speak-web; fi"

[hooks]
# Stop the agents this recipe owns before cleanup removes their binary/script.
# The speak-tts engine agent is stopped by the consuming repo's speak-tts recipe.
pre_uninstall = [
  "if command -v t-man >/dev/null; then t-man remove speak-web 2>/dev/null; t-man remove sandbox-watch 2>/dev/null; fi || true",
]

# Keep the watcher scripts executable inside the sources cache — the
# sandbox-watch agent execs sandbox-watch.sh straight from this directory.
[hooks.builds.speak_chmod_scripts]
commands = ["chmod +x sandbox-watch.sh sandbox-audit.sh"]
working_dir = "~/.config/ralph/sources/thismoon/recipes/speak"
run = "always"
idempotent = true

[hooks.builds.speak_web_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name speak-web -- $HOME/code/bin/speak serve --port 7425; else echo 'speak: skip speak-web service (t-man not on PATH; install t-man then run: t-man add --name speak-web -- speak serve --port 7425)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/speak"
run = "always"
depends_on = ["packages.speak", "packages.t_man"]

# ── sandbox-watch: seatbelt denial notifications ──
# Streams unified-log Sandbox denials for watched process names, batches per
# 60s window, notifies via Notification Center, and appends to
# ~/.local/share/speak/logs/sandbox-denials.log (sandbox-audit.sh digs in).
# Each banner is also mirrored to sandbox-notifications.log (same dir) with
# the batch's unique denials — read that to see what a banner was about.
# Both files are registered as t-man extra logs under the sandbox naming
# convention (sandbox, sandbox-*), so `t-man logs sandbox` shows them.
# One watcher covers all sandboxed t-man services — extend
# SANDBOX_WATCH_PROCESSES when another service gets a --sandbox-profile and
# give it an --extra-log sandbox=... pointing at the denials log.
[hooks.builds.sandbox_watch_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name sandbox-watch --env SANDBOX_WATCH_PROCESSES=python,Python,humanizer,vale,github-mcp-server,present --extra-log sandbox=$HOME/.local/share/speak/logs/sandbox-denials.log --extra-log sandbox-notifications=$HOME/.local/share/speak/logs/sandbox-notifications.log -- $HOME/.config/ralph/sources/thismoon/recipes/speak/sandbox-watch.sh; else echo 'speak: skip sandbox-watch service (t-man not on PATH)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/speak"
run = "always"
depends_on = ["packages.t_man"]
