[recipe]
name = "speak"
description = "speak: the Go text-to-speech service at http://speak.this (document audio for present, CORS speech proxy) + the fleet's sandbox tooling: the srt-run launcher and the sandbox-watch denial notifier. The Kokoro TTS engine lives in the consuming repo's speak-tts recipe."
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the paths below name that cache directly.
#
# speak-web (Go, services/speak/): the document audio routes present pages
# register with and play from, plus a CORS /v1/audio/speech endpoint, so
# present/csl pages can fetch speech cross-origin; its own page is a static
# landing page. Speech comes from the provider ~/.config/speak/config.yaml
# selects: the local engine (speak-tts on 127.0.0.1:8765, machine wiring that
# stays in the consuming repo) by default, or a remote one. The agent starts
# through speak-serve.sh, which hands speak the active provider's key from the
# secrets file and runs `speak serve` under srt; with no config it is the
# local engine and loopback only.
#
# srt-run + sandbox-watch: the launcher every sandboxed process execs through
# (anthropics/sandbox-runtime, one settings JSON per process) and the watcher
# that streams their denials. They live here rather than with the engine: they
# are wanted on every machine that runs a sandboxed process, not just the ones
# with the TTS engine. docs/SANDBOXING.md has the pattern.

[packages.speak]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/services/speak"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/speak"]

# Restart the web agent when the freshly installed binary actually changed.
# ralph hashes install_paths and runs this only when the bytes differ. The
# `t-man status` guard skips the restart on first install, where this fires
# before [hooks.builds.speak_web_service] has registered the agent.
[packages.speak.service]
restart = "if command -v t-man >/dev/null && t-man status speak-web >/dev/null 2>&1; then t-man restart speak-web; fi"

[hooks]
# Stop the agents this recipe owns before cleanup removes their binary/script.
# The speak-tts engine agent is stopped by the consuming repo's speak-tts recipe.
pre_uninstall = [
  "if command -v t-man >/dev/null; then t-man remove speak-web 2>/dev/null; t-man remove sandbox-watch 2>/dev/null; fi || true",
]

# Keep the scripts executable inside the sources cache: the sandbox-watch
# agent execs sandbox-watch.sh, speak-web execs speak-serve.sh, the consuming
# repo's MCP registration execs speak-env.sh, and every sandbox wrapper execs
# srt-run.sh through the ~/code/bin/srt-run symlink, all straight from this
# directory. speak-provider-env.sh is sourced by the two speak launchers and
# needs no mode bit.
[hooks.builds.speak_chmod_scripts]
commands = ["chmod +x sandbox-watch.sh sandbox-audit.sh speak-env.sh speak-serve.sh srt-run.sh"]
working_dir = "~/.config/ralph/sources/thismoon/recipes/speak"
run = "always"
idempotent = true

# srt settings for the speak-web agent, linked to
# ~/.config/srt/speak-web.json. They name no host and no machine path, so they
# ship beside the recipe (docs/adr/0006, 2026-10-25 amendment): reads are
# denied under ~ except the binary, the state dir and the provider config,
# writes go to the state dir and the temp dirs, loopback reaches events and
# the local engine. The remote provider's host comes at launch from
# speak-serve.sh. A config that is a symlink into a checkout needs its target
# in the machine's ~/.config/srt/speak-web.local.json; without it serve starts
# but answers every synthesis with a config error.
# Rendered from spec.access in services/speak/service-info.yaml by
# `make sandbox-settings` (docs/adr/0027): edit the manifest, not the JSON.
[dotfiles.speak_web_srt_settings]
source = "speak-web.srt.json"
target = "~/.config/srt/speak-web.json"
action = "symlink"

# Register `speak serve` as the speak-web launchd user agent via t-man. The
# agent runs speak-serve.sh, which resolves the provider's key and host outside
# the sandbox and execs speak serve through srt-run (docs/SANDBOXING.md,
# "Sandboxing a t-man service"). --state-dir pins the state dir the settings
# allow, so serve never falls back to the legacy ~/.local/share/speak.
# depends_on names builds.speak_chmod_scripts, which keeps srt-run and the
# launcher executable. ralph links dotfiles items before any build or package
# in every run, so the srt-run and settings links exist before this
# registration.
[hooks.builds.speak_web_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name speak-web --extra-log sandbox=$HOME/.local/share/speak/logs/sandbox-denials.log -- $HOME/.config/ralph/sources/thismoon/recipes/speak/speak-serve.sh --port 7425 --state-dir $HOME/.local/state/speak; else echo 'speak: skip speak-web service (t-man not on PATH; install t-man then run: t-man add --name speak-web -- speak serve --port 7425)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/speak"
run = "always"
depends_on = ["packages.speak", "packages.t_man", "builds.speak_chmod_scripts"]

# ── srt-run: the sandbox launcher ──
# `srt-run <settings-file> <argv...>` execs the command under srt with an
# SRT_RUN=<label> marker that sandbox-watch attributes denials by. MCP
# wrappers and t-man services exec it by this path. The per-process settings
# (~/.config/srt/<tool>.json) ship beside a service's recipe when they are
# generic, from the consuming repo otherwise (docs/adr/0006). srt itself is a
# mise tool the consuming repo declares (npm:@anthropic-ai/sandbox-runtime);
# srt-run finds it through the mise shims dir.
[dotfiles.srt_run]
source = "srt-run.sh"
target = "~/code/bin/srt-run"
action = "symlink"

# ── sandbox-watch: sandbox denial notifications ──
# Streams unified-log Sandbox denials, keeps the ones srt-run tagged (decoding
# the SRT_RUN label from srt's CMD64 tag), batches per 60s window, notifies
# via Notification Center, and appends to
# ~/.local/share/speak/logs/sandbox-denials.log (sandbox-audit.sh digs in).
# Denials from agents' own srt shells land there as IGNORED (foreign).
# Each banner is also mirrored to sandbox-notifications.log (same dir) with
# the batch's unique denials — read that to see what a banner was about.
# Both files are registered as t-man extra logs under the sandbox naming
# convention (sandbox, sandbox-*), so `t-man logs sandbox` shows them.
# One watcher covers every process launched through srt-run, plus legacy
# seatbelt profiles whose deny rules carry (with message "SRT_RUN=<label>");
# there is no process list. Give a sandboxed t-man service an --extra-log sandbox=...
# pointing at the denials log so `t-man logs <name> --source sandbox` works.
[hooks.builds.sandbox_watch_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name sandbox-watch --extra-log sandbox=$HOME/.local/share/speak/logs/sandbox-denials.log --extra-log sandbox-notifications=$HOME/.local/share/speak/logs/sandbox-notifications.log -- $HOME/.config/ralph/sources/thismoon/recipes/speak/sandbox-watch.sh; else echo 'speak: skip sandbox-watch service (t-man not on PATH)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/speak"
run = "always"
depends_on = ["packages.t_man"]
