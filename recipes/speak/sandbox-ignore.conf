# sandbox-watch ignore list — benign denials to silence (no notification).
#
# One extended-regex (ERE) per line. Each fleet denial is matched against two
# lines, and a pattern that matches either one silences it:
#   the denial message, with srt's CMD64 tag (or a legacy profile's
#   SRT_RUN=<label> marker) stripped
#     Sandbox: python3.14(123) deny(1) file-read-data /Users/x/.aws/credentials
#   the summary, led by the label (for srt-run, the settings file's name)
#     speak-tts · python3.14(123) · file-read-data · /Users/x/.aws/credentials
# So "^speak-tts · " scopes a pattern to one sandboxed process. A match means:
# still record it to the denial log tagged IGNORED, but do NOT send a
# notification banner. Anything that matches NOTHING here alerts.
#
# Only fleet denials reach this list. A denial from an agent's own bash
# sandbox (Claude Code and pi run their shells under srt too, but without the
# SRT_RUN marker) is logged IGNORED with reason "foreign" before any pattern
# is tried, so nothing here needs to cover agent shells.
#
# Use this for denials you've investigated and decided are expected/benign —
# typically apps that probe every credential/config path as discovery (dotenv
# loaders, the AWS/GCP SDK credential chains, ~/.netrc lookups) without ever
# using them. Blocking them is correct; being paged for them is noise.
#
# Lines starting with # and blank lines are ignored. Edit and the next poll
# (<= SANDBOX_WATCH_WINDOW seconds) picks it up — no restart needed.
#
# The watcher strips srt's tag (the "\nCMD64_<b64>_END__<id>_SBX" the log
# appends after a literal backslash-n) before matching, so a `$` right after
# the target works. Older entries close with ($|\\) from before that, when the
# tag was still attached; both forms match. For a pattern ending in a key or
# identifier (a sysctl name, a mach service) use ($|[^a-z_.]) so a longer name
# with the same prefix still alerts.
#
# This file ships with the recipe and holds the fleet-wide defaults. Do NOT
# edit it on a consuming machine (it lives in the ralph sources cache; local
# edits dirty the clone and die on the next sync) — machine-specific silences
# go in ~/.config/sandbox-watch/ignore.conf, same format, checked in addition
# to this file.
#
# Before adding a line: confirm the access is genuinely benign (the app works
# with it blocked) — see "Triaging a denial" in recipes/speak/CLAUDE.md. A
# silenced credential read you DIDN'T expect is exactly what an attacker wants
# you to ignore, so keep this list tight and comment every entry with why.

# --- examples (commented; uncomment/adapt once you've confirmed benign) ---
# credential-chain discovery the engine never uses:
# deny\(1\) file-read-data .*/\.aws/(credentials|config)
# deny\(1\) file-read-data .*/\.config/gcloud/
# deny\(1\) file-read-data .*/\.netrc

# --- vale (humanizer sandbox) startup config/styles discovery ---
# vale v3.14.2 calls DefaultConfig() on EVERY run, even with --config
# (internal/core/source.go: the global config is "always loaded in addition
# to" other sources). That goes through adrg/xdg, whose Create() walks the
# darwin candidate-dir chain (~/Library/Application Support,
# ~/Library/Preferences, /Library/Application Support, /Library/Preferences,
# ~/.config; the data chain adds ~/.local/share), doing an Exists() metadata
# probe then MkdirAll() per dir until one succeeds. Inside the sandbox the
# user-dir probes are metadata-denied; /Library metadata reads succeed (system
# paths are readable) so the loop reaches MkdirAll there, which produces the
# write-create denials. vale discards the error and humanizer supplies its own
# embedded style pack + config, so every one of these is discovery-only and
# blocking is correct. Metadata probes only: a file-read-DATA under these
# paths still alerts.
Sandbox: vale\([0-9]+\) deny\([0-9]+\) file-read-metadata /Users/[^/]+/(Library(/Application Support(/vale(/styles)?)?|/Preferences)?|\.config|\.local(/share)?)($|\\)
Sandbox: vale\([0-9]+\) deny\([0-9]+\) file-write-create /Library/(Application Support|Preferences)/vale($|\\)

# Homebrew Python stdlib __pycache__ — when a stdlib module has no precompiled
# .pyc (fresh brew install/upgrade leaves gaps), every sandboxed python that
# imports it tries to write the bytecode cache into the Cellar and is denied.
# Python falls back to running from source, so nothing breaks; the deny is
# correct (sandboxed processes must not write into /opt/homebrew). The real
# fix is a one-off unsandboxed `python3 -m compileall <stdlib>` — this entry
# only stops the paging between an upgrade and that run. Write-CREATE into
# __pycache__ only; any other Cellar write still alerts.
Sandbox: [Pp]ython[0-9.]*\([0-9]+\) deny\([0-9]+\) file-write-create /opt/homebrew/Cellar/python@[0-9.]+/[^ ]*/__pycache__(/[^ ]*)?($|\\)

# /dev/dtracehelper — libSystem registers DTrace helper probes at process
# startup by writing to this device; every binary does it on exec and the
# write is purely diagnostic. Denying it is harmless and expected. Process-
# agnostic: any watched binary (vale, humanizer, github-mcp-server, python,
# present) hits this on exec — the target literal is what makes it safe
# to silence, not the process name.
Sandbox: [A-Za-z0-9._-]+\([0-9]+\) deny\([0-9]+\) file-write-data /dev/dtracehelper($|\\)

# ~/.CFUserTextEncoding — CoreFoundation reads this on startup to resolve the
# user's preferred text encoding (_CFGetUserTextEncoding / CFStringGetSystem-
# Encoding). Every CF-linked binary probes it once at launch; Go binaries pull
# it in via the system resolver. It holds a locale/encoding hint, no secret,
# and the app falls back to a default when denied. Read-only, exact path.
Sandbox: [A-Za-z0-9._-]+\([0-9]+\) deny\([0-9]+\) file-read-data /Users/[^/]+/\.CFUserTextEncoding($|\\)

# Launch-time sysctl reads that come from shared startup code, not from the
# program. Process-agnostic like the two entries above: the key is what makes
# them safe to silence. Each value is readable by any unsandboxed process and
# holds no secret. A denied read falls back to a default and the program runs.
#
# kern.iossupportversion: the iOS version this macOS runs apps for (e.g.
# "26.6"). The system libraries read it at launch. Python, present, humanizer
# and vale all hit it, so it is not tied to one runtime. srt's own base
# profile denies it as well, and srt starts every command through bash, so
# each srt-run launch logs it once from bash (and once more from sh when the
# command is a shell script).
Sandbox: [A-Za-z0-9._-]+\([0-9]+\) deny\([0-9]+\) sysctl-read kern\.iossupportversion($|\\)

# libSystem's diagnostics registration. Under srt's default-deny mach policy
# the lookup of com.apple.diagnosticd is denied once per process: from the
# `bash -c` srt starts every command through (seen on 2026-10-25 for every
# present MCP start under env -i), and from a Go binary the first time it
# writes a log line (github-mcp-server, present). It is os_log plumbing,
# carries no data, and the command runs normally. This one service only: any
# other mach-lookup still alerts.
Sandbox: [A-Za-z0-9._-]+\([0-9]+\) deny\([0-9]+\) mach-lookup com\.apple\.diagnosticd($|\\)

# Go's resolver under srt. srt hands the child HTTPS_PROXY pointing at
# `localhost:<port>`, and a Go binary resolves that name through libSystem
# before it falls back to /etc/hosts: a connect to mDNSResponder's socket,
# then a UDP query to the nameserver, which the log shows as an outbound with
# no target and a bind to local:*:0. All three are denied, the lookup then
# succeeds from /etc/hosts, and the request goes through the proxy (seen on
# 2026-10-25 from github-mcp-server on every API call). A TCP connect to a
# real host shows its target and still alerts, so a direct egress attempt is
# not hidden by these.
Sandbox: [A-Za-z0-9._-]+\([0-9]+\) deny\([0-9]+\) network-outbound /private/var/run/mDNSResponder($|\\)
Sandbox: [A-Za-z0-9._-]+\([0-9]+\) deny\([0-9]+\) network-outbound($|\\)
Sandbox: [A-Za-z0-9._-]+\([0-9]+\) deny\([0-9]+\) network-bind local:\*:0($|\\)

# Go CPU feature detection on Apple Silicon. Go's internal/cpu and the copy
# of golang.org/x/sys/cpu vendored into the standard library read these
# hw.optional flags at init (names from go1.27.3 and x/sys v0.45.0). Each is
# a 0/1 capability flag. A denied read means "feature absent" or falls through
# to the other name for the same feature. Only neon_fp16 and neon_hpfp have
# been seen denied so far (humanizer, vale, present). The rest are the same
# init code, listed so a stricter profile does not page for them. Every
# hw.optional.arm.FEAT_* key is such a flag, so that family matches as a
# group. Any other hw.* key (hw.optional.arm64, hw.model) still alerts.
Sandbox: [A-Za-z0-9._-]+\([0-9]+\) deny\([0-9]+\) sysctl-read hw\.optional\.(neon_fp16|neon_hpfp|AdvSIMD_HPFPCvt|armv8_(1_atomics|crc32|2_fhm|2_sha3|2_sha512|3_compnum)|arm\.FEAT_[A-Za-z0-9_]+)($|\\)

# CPython + CoreFoundation launch-time environment probes. Every sandboxed
# python execs through the same startup path: the interpreter and the CF
# runtime it links read a handful of sysctls (platform/boot/lockdown state)
# and try to register with the system notification, logging, and diagnostics
# mach services. None of it is needed. Python starts fine with all of it
# denied, which is how every sandboxed run to date has worked. The volume is
# the problem: this fires on EVERY exec, so a batch of short-lived processes
# pages once per process.
# Exact keys/services only: any other sysctl or mach-lookup still alerts.
# kern.iossupportversion is covered by the any-process entry above.
Sandbox: [Pp]ython[0-9.]*\([0-9]+\) deny\([0-9]+\) sysctl-read (kern\.bootargs|security\.mac\.lockdown_mode_state)($|[^a-z_.])
Sandbox: [Pp]ython[0-9.]*\([0-9]+\) deny\([0-9]+\) mach-lookup com\.apple\.(system\.notification_center|logd|diagnosticd)($|[^a-z_.])

# present MCP startup probes. The Go binary triggers the same CoreFoundation
# platform/boot/lockdown and mach-service discovery as Python. present_list
# succeeds with every access blocked, so they are diagnostics/discovery only.
# Keep this process-specific: any other present sysctl or mach lookup still
# alerts. Its kern.iossupportversion and Go CPU-flag reads are covered by the
# any-process entries above.
Sandbox: present\([0-9]+\) deny\([0-9]+\) sysctl-read (kern\.bootargs|security\.mac\.lockdown_mode_state)($|\\)
Sandbox: present\([0-9]+\) deny\([0-9]+\) mach-lookup com\.apple\.(system\.notification_center|logd|diagnosticd)($|\\)
