# humanizer — public layer: build + install + the humanizer skill. MCP
# registration, the sandbox wrapper + seatbelt profile, and the config.yaml
# symlink stay in the consuming repo's companion recipe — machine-private
# wiring (see docs/adr/0006).
[recipe]
name = "humanizer"
description = "humanizer: local CLI and MCP server that detects AI-writing patterns and profiles voice"
# wave 0: builds the binary before the consuming repo's MCP registration
# recipe (wave 1) points the MCP host at it.
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the path below names that cache directly.
[packages.humanizer]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/tools/humanizer"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/humanizer"]

# The humanizer skill lives in the repo-root skills/ dir (discoverable by
# browsing the repo); link just this skill's directory into place. Relative
# sources resolve against the recipe dir and are path-cleaned, so ../../
# reaches the source-checkout root.
[dotfiles.humanizer_skill]
source = "../../skills/humanizer"
target = "~/.claude/skills/humanizer"
action = "symlink_dir"

# Codex discovers user skills from ~/.agents/skills; mirror the same dir there.
[dotfiles.humanizer_codex_skill]
source = "../../skills/humanizer"
target = "~/.agents/skills/humanizer"
action = "symlink_dir"
