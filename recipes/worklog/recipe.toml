# worklog — public layer only: build + install. MCP registration, the
# ticket-firewall config overlay (~/.config/worklog/config.yaml), and the
# worklog/worklog-backfill skills stay in the consuming repo's companion
# recipe — machine-private wiring (see docs/adr/0006).
[recipe]
name = "worklog"
description = "worklog — resumable, ticket/topic-keyed cross-session work state (CLI + MCP)"
# wave 0: builds the binary before the consuming repo's MCP registration
# recipe (wave 1) registers `worklog mcp`.
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the path below names that cache directly.
[packages.worklog]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/tools/worklog"
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/worklog"]
