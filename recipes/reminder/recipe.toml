[recipe]
name = "reminder"
description = "reminder — CLI + MCP + web service for time-based reminders that fire macOS notifications"
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the paths below name that cache directly.
[packages.reminder]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/services/reminder"
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/reminder"]

# Restart the serve agent when the freshly installed binary actually changed.
# ralph hashes install_paths and runs this only when the bytes differ. The
# `t-man status` guard skips the restart on first install, where this fires
# before [hooks.builds.reminder_service] has registered the agent.
[packages.reminder.service]
restart = "if command -v t-man >/dev/null && t-man status reminder >/dev/null 2>&1; then t-man restart reminder; fi"

[hooks]
# Stop and remove the t-man-managed serve agent during cleanup, before the
# binary it runs is removed (ralph disable thismoon/reminder && ralph up --enable-cleanup).
pre_uninstall = ["if command -v t-man >/dev/null; then t-man remove reminder 2>/dev/null; fi || true"]

# Register `reminder serve` as a long-running launchd user agent via t-man. This
# process owns the JSON store and fires notifications; the MCP server (registered
# in the consuming repo's recipes/claude-mcp/servers.json) is a thin HTTP client to it.
# Idempotent; run = "always" keeps it registered and self-heals if it was removed.
[hooks.builds.reminder_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name reminder -- $HOME/code/bin/reminder serve --port 7428 --workdir $HOME/.local/share/reminder; else echo 'reminder: skip service (t-man not on PATH; install t-man then run: t-man add --name reminder -- reminder serve --port 7428)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/reminder"
run = "always"
depends_on = ["packages.reminder", "packages.t_man"]
