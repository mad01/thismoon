[recipe]
name = "prs"
description = "prs: open-PR dashboard over local checkouts; CLI + MCP + web view polling every repo's GitHub host"
wave = 0
# No profile gate: which machines run this is the consuming config's call
# (an override on "thismoon/prs", or a role source's overrides.toml).

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the paths below name that cache directly.
[packages.prs]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/services/prs"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/prs"]

# Restart the serve agent when the freshly installed binary actually changed.
# ralph hashes install_paths and runs this only when the bytes differ. The
# `t-man status` guard skips the restart on first install, where this fires
# before [hooks.builds.prs_service] has registered the agent.
[packages.prs.service]
restart = "if command -v t-man >/dev/null && t-man status prs >/dev/null 2>&1; then t-man restart prs; fi"

[hooks]
# Stop and remove the t-man-managed serve agent during cleanup, before the
# binary it runs is removed (ralph disable thismoon/prs && ralph up --enable-cleanup).
pre_uninstall = ["if command -v t-man >/dev/null; then t-man remove prs 2>/dev/null; fi || true"]

# Register `prs serve` as a long-running launchd user agent via t-man. This
# process owns the PR cache and the GitHub polling; the MCP server (registered
# in the consuming repo's recipes/claude-mcp/servers.json) is a thin HTTP
# client to it. The polling scope comes from ~/.config/prs/config.yaml, which
# is machine-private wiring delivered by the consuming repo's overlay.
# Idempotent; run = "always" keeps it registered and self-heals if it was removed.
[hooks.builds.prs_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name prs -- $HOME/code/bin/prs serve --port 7427 --workdir $HOME/.local/share/prs; else echo 'prs: skip service (t-man not on PATH; install t-man then run: t-man add --name prs -- prs serve --port 7427)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/prs"
run = "always"
depends_on = ["packages.prs", "packages.t_man"]
