[recipe]
name = "csl"
description = "csl — local code search daemon, web UI, and MCP stdio server (services/csl)"
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the paths below name that cache directly.
#
# Item keys keep the names the dotfiles-era wiring used
# (packages.code_search_local, hooks.builds.csl_web_service) so ralph state
# carries over at cutover — item keys are global, not namespaced per recipe.
#
# Semantic search embeds via a local Ollama server (jina-code-v2 by
# default); pulling the model and running Ollama are machine wiring, like the
# ~/.config/csl config.yaml symlink and the MCP registration (claude-mcp
# servers.json) — all of it stays in the consuming repo.

[packages.code_search_local]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/services/csl"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/csl"]

# Restart the web agent when the freshly installed binary actually changed.
# ralph hashes install_paths and runs this only when the bytes differ. The
# `t-man status` guard skips the restart on first install, where this fires
# before [hooks.builds.csl_web_service] has registered the agent.
[packages.code_search_local.service]
restart = "if command -v t-man >/dev/null && t-man status csl-web >/dev/null 2>&1; then t-man restart csl-web; fi"

[hooks]
# Uninstall csl-managed post-merge hooks from every repo, and stop the t-man
# web agent, before the binary and config are removed by artifact cleanup.
pre_uninstall = [
  "csl hooks uninstall 2>/dev/null || true",
  "if command -v t-man >/dev/null; then t-man remove csl-web 2>/dev/null; fi || true",
]
# Remove the indexes and daemon state that csl creates at runtime.
post_uninstall = ["rm -rf ~/.config/csl/search-index ~/.config/csl/semantic-index ~/.config/csl/search-daemon.log ~/.config/csl/search-daemon.pid ~/.config/csl/search-daemon.sock ~/.config/csl/reindex.queue 2>/dev/null || true"]

# Register `csl web` as a long-running t-man user agent so the search UI is
# always reachable on http://localhost:7424 (http://csl.this/ via d-man).
# run = "always" keeps the agent registered and self-heals if it was removed;
# t-man add is idempotent.
[hooks.builds.csl_web_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name csl-web -- $HOME/code/bin/csl web --port 7424; else echo 'csl: skip service (t-man not on PATH; install t-man then run: t-man add --name csl-web -- csl web --port 7424)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/csl"
run = "always"
depends_on = ["packages.code_search_local", "packages.t_man"]

# Shell functions moved here from the dotfiles dev-tools recipe; keys are
# global across sources, so each must exist in exactly one recipe.
#
# `repo-sync` pulls every repo (ff-only) and reindexes what changed —
# a shell-side name for `csl sync`.
[shell.functions.repo-sync]
body = 'csl sync'

# `repo` jumps to a repo: `repo <query>` cd's straight to the single match,
# bare `repo` opens the fuzzy picker. Backed by `csl repo`, so it needs no
# other tool on PATH.
[shell.functions.repo]
body = 'local d=$(csl repo "$@"); [[ -n "$d" ]] && cd "$d"'
