# harvest: public layer. It builds and installs the binary, links the launcher
# the SessionEnd hook runs, links the srt settings the steps of a harvest run
# under, and ships the harvest skill. The hook entry, the belt hint and the
# vault grants are machine-private: the consuming repo adds them
# (docs/adr/0006). CLAUDE.md beside this file lists what it adds.
[recipe]
name = "harvest"
description = "harvest: saves what a Claude Code session learned to the brain vault inbox from a SessionEnd hook; the CLI, its launcher, its sandbox settings and the /harvest skill"

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the paths below name that cache directly.
[packages.harvest]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/tools/harvest"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/harvest"]

# -- harvest-env: the hook's launcher --
# A SessionEnd hook carries no login shell's env, so the hook runs
# `~/code/bin/harvest-env session-end`. The script pulls the provider
# variables the model step reads from the secrets file and execs harvest.
[dotfiles.harvest_env]
source = "harvest-env.sh"
target = "~/code/bin/harvest-env"
action = "symlink"

# -- harvest-step: the launcher of the sandboxed steps --
# `harvest run` starts each step through `~/code/bin/harvest-step`, which
# execs srt-run with the settings linked below.
[dotfiles.harvest_step]
source = "harvest-step.sh"
target = "~/code/bin/harvest-step"
action = "symlink"

# Keep both scripts executable inside the sources cache: the hook execs
# harvest-env.sh and every step execs harvest-step.sh through their
# ~/code/bin symlinks. Git carries the mode bit; this is the belt-and-braces
# the other launchers get too. It runs after the step that keeps srt-run
# executable, since harvest-step.sh execs it.
[hooks.builds.harvest_chmod_scripts]
commands = ["chmod +x harvest-env.sh harvest-step.sh"]
working_dir = "~/.config/ralph/sources/thismoon/recipes/harvest"
run = "always"
idempotent = true
depends_on = ["builds.srtspec_chmod_srt_run", "packages.srtspec"]

# srt settings for the prepare, complete and apply steps, linked to
# ~/.config/srt/harvest.json. They read the transcripts, the brain config
# directory, the binaries and the state dir (the workdir), write only the
# workdir and the temp dirs, and reach only the host the model step is handed
# in SRT_RUN_ALLOW_DOMAINS. The vault and the config.yaml link target are
# machine paths, so they come from the machine's expansion layer,
# ~/.config/srt/harvest.local.json, which the consuming repo ships.
# Rendered from spec.access in tools/harvest/service-info.yaml by
# `make sandbox-settings` (docs/adr/0027): edit the manifest, not the JSON.
[dotfiles.harvest_srt_settings]
source = "harvest.srt.json"
target = "~/.config/srt/harvest.json"
action = "symlink"

# The skill lives in the repo-root skills/ dir (discoverable by browsing the
# repo); link just this skill's directory into place. Relative sources resolve
# against the recipe dir and are path-cleaned, so ../../ reaches the
# source-checkout root. harvest run reads the same file as the model's system
# prompt (HARVEST_SKILL).
[dotfiles.harvest_skill]
source = "../../skills/harvest"
target = "~/.claude/skills/harvest"
action = "symlink_dir"

# Codex discovers user skills from ~/.agents/skills; mirror the same dir there.
[dotfiles.harvest_codex_skill]
source = "../../skills/harvest"
target = "~/.agents/skills/harvest"
action = "symlink_dir"
