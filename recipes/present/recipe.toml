[recipe]
name = "present"
description = "present: CLI + MCP server that serves single-page HTML briefings over localhost"
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the paths below name that cache directly.
[packages.present]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/services/present"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/present"]

# Restart the serve agent when the freshly installed binary actually changed.
# ralph hashes install_paths and runs this only when the bytes differ. The
# `t-man status` guard skips the restart on first install, where this fires
# before [hooks.builds.present_service] has registered the agent.
[packages.present.service]
restart = "if command -v t-man >/dev/null && t-man status present >/dev/null 2>&1; then t-man restart present; fi"

# The present skill lives in the repo-root skills/ dir (discoverable by
# browsing the repo); link just this skill's directory into place. Relative
# sources resolve against the recipe dir and are path-cleaned, so ../../
# reaches the source-checkout root.
[dotfiles.present_skill]
source = "../../skills/present"
target = "~/.claude/skills/present"
action = "symlink_dir"

# Codex discovers user skills from ~/.agents/skills; mirror the same dir there.
[dotfiles.present_codex_skill]
source = "../../skills/present"
target = "~/.agents/skills/present"
action = "symlink_dir"

# Keep the two launchers executable: the consuming repo's agent-sync servers.json
# registers the MCP wrapper, not the bare binary (sandbox containment: it
# execs `present mcp` through srt-run with ~/.config/srt/present.json, a
# settings file the consuming repo provides), and the serve hook below
# registers present-serve.sh. Both source present-shared-env.sh for the
# sharing config, which needs no mode bit.
[hooks.builds.present_chmod_mcp_wrapper]
commands = ["chmod +x present-mcp-sandbox.sh present-serve.sh"]
working_dir = "~/.config/ralph/sources/thismoon/recipes/present"
run = "always"
idempotent = true

[hooks]
# Cache fonts and JS locally so the serve daemon has zero external CDN
# dependencies. Runs after every apply (post_apply, not post_install — ralph
# has no post_install hook, and the original key was silently ignored, so this
# never ran); cache-assets.sh exits early once the assets exist. Offline-
# safe: curl failures are swallowed (|| true) so the service still starts;
# pages degrade to system fonts / no graph until the next successful cache.
post_apply = ["make -C ~/.config/ralph/sources/thismoon/services/present cache || true"]

# Stop and remove the t-man-managed serve agent during cleanup, before the
# binary it runs is removed (ralph disable thismoon/present && ralph up --enable-cleanup).
pre_uninstall = ["if command -v t-man >/dev/null; then t-man remove present 2>/dev/null; fi || true"]

# srt settings for the serve agent, linked to ~/.config/srt/present-serve.json.
# They name no host and no machine path, so they ship beside the recipe
# (docs/adr/0006, 2026-10-25 amendment). The MCP server's settings
# (~/.config/srt/present.json) stay in the consuming repo; the two labels
# differ so sandbox-watch tells the processes apart. Reads are denied under ~
# except the binary and the page store, writes go to the store and the temp
# dirs. No egress beyond loopback unless PRESENT_SHARED_URL is set: the
# launcher then adds the shared host at launch, and the share push is Go TLS,
# which needs trustd, hence enableWeakerNetworkIsolation.
[dotfiles.present_serve_srt_settings]
source = "present-serve.srt.json"
target = "~/.config/srt/present-serve.json"
action = "symlink"

# Register `present serve` as a long-running launchd user agent via t-man so the
# pages are always reachable on http://localhost:7423. Registration only —
# restart-on-rebuild lives in [packages.present.service] above. `t-man add` is
# idempotent (same definition -> same hash -> no-op), so run = "always" keeps
# the agent registered and self-heals if it was manually removed. The agent
# runs present-serve.sh rather than the binary: the launcher reads the sharing
# config (PRESENT_SHARED_URL, PRESENT_AUTHOR_KEY) from the secrets file at
# start, outside the sandbox, then execs present serve through srt-run (docs/
# SANDBOXING.md, "Sandboxing a t-man service").
# depends_on names builds.speak_chmod_scripts, which keeps srt-run executable.
# ralph links dotfiles items before any build or package in every run, so the
# srt-run and settings links exist before this registration; depends_on could
# not name them anyway, since ralph only accepts builds. and packages. refs.
[hooks.builds.present_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name present --extra-log sandbox=$HOME/.local/share/speak/logs/sandbox-denials.log -- $HOME/.config/ralph/sources/thismoon/recipes/present/present-serve.sh --port 7423 --workdir $HOME/.config/present; else echo 'present: skip service (t-man not on PATH; install t-man then run: t-man add --name present -- present serve --port 7423 --workdir ~/.config/present)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/present"
run = "always"
depends_on = ["packages.present", "packages.t_man", "builds.speak_chmod_scripts"]
