[recipe]
name = "present"
description = "present — CLI + MCP server that serves single-page HTML briefings over localhost"
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the paths below name that cache directly.
[packages.present]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/services/present"
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/present"]

# Restart the serve agent when the freshly installed binary actually changed.
# ralph hashes install_paths and runs this only when the bytes differ. The
# `t-man status` guard skips the restart on first install, where this fires
# before [hooks.builds.present_service] has registered the agent.
[packages.present.service]
restart = "if command -v t-man >/dev/null && t-man status present >/dev/null 2>&1; then t-man restart present; fi"

# The present Claude skill ships beside the recipe; mirror it into
# ~/.claude/skills as a per-child symlink (same pattern as the reminder
# recipe's skills mirror — child names are disjoint across mirrors).
[dirs_mirror.present_skill]
source = "skills"
target = "~/.claude/skills"
action = "symlink_dir"

# Keep the MCP spawn wrapper executable — the dotfiles claude-mcp overlay
# registers the wrapper, not the bare binary (sandbox containment: the wrapper
# execs `present mcp` under present.sb, which lives beside it in this dir).
[hooks.builds.present_chmod_mcp_wrapper]
commands = ["chmod +x present-mcp-sandbox.sh"]
working_dir = "~/.config/ralph/sources/thismoon/recipes/present"
run = "always"
idempotent = true

[hooks]
# Cache fonts and JS locally so the serve daemon has zero external CDN
# dependencies. Runs after `make install` puts the binary in place. Offline-
# safe: curl failures are swallowed (|| true) so the service still starts;
# pages degrade to system fonts / no graph until the next successful cache.
post_install = ["make -C ~/.config/ralph/sources/thismoon/services/present cache || true"]

# Stop and remove the t-man-managed serve agent during cleanup, before the
# binary it runs is removed (ralph disable thismoon/present && ralph up --enable-cleanup).
pre_uninstall = ["if command -v t-man >/dev/null; then t-man remove present 2>/dev/null; fi || true"]

# Register `present serve` as a long-running launchd user agent via t-man so the
# pages are always reachable on http://localhost:7423. Registration only —
# restart-on-rebuild lives in [packages.present.service] above. `t-man add` is
# idempotent (same definition -> same hash -> no-op), so run = "always" keeps
# the agent registered and self-heals if it was manually removed.
[hooks.builds.present_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name present -- $HOME/code/bin/present serve --port 7423 --workdir $HOME/.config/present; else echo 'present: skip service (t-man not on PATH; install t-man then run: t-man add --name present -- present serve --port 7423 --workdir ~/.config/present)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/present"
run = "always"
depends_on = ["packages.present", "packages.t_man"]
