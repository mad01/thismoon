# factory: skill recipe (experimental). The skill has no companion binary; it
# ships the orchestrator-and-workers procedure (SKILL.md, the message
# contract, routing, the worker brief and the worker definitions) from the
# repo-root skills/ dir into the agent skill directories on every machine. It
# also installs the files those docs describe: the three worker agent
# definitions, their --agents rendering for unattended workers, and the
# script behind belt's factory-worker hint. The belt config that registers
# the hint, and the settings and MCP files for unattended workers, stay in
# the consuming repo (docs/adr/0006).
[recipe]
name = "factory"
description = "factory: agent skill for running a plan with worker subagents, one loom worktree per unit, plus the worker definitions and hint script (experimental)"

# The skill lives in the repo-root skills/ dir (discoverable by browsing the
# repo); link just this skill's directory into place. Relative sources resolve
# against the recipe dir and are path-cleaned, so ../../ reaches the
# source-checkout root.
[dotfiles.factory_skill]
source = "../../skills/factory"
target = "~/.claude/skills/factory"
action = "symlink_dir"

# Codex discovers user skills from ~/.agents/skills; mirror the same dir there.
[dotfiles.factory_codex_skill]
source = "../../skills/factory"
target = "~/.agents/skills/factory"
action = "symlink_dir"

[directories.claude_agents_dir]
target = "~/.claude/agents"

# The worker definitions. Claude Code reads user agents from ~/.claude/agents;
# plugin agents would drop the permission-bearing frontmatter. Linked one by
# one, so the directory keeps any agents the machine adds on its own.
[dotfiles.factory_worker_low]
source = "../../skills/factory/agents/factory-worker-low.md"
target = "~/.claude/agents/factory-worker-low.md"
action = "symlink"

[dotfiles.factory_worker_medium]
source = "../../skills/factory/agents/factory-worker-medium.md"
target = "~/.claude/agents/factory-worker-medium.md"
action = "symlink"

[dotfiles.factory_worker_high]
source = "../../skills/factory/agents/factory-worker-high.md"
target = "~/.claude/agents/factory-worker-high.md"
action = "symlink"

# The same three definitions as an --agents file: claude -p with
# --setting-sources "" does not read ~/.claude/agents. render_agents_json.py
# derives it from the definitions; rerun it after an edit, and
# agents-json-test.sh fails make test-recipes while it is stale.
[dotfiles.factory_worker_agents_json]
source = "agents.json"
target = "~/.config/factory/agents.json"
action = "symlink"

# The script behind belt's factory-worker custom hint on subagent-start. The
# consuming repo's belt config registers the hint with this path.
[dotfiles.factory_worker_hint]
source = "../../skills/factory/factory-worker-hint.sh"
target = "~/.config/factory/factory-worker-hint.sh"
action = "symlink"
