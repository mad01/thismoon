[recipe]
name = "pr"
description = "pr — local PR review dashboard aggregating open PRs from multiple GitHub hosts"
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the paths below name that cache directly.
#
# The host-gated ~/.config/pr/config.toml symlinks (per-machine repo lists)
# deliberately stay in the dotfiles overlay — they are machine-private.
[packages.pr]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/services/pr"
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/pr"]

# Restart the serve agent when the freshly installed binary actually changed.
# ralph hashes install_paths and runs this only when the bytes differ. The
# `t-man status` guard skips the restart on first install, where this fires
# before [hooks.builds.pr_service] has registered the agent.
[packages.pr.service]
restart = "if command -v t-man >/dev/null && t-man status pr >/dev/null 2>&1; then t-man restart pr; fi"

[hooks]
# Stop and remove the t-man-managed serve agent during cleanup, before the
# binary it runs is removed (ralph disable thismoon/pr && ralph up --enable-cleanup).
pre_uninstall = ["if command -v t-man >/dev/null; then t-man remove pr 2>/dev/null; fi || true"]

# Register `pr serve` as a long-running launchd user agent via t-man.
# Registration only — restart-on-rebuild lives in [packages.pr.service] above.
# `t-man add` is idempotent (same definition -> same hash -> no-op), so
# run = "always" keeps the agent registered and self-heals if it was removed.
[hooks.builds.pr_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name pr -- $HOME/code/bin/pr serve --port 7427; else echo 'pr: skip service (t-man not on PATH; install t-man then run: t-man add --name pr -- pr serve --port 7427)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/pr"
run = "always"
depends_on = ["packages.pr", "packages.t_man"]
