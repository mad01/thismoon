# agent-sync: public layer, build + install only. The recipe never runs a
# sync: the consuming repo ships the data and the config, and runs
# `agent-sync <section> sync` with `check` as its verify step (docs/adr/0006).
[recipe]
name = "agent-sync"
description = "agent-sync: sync coding agent config (Claude Code settings, mods, MCP servers) from a data repo (CLI)"
# wave 0: builds the binary before the consuming repo's sync hooks (wave 1)
# call it.
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the path below names that cache directly.
[packages.agent-sync]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/tools/agent-sync"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/agent-sync"]
