# srtspec: public layer, build + install only. The settings files it renders
# are committed beside each recipe, so nothing here runs at apply time; the
# binary is installed for `srtspec explain` on the machine.
[recipe]
name = "srtspec"
description = "srtspec: render sandbox access manifests to srt settings, check drift, explain the effective policy"

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the path below names that cache directly.
[packages.srtspec]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/tools/srtspec"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/srtspec"]
