# suspenders — public layer only: build + install of the scanner binary. The
# machine-private config overlay (~/.config/suspenders/config.yaml with the
# real blocked words and safe references) and the hook install/uninstall
# wiring stay in the consuming repo's companion recipe (docs/adr/0006).
[recipe]
name = "suspenders"
description = "suspenders — offline git secret scanner + pre-commit/post-merge hook orchestrator (binary build/install)"
# wave 0: the binary must exist before consuming-repo recipes whose hooks run
# `suspenders hook install --all` against it.
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the path below names that cache directly.
[packages.suspenders]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/tools/suspenders"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/suspenders"]
