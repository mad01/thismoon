# handoff — skill-only recipe. The skill has no companion binary; it ships the
# session-handoff procedure (SKILL.md) from the repo-root skills/ dir into the
# agent skill directories on every machine.
[recipe]
name = "handoff"
description = "handoff: agent skill for writing a cold-start handoff doc and persisting session learnings"

# The skill lives in the repo-root skills/ dir (discoverable by browsing the
# repo); link just this skill's directory into place. Relative sources resolve
# against the recipe dir and are path-cleaned, so ../../ reaches the
# source-checkout root.
[dotfiles.handoff_skill]
source = "../../skills/handoff"
target = "~/.claude/skills/handoff"
action = "symlink_dir"

# Codex discovers user skills from ~/.agents/skills; mirror the same dir there.
[dotfiles.handoff_codex_skill]
source = "../../skills/handoff"
target = "~/.agents/skills/handoff"
action = "symlink_dir"
