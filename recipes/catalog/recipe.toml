[recipe]
name = "catalog"
description = "catalog: systems & components catalog UI for the mad01 fleet (services/catalog)"
wave = 0
# No profile gate. Which machine classes run the catalog is the consuming
# layer's call: the base config leaves it on, and a profile-gated role source
# withholds it for its machines with an overrides.toml entry keyed
# "thismoon/catalog" (docs/adr/0006, 2026-09-08 amendment).

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the paths below name that cache directly.
#
# Item keys keep the names the dotfiles-era wiring used (packages.catalog,
# hooks.builds.catalog_web_service) so ralph state carries over at cutover.
# Machine wiring stays in the consuming repo: the ~/.config/catalog
# registry.yaml symlink (which repos a machine catalogs is per-machine).

[packages.catalog]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/services/catalog"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/catalog"]

# Restart the web agent when the freshly installed binary actually changed.
# ralph hashes install_paths and runs this only when the bytes differ. The
# `t-man status` guard skips the restart on first install, where this fires
# before [hooks.builds.catalog_web_service] has registered the agent.
[packages.catalog.service]
restart = "if command -v t-man >/dev/null && t-man status catalog-web >/dev/null 2>&1; then t-man restart catalog-web; fi"

[hooks]
# Stop the t-man web agent before the binary is removed by artifact cleanup.
pre_uninstall = [
  "if command -v t-man >/dev/null; then t-man remove catalog-web 2>/dev/null; fi || true",
]

# srt settings for the web agent, linked to ~/.config/srt/catalog-web.json.
# They name no host and no machine path, so they ship beside the recipe
# (docs/adr/0006, 2026-10-25 amendment). The scan reads the registry and the
# service-info.yaml files across the registered repos, so reads cover ~/code
# minus nested secret files, plus ~/.config/catalog; the registry and the repos
# it lists must sit there. The add-component form writes service-info.yaml into
# a registered repo, so that one file name is writable under ~/code. Loopback
# only.
# Rendered from spec.access in services/catalog/service-info.yaml by
# `make sandbox-settings` (docs/adr/0027): edit the manifest, not the JSON.
[dotfiles.catalog_web_srt_settings]
source = "catalog-web.srt.json"
target = "~/.config/srt/catalog-web.json"
action = "symlink"

# Register `catalog web` as a long-running t-man user agent so the catalog UI
# is always reachable on http://localhost:7575 (http://catalog.this/ via
# d-man). run = "always" keeps the agent registered and self-heals if it was
# removed; t-man add is idempotent. It runs sandboxed: the program is srt-run
# with the settings, then the command (docs/SANDBOXING.md, "Sandboxing a t-man
# service").
# depends_on names builds.speak_chmod_scripts, which keeps srt-run executable.
# ralph links dotfiles items before any build or package in every run, so the
# srt-run and settings links exist before this registration; depends_on could
# not name them anyway, since ralph only accepts builds. and packages. refs.
[hooks.builds.catalog_web_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name catalog-web --extra-log sandbox=$HOME/.local/share/speak/logs/sandbox-denials.log -- $HOME/code/bin/srt-run $HOME/.config/srt/catalog-web.json $HOME/code/bin/catalog web --port 7575; else echo 'catalog: skip service (t-man not on PATH; install t-man then run: t-man add --name catalog-web -- catalog web --port 7575)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/catalog"
run = "always"
depends_on = ["packages.catalog", "packages.t_man", "builds.speak_chmod_scripts"]
