# factory-eval (experimental): public layer, build + install only. The
# harness makes paid claude runs only when a person starts one by hand
# against a signed-off cases file; nothing here runs it.
[recipe]
name = "factory-eval"
description = "factory-eval: experimental eval harness, the factory against one agent at equal budget (CLI)"
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the path below names that cache directly.
[packages.factory-eval]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/tools/factory-eval"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/factory-eval"]
