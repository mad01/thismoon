# d-man — platform foundation: the `.this` front door. Hard depends_on from
# other recipes is allowed for foundations (see docs/adr/0006).
[recipe]
name = "d-man"
description = "d-man — local domain front door: *.this names resolve to localhost services via /etc/hosts + a :80 reverse proxy"
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the path below names that cache directly.
[packages.d_man]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/services/d-man"
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/d-man"]
# Deliberately NO [packages.d_man.service] restart stanza. d-man runs as a ROOT
# launchd daemon (it binds :80 and writes /etc/hosts), and `t-man --daemon
# restart` would prompt for sudo on every `ralph up` that rebuilt the binary.
# Instead `d-man serve` watches its own installed binary and exits(0) when
# `make install` overwrites it; launchd KeepAlive relaunches the new build. So a
# rebuild self-applies with no sudo and no restart command here.

# The routes file (~/.config/d-man/routes.toml) is machine-personal and is NOT
# shipped here: the consuming repo's overlay recipe symlinks it into place
# (item key dotfiles.d_man_routes). This recipe only builds and installs the
# binary.

[hooks]
# Daemon registration is a one-time, explicit, sudo step (see SETUP.md) — it
# writes /Library/LaunchDaemons/ and edits /etc/hosts, so it must not run
# unattended in a ralph hook. On a fresh machine the daemon plist won't exist
# yet, so print the one-time setup reminder until it does (no sudo needed: the
# plist path is world-readable). Goes quiet once the daemon is registered.
# post_apply, not post_install: ralph has no post_install hook — the original
# key parsed as unknown TOML and this reminder never printed.
post_apply = [
  "if [ ! -f /Library/LaunchDaemons/d-man.plist ]; then printf '\\n  d-man: daemon not registered yet — one-time setup (needs sudo once):\\n    sudo t-man --daemon add --name d-man -- $HOME/code/bin/d-man serve --config $HOME/.config/d-man/routes.toml\\n  details: recipes/d-man/SETUP.md in the thismoon repo\\n\\n'; fi || true",
]

# Teardown also needs root; print the command rather than failing silently.
pre_uninstall = [
  "echo 'd-man: to remove the daemon run: sudo t-man --daemon remove d-man' || true",
]
