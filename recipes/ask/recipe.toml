# ask: skill-only recipe. The skill has no binary of its own; it ships the
# answer-from-the-vault procedure (SKILL.md) from the repo-root skills/ dir
# into the agent skill directories. Its tool-backed steps use the brain MCP,
# which the brain recipe builds and the consuming repo registers.
[recipe]
name = "ask"
description = "ask: agent skill for answering a question from the brain vault with cited notes"

# The skill lives in the repo-root skills/ dir (discoverable by browsing the
# repo); link just this skill's directory into place. Relative sources resolve
# against the recipe dir and are path-cleaned, so ../../ reaches the
# source-checkout root.
[dotfiles.ask_skill]
source = "../../skills/ask"
target = "~/.claude/skills/ask"
action = "symlink_dir"

# Codex discovers user skills from ~/.agents/skills; mirror the same dir there.
[dotfiles.ask_codex_skill]
source = "../../skills/ask"
target = "~/.agents/skills/ask"
action = "symlink_dir"
