# bionic — public layer only: build + install. MCP registration and the
# sandbox wrapper + seatbelt profile stay in the consuming repo's companion
# recipe — machine-private wiring (see docs/adr/0006).
[recipe]
name = "bionic"
description = "bionic — CLI and MCP server for bionic reading (half-bold speed-reading format)"
# wave 0: builds the binary before the consuming repo's MCP registration
# recipe (wave 1) points the MCP host at it.
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the path below names that cache directly.
[packages.bionic]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/tools/bionic"
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/bionic"]
