# cards: public layer, build + install only. Nothing machine-private exists
# for this tool (docs/adr/0006): no config file, no MCP registration, no
# service.
[recipe]
name = "cards"
description = "cards: terminal UI that shows JSON Lines from stdin as cards, a list to pick from or a feed to follow (CLI)"
# No wave: no recipe in a consuming repo builds against or registers cards.

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the path below names that cache directly.
[packages.cards]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/tools/cards"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/cards"]
