[recipe]
name = "wire"
description = "wire: session-to-session message bus; CLI + MCP + live web view for channels agents talk over"
wave = 0

# Consumed as a remote recipe: machines point at this repo with a
# [[recipe_sources]] stanza (name = "thismoon"), and ralph caches the checkout
# under ~/.config/ralph/sources/thismoon. Remote recipes cannot use relative
# working_dir on packages/builds, so the paths below name that cache directly.
[packages.wire]
source = "local"
working_dir = "~/.config/ralph/sources/thismoon/services/wire"
version_check = true
build = ["make build"]
install = ["make install"]
install_paths = ["~/code/bin/wire"]

# Restart the serve agent when the freshly installed binary actually changed.
# ralph hashes install_paths and runs this only when the bytes differ. The
# `t-man status` guard skips the restart on first install, where this fires
# before [hooks.builds.wire_service] has registered the agent.
[packages.wire.service]
restart = "if command -v t-man >/dev/null && t-man status wire >/dev/null 2>&1; then t-man restart wire; fi"

[hooks]
# Stop and remove the t-man-managed serve agent during cleanup, before the
# binary it runs is removed (ralph disable thismoon/wire && ralph up --enable-cleanup).
pre_uninstall = ["if command -v t-man >/dev/null; then t-man remove wire 2>/dev/null; fi || true"]

# Register `wire serve` as a long-running launchd user agent via t-man. This
# process owns the channel and message logs and holds every blocking reader;
# the MCP server (registered in the consuming repo's recipes/claude-mcp/servers.json)
# is a thin HTTP client to it. Idempotent; run = "always" keeps it registered
# and self-heals if it was removed.
[hooks.builds.wire_service]
commands = [
  "if command -v t-man >/dev/null; then t-man add --name wire -- $HOME/code/bin/wire serve --port 7432 --workdir $HOME/.local/share/wire; else echo 'wire: skip service (t-man not on PATH; install t-man then run: t-man add --name wire -- wire serve --port 7432)'; fi",
]
working_dir = "~/.config/ralph/sources/thismoon/recipes/wire"
run = "always"
depends_on = ["packages.wire", "packages.t_man"]
