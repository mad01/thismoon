# Repo-local belt overlay (hints-only; guards never read this file — see
# docs/adr/0012). Read by the commit-policy and lint-policy hints after a
# `git commit` here.
hints:
  commit-policy:
    message: >-
      thismoon main is PR-only, enforced by a GitHub ruleset — a direct push
      would be rejected server-side anyway. Multi-package release PRs merge
      via merge or rebase, never squash.
  lint-policy:
    message: >-
      run make fmt-changed at the repo root, then make lint in each touched
      component directory, before pushing. A component's own make fmt
      rewraps files the change never touched, since components are not
      golines-clean on main.
