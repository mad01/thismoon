<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pr</title>
<script src="/webkit/boot.js"></script>
<link href="/webkit/webkit.css" rel="stylesheet">
<style>
/* Palette and chrome come from /webkit/webkit.css; only pr-specific styles
   live here. The dashboard body is rendered client-side by /app.js into
   <div id="app">. */
:root {
  --pr-open: #3ba55d;
  --pr-draft: #8b949e;
  --pr-additions: #3ba55d;
  --pr-deletions: #d65745;
  --pr-review-approved: #3ba55d;
  --pr-review-changes: #e2a33c;
  --pr-review-pending: #8b949e;
}

.pr-app { max-width: var(--page-width, 1080px); margin: 0 auto; padding: 2rem 1.5rem 6rem; }

.pr-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
.pr-header h2 { margin: 0; font-size: 1.125rem; color: var(--text-1); }
.pr-count { font-size: 0.875rem; color: var(--text-3); }

.pr-actions-bar { display: flex; gap: 0.5rem; align-items: center; }

.btn {
  display: inline-flex; align-items: center; gap: 0.375rem;
  padding: 0.375rem 0.75rem; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-2); font-size: 0.8125rem;
  cursor: pointer; text-decoration: none; transition: background 0.15s;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary); color: #fff; opacity: 0.85; }
.btn-approve { background: var(--pr-open); color: #fff; border-color: var(--pr-open); }
.btn-approve:hover { background: var(--pr-open); color: #fff; opacity: 0.85; }
.btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }

.pr-review-badge {
  font-size: 0.6875rem; padding: 0.125rem 0.375rem; border-radius: 10px; font-weight: 500;
}
.pr-review-badge.approved { background: #3ba55d20; color: var(--pr-open); }
.pr-review-badge.changes-requested { background: #e2a33c20; color: var(--pr-review-changes); }
.pr-review-badge.review-required { background: var(--surface-2); color: var(--text-3); }

.pr-repo-tag {
  font-size: 0.6875rem; padding: 0.125rem 0.375rem; border-radius: 10px;
  font-weight: 600; background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border); white-space: nowrap;
}

.pr-list { display: flex; flex-direction: column; gap: 0.5rem; }

wk-card.pr-card { display: block; padding: 1rem 1.25rem; }
wk-card.pr-card:hover { border-color: var(--primary); }

.pr-row { display: flex; align-items: flex-start; gap: 1rem; }
.pr-info { flex: 1; min-width: 0; }
.pr-title-row { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.25rem; min-width: 0; overflow: hidden; }
.pr-number { color: var(--text-3); font-size: 0.875rem; font-weight: 500; }
.pr-title {
  font-weight: 600; font-size: 0.9375rem; color: var(--text-1);
  text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
a.pr-title:hover { color: var(--primary); text-decoration: underline; }
.pr-draft-badge {
  font-size: 0.6875rem; padding: 0.125rem 0.375rem; border-radius: 10px;
  background: var(--surface-2); color: var(--text-3); font-weight: 500;
}

.pr-meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem 1rem;
  font-size: 0.75rem; color: var(--text-3);
}
.pr-author { font-weight: 500; }
.pr-stats { display: flex; gap: 0.5rem; }
.pr-stat-add { color: var(--pr-additions); }
.pr-stat-del { color: var(--pr-deletions); }
.pr-labels { display: flex; gap: 0.25rem; flex-wrap: wrap; }
.pr-label {
  font-size: 0.6875rem; padding: 0.0625rem 0.375rem; border-radius: 10px;
  font-weight: 500; border: 1px solid transparent;
}

.pr-card-actions { display: flex; gap: 0.375rem; align-items: center; flex-shrink: 0; }

.pr-ticket {
  font-size: 0.6875rem; padding: 0.125rem 0.375rem; border-radius: 10px;
  font-weight: 600; background: #8250df20; color: #8250df; cursor: pointer;
  text-decoration: none; border: 1px solid #8250df40;
}
.pr-ticket:hover { background: #8250df30; }

.filter-bar { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-bottom: 1.5rem; align-items: center; }
.filter-label { font-size: 0.8125rem; color: var(--text-3); margin-right: 0.25rem; }
.filter-tag {
  font-size: 0.6875rem; padding: 0.1875rem 0.5rem; border-radius: 10px; cursor: pointer;
  font-weight: 500; border: 1px solid transparent; user-select: none;
  transition: background 0.15s, border-color 0.15s;
}
.filter-tag.ticket { background: #8250df15; color: #8250df; border-color: #8250df30; }
.filter-tag.ticket:hover, .filter-tag.ticket.active { background: #8250df30; border-color: #8250df60; }
.filter-tag.branch { background: var(--surface-2); color: var(--text-2); border-color: var(--border); }
.filter-tag.branch:hover, .filter-tag.branch.active { background: var(--surface-3, var(--border)); border-color: var(--text-3); }
.filter-tag.review-state.approved { background: #3ba55d15; color: #3ba55d; border-color: #3ba55d30; }
.filter-tag.review-state.approved:hover, .filter-tag.review-state.approved.active { background: #3ba55d30; border-color: #3ba55d60; }
.filter-tag.review-state.review-required { background: var(--surface-2); color: var(--text-3); border-color: var(--border); }
.filter-tag.review-state.review-required:hover, .filter-tag.review-state.review-required.active { background: var(--surface-3, var(--border)); border-color: var(--text-3); }
.filter-tag .filter-count { font-size: 0.625rem; opacity: 0.7; }
.filter-clear { font-size: 0.6875rem; color: var(--text-3); cursor: pointer; margin-left: 0.25rem; }
.filter-clear:hover { color: var(--primary); }

wk-card.pr-card.focused { outline: 2px solid var(--primary); outline-offset: -2px; }

wk-modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; padding: 1rem 1.5rem 1.25rem; }
.kbd { font-size: 0.75rem; color: var(--text-2); padding: 0.125rem 0.4rem; border: 1px solid var(--border); border-radius: 3px; font-family: 'SF Mono', 'Fira Code', monospace; background: var(--surface-1); min-width: 1.25rem; text-align: center; display: inline-block; }
.shortcuts-grid { display: grid; grid-template-columns: auto 1fr; gap: 0.375rem 1rem; align-items: baseline; }
.shortcuts-grid .kbd { justify-self: end; }
.shortcuts-grid span { font-size: 0.8125rem; color: var(--text-2); }

.empty { text-align: center; padding: 3rem; color: var(--text-3); }
.generated { font-size: 0.75rem; color: var(--text-3); text-align: right; margin-top: 1rem; }
</style>
</head>
<body>
<wk-header brand="pr"></wk-header>
<main class="pr-app"><div id="app"></div></main>

<wk-modal id="shortcuts-modal" hidden>
  <wk-modal-panel>
    <wk-modal-head><h3>Keyboard Shortcuts</h3></wk-modal-head>
    <wk-modal-body>
      <div class="shortcuts-grid">
        <span><span class="kbd">↓</span></span><span>Next PR</span>
        <span><span class="kbd">↑</span></span><span>Previous PR</span>
        <span><span class="kbd">↵</span></span><span>Open selected PR</span>
        <span><span class="kbd">⌘</span> <span class="kbd">↵</span></span><span>Approve selected PR</span>
        <span><span class="kbd">⌘</span> <span class="kbd">⇧</span> <span class="kbd">R</span></span><span>Refresh</span>
        <span><span class="kbd">esc</span></span><span>Clear filter / close</span>
        <span><span class="kbd">g</span> <span class="kbd">i</span></span><span>Go home (reset view)</span>
        <span><span class="kbd">⌘</span> <span class="kbd">/</span></span><span>Toggle this help</span>
      </div>
    </wk-modal-body>
    <wk-modal-actions>
      <button class="btn" onclick="toggleShortcuts()">Close <span class="kbd">esc</span></button>
    </wk-modal-actions>
  </wk-modal-panel>
</wk-modal>

<script src="/webkit/webkit.js"></script>
<script src="/app.js"></script>
</body>
</html>
