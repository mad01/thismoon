apiVersion: catalog.mad01/v1alpha1
kind: Component
metadata:
  name: catalog
  description: Reads service-info.yaml across repos and serves a localhost catalog UI (CLI + web)
  tags: [go, cli, web]
spec:
  type: cli
  lifecycle: production
  owner: mad01
  system: thismoon
  # Sandbox access for the catalog-web agent, rendered to
  # recipes/catalog/catalog-web.srt.json by `make sandbox-settings`
  # (docs/SANDBOXING.md, "Declaring access"). It scans ~/code for
  # service-info.yaml files, and the UI's Add form writes new ones.
  access:
    sandbox: srt
    label: catalog-web
    listen: 7575
    reads: [~/code, ~/.config/catalog]
    writes: [~/code/**/service-info.yaml, temp]
    deny:
      - ~/code/**/.env
      - ~/code/**/.env.*
      - ~/code/**/*.pem
      - ~/code/**/*.key
