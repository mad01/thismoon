apiVersion: catalog.mad01/v1alpha1
kind: Component
metadata:
  name: d-man
  description: Local domain front door, maps <name>.this to localhost via managed /etc/hosts and a reverse proxy
  tags: [go, cli, daemon]
spec:
  type: cli
  lifecycle: production
  owner: mad01
  system: thismoon
  # d-man stays outside srt (docs/adr/0006, 2026-10-25 amendment).
  access:
    sandbox: none
    reason: >-
      Root LaunchDaemon that rewrites /etc/hosts and binds port 80, outside
      what a per-user srt sandbox covers.
