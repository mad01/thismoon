<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0f1115; color: #e6e8eb;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 1.1rem; padding: 1.5rem; text-align: center;
  }
  h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2.1rem); font-weight: 700; }
  .host { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #ff7a90; }
  .sub { margin: 0; color: #9aa2ad; }
  .crt { position: relative; width: 100%; max-width: 640px; }
  .crt::after {
    /* scanlines over the upscaled low-res canvas */
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 12px;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
  }
  #game {
    display: block; width: 100%; image-rendering: pixelated;
    background: #0d1017; border: 1px solid #262b33; border-radius: 12px;
    touch-action: none;
  }
  .hint { color: #6b7480; font-size: 0.85rem; margin: 0; }
  kbd {
    background: #20252d; border: 1px solid #333b45; border-radius: 4px;
    padding: 0 .35em; font-family: ui-monospace, monospace; font-size: 0.85em;
  }
</style>
</head>
<body>
  <h1>🚫 <span class="host" id="host">this site</span> is blocked</h1>
  <p class="sub">d-man sent you here on purpose. Take a breath — or smash some bricks.</p>
  <div class="crt">
    <canvas id="game" width="320" height="240" aria-label="Retro arcade minigame, a random pick per visit"></canvas>
  </div>
  <p class="hint">arrows / mouse &middot; <kbd>space</kbd> to start &middot; <kbd>n</kbd> next game &middot; <kbd>m</kbd> to mute</p>
  <script>
    document.getElementById("host").textContent = location.hostname || "this site";
  </script>
  <script src="/arcade.js"></script>
  <script src="/smash.js"></script>
  <script src="/gate.js"></script>
  <!-- plugin-games -->
</body>
</html>
