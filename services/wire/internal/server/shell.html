<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Channels</title>
<script src="/webkit/boot.js"></script>
<link href="/webkit/webkit.css" rel="stylesheet">
<style>
/* Palette, header chrome, page-header, card, badge visuals all come from
   /webkit/webkit.css. Only wire-specific layout lives here. The channel list
   and the transcript are rendered client-side by /app.js into <div id="app">. */
.wrap{padding-top:1.5rem}
.hint{color:var(--text-3);font-size:0.85rem;margin:0 0 1.25rem}
.hint code{background:var(--chip-bg);padding:0.05rem 0.35rem;border-radius:3px}
.empty{color:var(--text-3);font-size:0.9375rem;padding:2rem 0}
.c-list{display:flex;flex-direction:column;gap:0.75rem}
.c-head{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.4rem}
.c-name{font-size:0.9375rem;font-weight:600;color:var(--text-1);font-family:var(--mono)}
.c-topic{font-size:0.875rem;color:var(--text-2);margin-bottom:0.35rem}
.c-last{font-size:0.85rem;color:var(--text-2);margin-bottom:0.35rem}
.c-last b{font-weight:600;color:var(--text-1)}
.c-meta{font-size:0.78rem;color:var(--text-3);font-variant-numeric:tabular-nums}
.back{display:inline-block;font-size:0.82rem;color:var(--text-3);margin-bottom:1rem}
.back:hover{color:var(--accent)}
/* Transcript: one block per turn, sender and time above the body. */
.t-list{display:flex;flex-direction:column;gap:1rem}
.t-msg{border-left:2px solid var(--border);padding-left:0.8rem}
.t-msg.t-own{border-left-color:var(--accent)}
.t-from{font-size:0.82rem;font-weight:600;color:var(--text-1);font-family:var(--mono)}
.t-when{font-size:0.75rem;color:var(--text-3);margin-left:0.5rem;font-variant-numeric:tabular-nums}
.t-body{font-size:0.9375rem;color:var(--text-2);white-space:pre-wrap;word-break:break-word;margin-top:0.25rem}
.t-connect{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin:0 0 1rem}
.t-connect-label{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-3)}
.t-connect code{font-family:var(--mono);font-size:0.82rem;background:var(--chip-bg);padding:0.15rem 0.45rem;border-radius:4px;color:var(--text-1);user-select:all}
.t-live{display:flex;align-items:center;gap:0.45rem;font-size:0.78rem;color:var(--text-3);margin:0 0 1.25rem}
.t-dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.t-dot.on{background:var(--green)}
</style>
</head>
<body>
<wk-header brand="wire" title="Channels"></wk-header>
<main class="wrap"><div id="app"></div></main>
<script src="/webkit/webkit.js"></script>
<script src="/app.js"></script>
</body>
</html>
