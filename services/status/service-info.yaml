apiVersion: catalog.mad01/v1alpha1
kind: Component
metadata:
  name: status
  description: Status page for t-man-managed local services with 30-day uptime history
  tags: [go, cli, dashboard]
spec:
  type: cli
  lifecycle: production
  owner: mad01
  system: thismoon
  # Sandbox access, rendered to recipes/status/status.srt.json by
  # `make sandbox-settings` (docs/SANDBOXING.md, "Declaring access").
  access:
    sandbox: srt
    workdir: ~/.local/share/status
    listen: 7426
    # The events post. The probes of every t-man service's port are loopback
    # too, which listen already allows.
    local: [events]
    reads:
      # The binaries status asks for their installed version.
      - ~/code/bin
      - workdir
      # The t-man plists it discovers services from (/Library/LaunchDaemons
      # sits outside ~ and stays readable), and d-man's generated routes file
      # for the .this links. launchctl print needs no extra access.
      - ~/Library/LaunchAgents
      - ~/.config/d-man/routes.toml
    writes: [workdir, temp]
    # osascript posts the crash-loop and stale-binary banners through the
    # notification daemon, and needs trustd to load Standard Additions
    # (`display notification`). Its other start-up lookups stay denied and
    # are on the fleet ignore list (recipes/speak/sandbox-ignore.conf).
    extra:
      network:
        allowMachLookup: [com.apple.usernoted.daemon_client, com.apple.trustd.agent]
