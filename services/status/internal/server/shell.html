<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>status</title>
<script src="/webkit/boot.js"></script>
<link href="/webkit/webkit.css" rel="stylesheet">
<style>
/* Palette and chrome come from /webkit/webkit.css; only status-specific
   styles live here. The dashboard body is rendered client-side by /app.js
   into <div id="app">. */
:root {
  --st-ok: var(--green);
  --st-warn: var(--amber);
  --st-down: var(--red);
  --st-none: var(--border);
}

/* No top padding: webkit's header margin is the one space above the page. */
.status { max-width: var(--page-width, 1080px); margin: 0 auto; padding: 0 1.5rem 6rem; }

.svc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 720px) { .svc-grid { grid-template-columns: 1fr; } }

.banner {
  border-radius: 8px;
  padding: 0.875rem 1.25rem;
  font-weight: 600;
  margin-bottom: 2rem;
}
.banner.ok { background: var(--st-ok); color: var(--on-green); }
.banner.warn { background: var(--st-warn); color: var(--on-amber); }
.banner.down { background: var(--st-down); color: var(--on-red); }
.banner.none { background: var(--text-3); color: var(--bg); }
.banner a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }

.legend {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 0.8125rem; color: var(--text-3); margin-bottom: 0.75rem;
}

wk-card.svc { display: block; padding: 1.25rem 1.5rem; scroll-margin-top: 4.5rem; }

.svc-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.75rem; }
.svc-name { font-weight: 600; font-size: 1rem; color: var(--text-1); text-decoration: none; }
a.svc-name:hover { color: var(--primary); text-decoration: underline; text-underline-offset: 3px; }
.svc-state { font-size: 0.875rem; font-weight: 500; }
.svc-state.ok { color: var(--st-ok); }
.svc-state.warn { color: var(--st-warn); }
.svc-state.down { color: var(--st-down); }
.svc-state.none { color: var(--text-3); }

.bars { display: flex; gap: 3px; }
.bar { flex: 1 1 0; height: 34px; min-width: 4px; border-radius: 2px; }
.bar.ok { background: var(--st-ok); }
.bar.warn { background: var(--st-warn); }
.bar.down { background: var(--st-down); }
.bar.none { background: var(--st-none); }

.svc-axis {
  display: flex; align-items: center; gap: 0.75rem;
  font-size: 0.75rem; color: var(--text-3); margin-top: 0.625rem;
}
.svc-axis .axis-line { flex: 1; border-top: 1px solid var(--border); }

.svc-meta { display: flex; flex-wrap: wrap; gap: 0.375rem 1.25rem; margin-top: 0.875rem; font-size: 0.75rem; }
.meta-k { color: var(--text-3); }
.meta-v { color: var(--text-2); font-family: 'SF Mono', 'Fira Code', monospace; }
</style>
</head>
<body>
<wk-header brand="status"><a data-nav href="/webkit/themes">Themes</a></wk-header>
<main class="status"><div id="app"></div></main>
<script src="/webkit/webkit.js"></script>
<script src="/app.js"></script>
</body>
</html>
