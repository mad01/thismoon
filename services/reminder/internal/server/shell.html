<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders</title>
<script src="/webkit/boot.js"></script>
<link href="/webkit/webkit.css" rel="stylesheet">
<style>
/* Palette, header chrome, page-header, card, badge, modal, toast visuals all
   come from /webkit/webkit.css. Only reminder-specific layout lives here. The
   reminder list is rendered client-side by /app.js into <div id="app">. */
.wrap{padding-top:1.5rem}
.hint{color:var(--text-3);font-size:0.85rem;margin:0 0 1.5rem}
.hint code{background:var(--chip-bg);padding:0.05rem 0.35rem;border-radius:3px}
.empty{color:var(--text-3);font-size:0.9375rem;padding:2rem 0}
.rem-list{display:flex;flex-direction:column;gap:0.75rem}
wk-card.rem{display:flex;align-items:center;gap:0.75rem}
.rem-main{min-width:0;flex:1}
.rem-title{font-size:0.9375rem;font-weight:600;color:var(--text-1)}
.rem-sub{font-size:0.78rem;color:var(--text-3);margin-top:0.25rem;font-variant-numeric:tabular-nums}
.rem-actions{flex:none;display:flex;align-items:center;gap:0.5rem}
</style>
</head>
<body>
<wk-header brand="reminder" title="Reminders"></wk-header>
<main class="wrap"><div id="app"></div></main>

<wk-modal hidden id="delete-modal">
  <wk-modal-panel role="dialog" aria-modal="true" aria-labelledby="delete-heading">
    <wk-modal-head>
      <h2 id="delete-heading">Delete reminder?</h2>
      <button class="btn btn-ghost" id="delete-x" aria-label="Close">✕</button>
    </wk-modal-head>
    <wk-modal-body>
      <p><strong id="delete-title"></strong> will be permanently removed. This cannot be undone.</p>
    </wk-modal-body>
    <wk-modal-actions>
      <wk-button variant="ghost" id="delete-cancel">Cancel</wk-button>
      <wk-button variant="danger" id="delete-confirm">Delete</wk-button>
    </wk-modal-actions>
  </wk-modal-panel>
</wk-modal>

<wk-toast-host id="toast-host"></wk-toast-host>

<script src="/webkit/webkit.js"></script>
<script src="/app.js"></script>
</body>
</html>
