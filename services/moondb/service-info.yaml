apiVersion: catalog.mad01/v1alpha1
kind: Component
metadata:
  name: moondb
  description: Edit history between commits, linked to the agent turn that made it; CLI + MCP + webkit web page on port 7433
  tags: [go, cli, mcp]
spec:
  type: cli
  lifecycle: development
  owner: mad01
  system: thismoon
  # Sandbox access, rendered to recipes/moondb/moondb.srt.json by
  # `make sandbox-settings` (docs/SANDBOXING.md, "Declaring access"). It reads
  # the code roots to blame and diff, minus the secret files in them.
  access:
    sandbox: srt
    workdir: ~/.local/state/moondb
    listen: 7433
    local: [events, keeper-of-facts]
    reads: [~/code, ~/.worktrees, ~/.config/ralph/sources, workdir]
    writes: [workdir, temp]
    deny:
      - ~/code/**/.env
      - ~/code/**/.env.*
      - ~/code/**/*.pem
      - ~/code/**/*.key
      - ~/.worktrees/**/.env
      - ~/.worktrees/**/.env.*
      - ~/.worktrees/**/*.pem
      - ~/.worktrees/**/*.key
      - ~/.config/ralph/sources/**/.env
      - ~/.config/ralph/sources/**/.env.*
      - ~/.config/ralph/sources/**/*.pem
      - ~/.config/ralph/sources/**/*.key
