<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>moondb</title>
<script src="/webkit/boot.js"></script>
<link href="/webkit/webkit.css" rel="stylesheet">
<style>
/* Palette, header chrome, page header, table, card, panel, section and badge
   visuals all come from /webkit/webkit.css. Only moondb-specific layout
   lives here, and every colour reads a webkit role, so the page follows the
   theme in light and dark. The four views (sessions, session, turn, file)
   are rendered client-side by /app.js into <div id="app">. */
.wrap{padding-top:1.5rem}
.hint{color:var(--text-3);font-size:0.85rem;margin:0 0 1.25rem}
.hint code,.inline-code{font-family:var(--mono);background:var(--chip-bg);padding:0.05rem 0.35rem;border-radius:3px;font-size:0.85em}
.empty{color:var(--text-3);font-size:0.9375rem;padding:1.25rem 0}
.back{display:inline-block;margin:0 0.75rem 1rem 0;font-size:0.85rem;color:var(--primary)}
.muted{color:var(--text-3)}
.mono{font-family:var(--mono);font-size:0.8rem}
.num{font-variant-numeric:tabular-nums;text-align:right}
.nowrap{white-space:nowrap}
.row{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap}
.spaced{margin-top:1.5rem}
#app a{color:var(--primary);text-underline-offset:2px}

/* sessions list: a window switch and repo chips, a strip that adds the
   window up, then one table with a heading row per day */
.ls-controls{display:flex;flex-wrap:wrap;align-items:center;gap:0.75rem 1.25rem;margin:0 0 1.1rem}
.ls-chips{display:flex;flex-wrap:wrap;gap:0.4rem}
.ls-chips wk-badge{font-size:0.75rem;gap:0.4rem}
.ls-n{font-variant-numeric:tabular-nums;opacity:0.6}
.ls-strip{display:flex;flex-wrap:wrap;align-items:baseline;gap:0.3rem 1.6rem;padding:0.75rem 0.1rem;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:0.82rem;color:var(--text-2)}
.ls-fig b{font-size:1.2rem;font-weight:650;color:var(--text-1);font-variant-numeric:tabular-nums;margin-right:0.35rem;letter-spacing:-0.01em}
.ls-scope{margin-left:auto;color:var(--text-3);font-size:0.8rem}
/* the strip's cost by repo: one bar stacked by attributed part, a label each */
.ls-split{flex-basis:100%;display:flex;flex-direction:column;gap:0.45rem;margin-top:0.35rem}
.ls-bar{display:flex;gap:2px;height:0.55rem;border-radius:3px;overflow:hidden;background:var(--chip-bg)}
.ls-seg{flex:1 1 0;min-width:3px;background:var(--hue)}
.ls-seg:hover{filter:brightness(1.15)}
.ls-seg.is-hatched,.ls-swatch.is-hatched{background:repeating-linear-gradient(135deg,var(--hue) 0 2px,color-mix(in srgb,var(--hue) 35%,transparent) 2px 4px)}
.ls-split-labels{display:flex;flex-wrap:wrap;gap:0.25rem 1.1rem;font-size:0.78rem;color:var(--text-2)}
.ls-split-label{display:inline-flex;align-items:center;gap:0.35rem;white-space:nowrap}
.ls-split-label b{font-weight:600;color:var(--text-1);font-variant-numeric:tabular-nums}
.ls-chip-cost{font-variant-numeric:tabular-nums;font-weight:600}
.ls-table table{table-layout:fixed;margin-top:0.25rem}
.ls-table th.c-repo{width:13rem}
.ls-table th.c-when{width:13rem}
.ls-table th.c-n{width:4.4rem}
.ls-table th.c-cost{width:5.6rem}
.ls-table th.num{text-align:right}
.ls-table td{vertical-align:middle}
.ls-table td.num{color:var(--text-2)}
.ls-table td.zero{color:var(--text-3);opacity:0.55}
.ls-table tr.ls-day td,.ls-table tr.ls-day:hover td{background:none;padding:1.4rem 0.75rem 0.4rem;border-bottom:1px solid var(--border-hover)}
.ls-table tbody:first-of-type tr.ls-day td{padding-top:0.8rem}
.ls-day-in{display:flex;align-items:baseline;gap:0.6rem}
.ls-day-name{font-size:0.9rem;font-weight:650;color:var(--text-1)}
.ls-day-date{font-size:0.78rem;color:var(--text-3)}
.ls-day-sum{margin-left:auto;font-size:0.78rem;color:var(--text-3);font-variant-numeric:tabular-nums}
#app .ls-title a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-1);font-weight:500;text-decoration:none}
#app .ls-title a:hover{color:var(--primary);text-decoration:underline}
.ls-repos{flex-wrap:nowrap;gap:0.3rem;min-width:0}
#app a.ls-badge{display:inline-flex;align-items:center;gap:0.4rem;min-width:0;max-width:100%;padding:0.18rem 0.5rem 0.18rem 0.4rem;border-radius:4px;background:color-mix(in srgb,var(--hue) 13%,transparent);color:var(--text-1);font-family:var(--mono);font-size:0.72rem;text-decoration:none;border:1px solid transparent}
#app a.ls-badge:hover{border-color:color-mix(in srgb,var(--hue) 55%,transparent)}
.ls-swatch{flex:none;width:0.5rem;height:0.5rem;border-radius:2px;background:var(--hue)}
.ls-badge-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls-more,.ls-norepo{font-size:0.72rem;color:var(--text-3);white-space:nowrap}
.ls-when{color:var(--text-2);font-variant-numeric:tabular-nums;overflow:hidden}
.ls-when-main{white-space:nowrap}
.ls-days{display:inline-block;white-space:nowrap;color:var(--text-3)}
.ls-dot{display:inline-block;width:0.5rem;height:0.5rem;border-radius:50%;border:1.5px solid var(--text-3);margin-right:0.5rem;vertical-align:0.05em;box-sizing:border-box}
.ls-dot.is-on{background:var(--green);border-color:var(--green);animation:ls-pulse 2.4s ease-out infinite}
@keyframes ls-pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%,100%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.ls-dot.is-on{animation:none}}
.ls-ago.is-on{color:var(--green);font-weight:600}
.ls-span{color:var(--text-3)}
.ls-span::before{content:"\00B7";margin:0 0.45rem}
.ls-cost{font-weight:600}
.ls-table td.ls-cost{color:var(--text-1)}
/* a narrow screen folds columns to zero width, not display:none: the day
   row spans all eight, so a hidden column would take a share of the title's */
@media (max-width:900px){.ls-table th.c-sm,.ls-table td.c-sm{width:0;padding:0;border-width:0;visibility:hidden}.ls-table th.c-repo{width:9.5rem}}
@media (max-width:640px){.ls-table th.c-repo,.ls-table td.ls-repo{width:0;padding:0;border-width:0;visibility:hidden}.ls-scope{margin-left:0}}
.more{margin-top:1rem}
/* session page: the line under the title */
.ss-line{display:flex;flex-wrap:wrap;align-items:center;gap:0.45rem 1.1rem;margin-top:0.5rem;font-size:0.875rem;color:var(--text-2);font-variant-numeric:tabular-nums}
.ss-status.is-on{color:var(--green);font-weight:600}
.ss-costs{gap:0.35rem 1.1rem;font-size:0.82rem}
.ls-sub b{font-size:1rem;color:var(--text-2)}
/* session page: the agents table */
.ag-who{gap:0.4rem;flex-wrap:nowrap}
.ag-name{font-weight:500;color:var(--text-1);white-space:nowrap}
.ag-turns{font-variant-numeric:tabular-nums;white-space:nowrap}
.ag-cost{font-weight:600}
.ag-repo{gap:0.4rem;flex-wrap:nowrap;margin-top:0.2rem;font-size:0.75rem;color:var(--text-3);white-space:nowrap}
#app th .th-sort{color:inherit;font:inherit;font-size:inherit;text-transform:inherit;letter-spacing:inherit;text-decoration:underline dotted;text-underline-offset:3px}

/* prose blocks: prompts and final messages keep their line breaks */
.prose{white-space:pre-wrap;word-break:break-word;font-size:0.9375rem;line-height:1.7;color:var(--text-1)}
.prompt-cell{font-weight:500;color:var(--text-1)}
.prompt-cell a{color:inherit;text-decoration:none}
.prompt-cell a:hover{color:var(--primary)}

/* edits grouped by worktree, then path */
.wt-head{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin:1.5rem 0 0.75rem;padding-bottom:0.4rem;border-bottom:1px solid var(--border)}
.wt-head code{font-family:var(--mono);font-size:0.85rem;color:var(--text-1)}
.path-head{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin:1rem 0 0.5rem}
.path-head a{font-family:var(--mono);font-size:0.85rem;font-weight:600}
.e-head{display:flex;align-items:center;gap:0.45rem;flex-wrap:wrap;margin-bottom:0.6rem;font-size:0.8rem}
.e-note{font-size:0.8rem;color:var(--text-3);margin:0.25rem 0}
.e-links{margin-left:auto;font-size:0.75rem}
.e-links a{color:var(--text-3);margin-left:0.6rem}
.e-links a:hover{color:var(--primary)}

/* unified diff, rendered from structuredPatch hunks or a unified diff text */
.diff{overflow-x:auto;border:1px solid var(--code-border);border-radius:8px;background:var(--code-bg);font-family:var(--mono);font-size:0.76rem;line-height:1.5}
.diff table{border-collapse:collapse;width:100%}
.diff td{padding:0 0.6rem;vertical-align:top;border:none}
.diff code{font-family:inherit;font-size:inherit;background:none;padding:0;white-space:pre;tab-size:4;color:var(--text-1)}
.diff .d-ln{width:1%;text-align:right;user-select:none;white-space:nowrap;padding:0 0.45rem}
.diff .d-ln code{color:var(--text-3)}
.diff .d-sign{width:1%;user-select:none;padding:0 0.2rem 0 0.4rem}
.diff tr.d-hunk td{background:var(--code-header-bg);padding:0.15rem 0.6rem}
.diff tr.d-hunk code{color:var(--text-3)}
.diff tr.d-add td{background:color-mix(in srgb,var(--green) 14%,transparent)}
.diff tr.d-add .d-sign code{color:var(--green)}
.diff tr.d-del td{background:color-mix(in srgb,var(--red) 14%,transparent)}
.diff tr.d-del .d-sign code{color:var(--red)}
.diff tr.d-mark code{color:var(--text-3);font-style:italic}
.diff tr.d-why{cursor:pointer}
.diff tr.d-why:hover td{background:color-mix(in srgb,var(--green) 26%,transparent)}
.diff tr.d-whyrow td{padding:0.5rem 0.6rem;background:var(--card-bg);white-space:normal}
.diff-more{margin-top:0.5rem}

/* the inline answer to "why is this line here?" */
.why-card{border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:8px;padding:0.6rem 0.8rem;font-size:0.82rem;line-height:1.55;color:var(--text-1);background:var(--card-bg)}
.why-card .row{margin-bottom:0.25rem}
.why-card ol{margin:0.35rem 0 0 1.2rem;padding:0}
.why-card li{margin:0.15rem 0}

/* raw transcript */
.raw{max-height:32rem;overflow:auto;font-family:var(--mono);font-size:0.74rem;background:var(--code-bg);border:1px solid var(--code-border);border-radius:6px;padding:0.6rem;white-space:pre-wrap;word-break:break-all;margin:0 0 0.75rem}
.raw code{font-family:inherit;background:none;padding:0}

/* file view: annotation with a turn band per line, and the history timeline */
.legend{display:flex;flex-direction:column;gap:0.3rem;margin:0 0 1rem;font-size:0.82rem}
.legend .row{flex-wrap:nowrap}
.swatch{display:inline-block;flex:none;width:0.8rem;height:0.8rem;border-radius:3px;background:var(--band)}
.swatch.content{background:repeating-linear-gradient(135deg,var(--band) 0 3px,transparent 3px 5px);border:1px solid var(--band)}
.annot .a-gut{width:1%;white-space:nowrap;padding:0 0.5rem 0 0.6rem;border-left:4px solid transparent}
.annot .a-gut a{color:var(--text-3);text-decoration:none}
.annot .a-gut a:hover{color:var(--primary)}
.annot tr[data-turn]{cursor:pointer}
.annot tr[data-turn] .a-gut{border-left-color:var(--band)}
.annot tr[data-method="content"] .a-gut{border-left-style:dashed}
.annot tr[data-turn]:hover td{background:color-mix(in srgb,var(--band) 14%,transparent)}
.timeline{list-style:none;margin:0;padding:0 0 0 1rem;border-left:2px solid var(--border)}
.timeline li{position:relative;margin:0 0 1rem;padding-left:0.9rem}
.timeline li::before{content:"";position:absolute;left:-1.42rem;top:0.35rem;width:0.7rem;height:0.7rem;border-radius:50%;background:var(--band, var(--border-hover));border:2px solid var(--bg)}
.timeline .row{font-size:0.8rem}
.timeline .tl-prompt{font-size:0.88rem;color:var(--text-1);margin:0.15rem 0}
.timeline .tl-prompt a{color:inherit}
.timeline .tl-prompt a:hover{color:var(--primary)}
.timeline .diff{margin-top:0.5rem}
/* session trace: a totals strip, then a lane per turn with a row of bars per
   span kind, each lane scaled to its own turn */
.tr-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0.75rem;margin:0 0 1rem}
.tr-stats wk-stat{margin:0;padding:0.8rem 1rem}
.tr-stats wk-stat-value{font-size:1.6rem}
.tr-legend{display:flex;flex-wrap:wrap;align-items:center;gap:0.4rem 1.1rem;margin:0 0 0.75rem;font-size:0.8rem;color:var(--text-2)}
.tr-legend .row{gap:0.4rem;flex-wrap:nowrap}
.tr-swatch{background:var(--bar)}
.tr-lanes{display:flex;flex-direction:column;gap:0.3rem}
.tr-lane{display:grid;grid-template-columns:15rem minmax(0,1fr) 8.5rem;align-items:center;gap:0.75rem;font-size:0.8rem}
#app a.tr-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-1);text-decoration:none}
#app a.tr-label:hover{color:var(--primary)}
.tr-track{display:flex;flex-direction:column;gap:2px;padding:3px 0;background:var(--chip-bg);border-radius:4px}
.tr-row{position:relative;height:7px}
.tr-bar{position:absolute;top:0;bottom:0;min-width:2px;border-radius:2px;background:var(--bar);box-shadow:0 0 0 0.5px var(--card-bg)}
.tr-failed{background:repeating-linear-gradient(135deg,var(--bar) 0 2px,color-mix(in srgb,var(--bar) 35%,transparent) 2px 4px)}
.tr-bar:hover{outline:1.5px solid var(--text-1);outline-offset:1px;z-index:1}
.tr-meta{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text-3)}
@media (max-width:700px){
  .tr-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tr-lane{grid-template-columns:minmax(0,1fr)}
  .tr-meta{text-align:left}
}
.linkish{background:none;border:none;padding:0;font:inherit;font-size:0.78rem;color:var(--primary);cursor:pointer}
.linkish:hover{text-decoration:underline}
</style>
</head>
<body>
<wk-header brand="moondb" page-width="1240"><a data-nav href="/">Sessions</a><a data-nav href="/webkit/themes">Themes</a></wk-header>
<main class="wrap"><div id="app"></div></main>
<wk-toast-host id="toast-host"></wk-toast-host>
<script src="/webkit/webkit.js"></script>
<script src="/app.js"></script>
</body>
</html>
