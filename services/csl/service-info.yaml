apiVersion: catalog.mad01/v1alpha1
kind: Component
metadata:
  name: csl
  description: Local code search + MCP stdio server and localhost web UI (zoekt)
  tags: [go, cli, mcp, daemon]
spec:
  type: cli
  lifecycle: production
  owner: mad01
  system: thismoon
  # csl-web stays outside srt (docs/adr/0006, 2026-10-25 amendment).
  access:
    sandbox: none
    reason: >-
      csl-web pulls repos over ssh, which srt cannot proxy, and ssh needs the
      user's keys or SSH agent, which the sandbox exists to keep out.
