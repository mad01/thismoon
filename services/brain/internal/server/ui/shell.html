<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>brain</title>
<script src="/webkit/boot.js"></script>
<link href="/webkit/webkit.css" rel="stylesheet">
<style>
/* Palette, header chrome, badges, segmented controls and prose come from
   /webkit/webkit.css. Only the brain layout lives here: the toolbar row and
   the graph stage under the header, and the note popup over them. app.js
   renders all of it into <div id="app">. */

/* The graph palette app.js reads by role (graph.js names the roles): the
   canvas, the edges, the hover and selection halos, and one fill and
   border pair per node colour. The dark variants sit a tenth of the way
   toward the dark canvas. */
:root{--graph-bg:#F9FCFF;--edge:#A5ABB6;--edge-text:#5D626C;--halo-hover:rgba(106,198,255,0.3);--halo-selected:rgba(253,204,89,0.3);--label-pill:#FFFFFF;--label-pill-text:#2A2C34;
--node-blue:#4C8EDA;--node-blue-border:#2870C2;--node-orange:#F79767;--node-orange-border:#F36924;--node-cyan:#57C7E3;--node-cyan-border:#23B3D7;--node-green:#8DCC93;--node-green-border:#5DB665;--node-purple:#C990C0;--node-purple-border:#B261A5;--node-yellow:#FFC454;--node-yellow-border:#D7A013;--node-red:#F16667;--node-red-border:#EB2728;--node-beige:#D9C8AE;--node-beige-border:#C0A378;--node-pink:#ECB5C9;--node-pink-border:#DA7298;--node-rose:#DA7194;--node-rose-border:#CC3C6C;--node-teal:#569480;--node-teal-border:#447666;--node-brown:#604A0E;--node-brown-border:#423204;--node-grey:#A5ABB6;--node-grey-border:#9AA1AC}
[data-theme="dark"]{--graph-bg:#292C33;--edge:#80858F;--edge-text:#B5BAC4;--halo-hover:rgba(106,198,255,0.35);--halo-selected:rgba(253,204,89,0.35);--label-pill:#1F2126;--label-pill-text:#E3E5EA;
--node-blue:#4884C9;--node-blue-border:#2869B4;--node-orange:#E28C62;--node-orange-border:#DF6326;--node-cyan:#52B8D1;--node-cyan-border:#24A6C7;--node-green:#83BC89;--node-green-border:#58A860;--node-purple:#B986B2;--node-purple-border:#A45C9A;--node-yellow:#EAB551;--node-yellow-border:#C69416;--node-red:#DD6062;--node-red-border:#D82829;--node-beige:#C7B8A2;--node-beige-border:#B19771;--node-pink:#D8A7BA;--node-pink-border:#C86B8E;--node-rose:#C86A8A;--node-rose-border:#BC3A66;--node-teal:#528A78;--node-teal-border:#416F61;--node-brown:#5A4712;--node-brown-border:#403109;--node-grey:#999EA9;--node-grey-border:#8F95A0}

html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
wk-header{flex:none}
wk-header .topbar{margin-bottom:0}
#app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}

/* The toolbar is one row; below 1100px it may wrap, and the search field
   and its result line shrink first. */
.toolbar{flex:none;display:flex;flex-wrap:nowrap;align-items:center;gap:0.45rem 1rem;padding:0.5rem 0.9rem;border-bottom:1px solid var(--border);font-size:0.8rem;color:var(--text-2)}
.tb-group{display:flex;flex-wrap:nowrap;align-items:center;gap:0.4rem 0.7rem;flex:none}
.tb-push{margin-left:auto}
.toolbar label{display:inline-flex;align-items:center;gap:0.3rem;cursor:pointer;white-space:nowrap}
.toolbar select{appearance:auto;background:var(--paper);border:1px solid var(--border);border-radius:6px;padding:0.2rem 0.35rem;font:inherit;color:var(--text-1);max-width:10rem}
.toolbar input[type=range]{width:4.5rem}
.toolbar .off{opacity:0.45}
.search{flex:0 1 auto;min-width:0;gap:0.5rem}
.search input{flex:0 1 15rem;width:15rem;min-width:7rem;appearance:none;background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:0.32rem 0.6rem;font:inherit;color:var(--text-1)}
.search input:focus{outline:none;border-color:var(--primary)}
.search wk-seg{flex:none}
.search-n{flex:0 1 auto;min-width:0;max-width:16rem;overflow:hidden;text-overflow:ellipsis;color:var(--text-3);font-size:0.75rem;white-space:nowrap}
.tb-btn{flex:none;display:inline-flex;align-items:center;gap:0.4rem;appearance:none;background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:0.28rem 0.65rem;font:inherit;color:var(--text-1);cursor:pointer;white-space:nowrap}
.tb-btn:hover{border-color:var(--border-hover)}
.tb-btn .count{min-width:1.3rem;padding:0 0.35rem;border-radius:999px;font-size:0.72rem;font-weight:600;line-height:1.3rem;text-align:center}
.tb-btn .count[hidden]{display:none}
.review .count{background:var(--primary);color:var(--paper)}
.filters-btn .count{background:var(--chip-bg);color:var(--text-1)}
@media (max-width:1100px){.toolbar,.tb-group{flex-wrap:wrap}}

/* The Filters popover: anchored under its button by app.js, which sets
   left and top; the browser closes it on Esc or a click outside. */
.filters{inset:auto;margin:0;box-sizing:border-box;width:19rem;max-width:calc(100vw - 12px);padding:0.8rem 0.9rem;border:1px solid var(--border);border-radius:10px;background:var(--paper);color:var(--text-2);box-shadow:0 10px 30px rgba(0,0,0,0.18)}
.filters .f-grid{display:grid;grid-template-columns:auto 1fr;gap:0.45rem 0.8rem;align-items:center}
.filters .f-grid>span{color:var(--text-3)}
.filters select{max-width:none;width:100%}
.filters .f-toggles{display:grid;grid-template-columns:1fr 1fr;gap:0.45rem 0.8rem;margin:0.75rem 0 0;padding:0.65rem 0 0;border-top:1px solid var(--border)}

#graph{position:relative;flex:1;min-height:0;background:var(--graph-bg)}
#graph .sigma{position:absolute;inset:0;outline:none}
.overlay{position:absolute;z-index:2;font-size:0.75rem;color:var(--text-3)}
.status{top:0.6rem;left:0.8rem;background:color-mix(in srgb,var(--paper) 85%,transparent);padding:0.2rem 0.5rem;border-radius:6px}
.legend{bottom:0.6rem;left:0.8rem;display:flex;flex-wrap:wrap;gap:0.3rem 0.75rem;max-width:70%;background:color-mix(in srgb,var(--paper) 85%,transparent);padding:0.35rem 0.55rem;border-radius:6px}
.legend span{display:inline-flex;align-items:center;gap:0.3rem;color:var(--text-2)}
.legend i{display:inline-block;width:0.7rem;height:0.7rem;border-radius:50%;box-sizing:border-box;border:2px solid transparent}
.legend i.line{width:0.9rem;height:2px;border:none;border-radius:1px}
.zoom{bottom:0.6rem;right:0.8rem;display:flex;gap:0.25rem}
.zoom button{appearance:none;background:var(--paper);border:1px solid var(--border);border-radius:6px;width:1.9rem;height:1.9rem;font:inherit;color:var(--text-2);cursor:pointer}
.zoom button:hover{color:var(--text-1);border-color:var(--border-hover)}
.empty[hidden]{display:none}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;color:var(--text-3);z-index:1}
.empty wk-callout{max-width:34rem;text-align:left}

/* The note popup: a modal dialog centred over the dimmed graph. The panel
   scrolls inside; the head stays on top with the close button. webkit.css
   zeroes every margin, so the auto margin that centres a modal dialog is
   set again here. */
.pop{margin:auto;box-sizing:border-box;width:min(760px,calc(100vw - 2rem));max-width:760px;max-height:85vh;padding:0;border:1px solid var(--border);border-radius:14px;background:var(--paper);color:var(--text-1);box-shadow:0 18px 60px rgba(0,0,0,0.28);overflow:hidden}
.pop[open]{display:flex;flex-direction:column}
.pop::backdrop{background:rgba(20,22,28,0.45)}
.pop:focus{outline:none}
.pop-scroll{overflow-y:auto;min-height:0;padding:0 1.4rem 1.2rem;font-size:0.88rem}
.pop-scroll:focus{outline:none}
.pop-head{position:sticky;top:0;z-index:1;display:flex;align-items:flex-start;gap:0.6rem;padding:1.1rem 0 0.5rem;background:var(--paper)}
.pop-title{flex:1;font-size:1.2rem;font-weight:600;color:var(--text-1);margin:0;overflow-wrap:anywhere}
.btn-x{appearance:none;background:none;border:none;border-radius:6px;color:var(--text-3);cursor:pointer;font-size:1.05rem;line-height:1;padding:0.25rem 0.4rem}
.btn-x:hover{color:var(--text-1);background:var(--chip-bg)}
.note-ref{color:var(--text-3);font-size:0.75rem;overflow-wrap:anywhere;margin:0 0 0.6rem}
.note-meta{display:flex;flex-wrap:wrap;gap:0.3rem;margin:0 0 0.7rem}
.note-meta wk-badge[data-tag]{cursor:pointer}
.note-actions{display:flex;gap:0.4rem;margin:0 0 0.8rem}
.pop wk-callout{margin:0 0 0.8rem}
.note-body{font-size:0.92rem;margin:0 0 1.2rem}
.note-body a.wikilink{color:var(--primary);text-decoration:none;border-bottom:1px dotted var(--primary)}
.note-body .wikilink.dangling{color:var(--text-3);border-bottom:1px dashed var(--text-3)}
.fm{margin:0 0 1rem;font-size:0.8rem}
.fm summary{cursor:pointer;color:var(--text-3)}
.fm dl{display:grid;grid-template-columns:auto 1fr;gap:0.15rem 0.7rem;margin:0.4rem 0 0}
.fm dt{color:var(--text-3)}
.fm dd{margin:0;color:var(--text-2);overflow-wrap:anywhere}
.sec{margin:0 0 1.25rem}
.sec-title{font-size:0.72rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-3);margin:0 0 0.5rem;display:flex;align-items:center;gap:0.4rem}
.sec-title .n{color:var(--text-2);font-weight:500;letter-spacing:0;text-transform:none}
.pop wk-seg{display:flex;flex-wrap:wrap;margin:0 0 0.6rem}
.pop wk-seg button{flex:1}
.hint{color:var(--text-3);font-size:0.78rem;margin:0.35rem 0}
.hint code{background:var(--chip-bg);padding:0.05rem 0.3rem;border-radius:3px}
.list{display:flex;flex-direction:column;gap:2px;margin:0.4rem 0 0}
.row{display:flex;align-items:baseline;gap:0.4rem;width:100%;text-align:left;background:none;border:none;border-radius:6px;padding:0.3rem 0.45rem;font:inherit;color:var(--text-2);cursor:pointer}
.row:hover{background:var(--chip-bg);color:var(--text-1)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{flex:none;color:var(--text-3);font-size:0.75rem}
.row.multi{flex-direction:column;align-items:stretch;gap:0.15rem}
.row .sub{color:var(--text-3);font-size:0.75rem;overflow-wrap:anywhere}
.row .snip{color:var(--text-2);font-size:0.78rem;overflow-wrap:anywhere}
.group{margin:0.6rem 0 0}
.group-title{font-size:0.78rem;color:var(--text-1);font-weight:600;margin:0 0 0.2rem}
</style>
</head>
<body>
<wk-header brand="brain" title="Knowledge graph" page-width="1600"><a data-nav href="/webkit/themes">Themes</a></wk-header>
<div id="app"></div>
<wk-toast-host id="toast-host"></wk-toast-host>
<script src="/webkit/webkit.js"></script>
<script src="/assets/brain-graph.bundle.js"></script>
<script src="/graph.js"></script>
<script src="/app.js"></script>
</body>
</html>
