<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events</title>
<script src="/webkit/boot.js"></script>
<link href="/webkit/webkit.css" rel="stylesheet">
<style>
/* Palette, header chrome, page-header, card, badge, search, seg visuals all come
   from /webkit/webkit.css. Only events-specific timeline layout lives here. */
.wrap{padding-top:1.5rem}
.controls{display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center;margin:0 0 1.25rem}
.controls wk-search{flex:1;min-width:14rem}
#source-chips{display:flex;flex-wrap:wrap;gap:0.4rem}
/* Compact, evenly-spaced rows: one card per event, slim padding, a clear gap
   between events. Time · source · level · title sit on a single baseline row;
   message + tags wrap underneath, aligned under the title. */
#timeline{display:flex;flex-direction:column;gap:0.5rem}
wk-card.ev{display:block;padding:0.5rem 0.75rem}
.ev-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:0.5rem}
.ev-time{font-size:0.75rem;color:var(--text-3);font-variant-numeric:tabular-nums;flex:none}
.ev-title{font-size:0.875rem;font-weight:600;color:var(--text-1);flex:1 1 auto;min-width:8rem}
.ev-msg{font-size:0.8125rem;color:var(--text-3);margin-top:0.2rem;white-space:pre-wrap;word-break:break-word}
.ev-tags{display:flex;flex-wrap:wrap;gap:0.3rem;margin-top:0.3rem}
.ev-tag{font-size:0.72rem;color:var(--text-3);background:var(--chip-bg);padding:0.05rem 0.4rem;border-radius:3px;font-variant-numeric:tabular-nums;cursor:pointer}
.ev-tag:hover{color:var(--text-1)}
/* Coalesced burst: one clickable card standing in for a run of same-source
   events; members render as slim indented rows when expanded. */
wk-card.ev-group{cursor:pointer}
.ev-count{font-size:0.875rem;font-weight:600;color:var(--text-1)}
.ev-preview{font-size:0.8125rem;color:var(--text-3);flex:1 1 auto;min-width:8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-members{margin-top:0.45rem;display:flex;flex-direction:column;gap:0.3rem;border-left:2px solid var(--chip-bg);padding-left:0.6rem}
.ev-member{display:flex;flex-wrap:wrap;align-items:baseline;gap:0.5rem;font-size:0.8125rem;color:var(--text-1)}
.day-sep{font-size:0.75rem;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.05em;margin:0.75rem 0 0.1rem}
.day-sep:first-child{margin-top:0}
.empty{color:var(--text-3);font-size:0.9375rem;padding:2rem 0}
#sentinel{height:1px}
</style>
</head>
<body>
<wk-header brand="events" title="Events"></wk-header>
<main class="wrap">
  <wk-page-header>
    <wk-title>Events</wk-title>
    <wk-subtitle id="subtitle">Loading…</wk-subtitle>
  </wk-page-header>

  <div class="controls">
    <wk-search>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="q" type="search" placeholder="Filter events…">
    </wk-search>
    <wk-seg id="level-seg">
      <button class="active" data-level="">All</button>
      <button data-level="info">info</button>
      <button data-level="warn">warn</button>
      <button data-level="error">error</button>
    </wk-seg>
  </div>
  <div id="source-chips"></div>

  <div id="timeline"></div>
  <div id="sentinel"></div>
</main>

<script src="/webkit/webkit.js"></script>
<script>
(function(){
  var TAIL_MS = 7000, PAGE = 200;
  // A run of >= GROUP_MIN consecutive same-source events, each within
  // GROUP_WINDOW_MS of the previous, collapses into one expandable card.
  var GROUP_MIN = 3, GROUP_WINDOW_MS = 60000;
  var all = [], newestId = "", activeSources = {}, level = "", q = "";
  var expanded = {}; // group key (newest member id) -> true
  // Paging state: the timeline holds PAGE events at first and appends older
  // pages as the sentinel scrolls into view. gen invalidates in-flight
  // responses when a filter change resets the window.
  var loading = false, done = false, gen = 0;
  var timeline = document.getElementById('timeline');
  var sentinel = document.getElementById('sentinel');
  var subtitle = document.getElementById('subtitle');
  var chips = document.getElementById('source-chips');
  var qInput = document.getElementById('q');
  var levelSeg = document.getElementById('level-seg');

  // Semantic webkit variants: error -> red, warn -> amber, info -> stat (calm gray).
  function levelVariant(l){ return l === 'error' ? 'error' : l === 'warn' ? 'warn' : 'stat'; }
  function worstLevel(evs){
    var worst = 'info';
    evs.forEach(function(ev){
      if (ev.level === 'error') worst = 'error';
      else if (ev.level === 'warn' && worst !== 'error') worst = 'warn';
    });
    return worst;
  }

  function relTime(iso){
    var d = new Date(iso), s = Math.max(0, (Date.now() - d.getTime()) / 1000);
    if (s < 60) return Math.floor(s) + 's ago';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  function dayLabel(iso){
    var d = new Date(iso), now = new Date();
    var start = function(x){ return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
    var days = Math.round((start(now) - start(d)) / 86400000);
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    var label = d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
    if (d.getFullYear() !== now.getFullYear()) label += ' ' + d.getFullYear();
    return label;
  }

  // badge builds a <wk-badge> with text set via textContent (never innerHTML).
  function badge(variant, text){
    var b = document.createElement('wk-badge');
    if (variant) b.setAttribute('variant', variant);
    b.textContent = text;
    return b;
  }

  // timeEl renders a relative timestamp carrying its ISO time in data-iso so
  // refreshTimes() can re-derive "Xs ago" on every tail tick.
  function timeEl(iso){
    var t = document.createElement('span');
    t.className = 'ev-time';
    t.dataset.iso = iso;
    t.textContent = relTime(iso);
    t.title = iso;
    return t;
  }

  function tagChips(tags){
    var keys = Object.keys(tags).sort();
    if (!keys.length) return null;
    var wrap = document.createElement('div');
    wrap.className = 'ev-tags';
    keys.forEach(function(k){
      var chip = document.createElement('span');
      chip.className = 'ev-tag';
      chip.textContent = k + '=' + tags[k];
      chip.title = 'Filter by ' + k + '=' + tags[k];
      wrap.appendChild(chip);
    });
    return wrap;
  }

  function card(ev){
    var c = document.createElement('wk-card');
    c.className = 'ev';

    // Single baseline row: time · source · level · title.
    var head = document.createElement('div');
    head.className = 'ev-head';
    head.appendChild(timeEl(ev.time));
    head.appendChild(badge('', ev.source + (ev.component ? '/' + ev.component : '')));
    head.appendChild(badge(levelVariant(ev.level), ev.level));
    var title = document.createElement('span');
    title.className = 'ev-title';
    title.textContent = ev.title;
    head.appendChild(title);
    c.appendChild(head);

    if (ev.message){
      var msg = document.createElement('div');
      msg.className = 'ev-msg';
      msg.textContent = ev.message;
      c.appendChild(msg);
    }
    if (ev.tags){
      var tw = tagChips(ev.tags);
      if (tw) c.appendChild(tw);
    }
    return c;
  }

  function groupCard(evs){
    var key = evs[0].id;
    var c = document.createElement('wk-card');
    c.className = 'ev ev-group';
    c.dataset.groupKey = key;

    var head = document.createElement('div');
    head.className = 'ev-head';
    head.appendChild(timeEl(evs[0].time));
    head.appendChild(badge('', evs[0].source));
    head.appendChild(badge(levelVariant(worstLevel(evs)), worstLevel(evs)));
    var count = document.createElement('span');
    count.className = 'ev-count';
    count.textContent = (expanded[key] ? '▾ ' : '▸ ') + evs.length + ' events';
    head.appendChild(count);
    if (!expanded[key]){
      var preview = document.createElement('span');
      preview.className = 'ev-preview';
      preview.textContent = evs.map(function(ev){ return ev.title; }).join(' · ');
      head.appendChild(preview);
    }
    c.appendChild(head);

    if (expanded[key]){
      var members = document.createElement('div');
      members.className = 'ev-members';
      evs.forEach(function(ev){
        var row = document.createElement('div');
        row.className = 'ev-member';
        row.appendChild(timeEl(ev.time));
        if (ev.level !== 'info') row.appendChild(badge(levelVariant(ev.level), ev.level));
        var title = document.createElement('span');
        title.textContent = ev.title + (ev.message ? ' — ' + ev.message : '');
        row.appendChild(title);
        members.appendChild(row);
      });
      c.appendChild(members);
    }
    return c;
  }

  function activeSourceList(){ return Object.keys(activeSources).filter(function(k){ return activeSources[k]; }); }

  function filtersActive(){ return !!(level || q || activeSourceList().length); }

  // buildItems collapses bursts: walk the newest-first list, and whenever a run
  // of same-source events (each within the window of the one before it) reaches
  // GROUP_MIN, replace the run with a single group item.
  function buildItems(evs){
    var items = [];
    var i = 0;
    while (i < evs.length){
      var j = i + 1;
      while (j < evs.length && evs[j].source === evs[i].source &&
             (new Date(evs[j-1].time) - new Date(evs[j].time)) <= GROUP_WINDOW_MS){
        j++;
      }
      if (j - i >= GROUP_MIN){
        items.push({group: evs.slice(i, j)});
      } else {
        for (var k = i; k < j; k++) items.push({ev: evs[k]});
      }
      i = j;
    }
    return items;
  }

  // render rebuilds the timeline from the loaded window. Filtering happens
  // server-side (see pageURLs), so everything in `all` is shown.
  function render(){
    timeline.replaceChildren();
    if (!all.length){
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = filtersActive() ? 'No events match these filters.' : 'No events recorded yet.';
      timeline.appendChild(e);
    } else {
      var lastDay = '';
      buildItems(all).forEach(function(item){
        var newest = item.group ? item.group[0] : item.ev;
        var day = dayLabel(newest.time);
        if (day !== lastDay){
          var sep = document.createElement('div');
          sep.className = 'day-sep';
          sep.textContent = day;
          timeline.appendChild(sep);
          lastDay = day;
        }
        timeline.appendChild(item.group ? groupCard(item.group) : card(item.ev));
      });
    }
    subtitle.textContent = all.length + ' event' + (all.length === 1 ? '' : 's') + ' loaded' + (filtersActive() ? ' (filtered)' : '');
  }

  function renderChips(sources){
    chips.replaceChildren();
    sources.forEach(function(sc){
      var pill = badge('filter', sc.source + ' (' + sc.count + ')');
      pill.dataset.source = sc.source;
      if (activeSources[sc.source]) pill.setAttribute('active', '');
      chips.appendChild(pill);
    });
  }

  // Filters live in the URL (?q=&level=&sources=a,b) so a view can be reloaded
  // or bookmarked. replaceState keeps history clean while filtering.
  function initFromURL(){
    var p = new URLSearchParams(location.search);
    var rawQ = p.get('q') || '';
    qInput.value = rawQ;
    q = rawQ.trim();
    var l = p.get('level') || '';
    if (l === 'info' || l === 'warn' || l === 'error') level = l;
    levelSeg.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('active', b.dataset.level === level);
    });
    (p.get('sources') || '').split(',').forEach(function(s){
      if (s) activeSources[s] = true;
    });
  }

  function syncURL(){
    var p = new URLSearchParams();
    if (qInput.value.trim()) p.set('q', qInput.value.trim());
    if (level) p.set('level', level);
    var picked = activeSourceList();
    if (picked.length) p.set('sources', picked.join(','));
    var qs = p.toString();
    history.replaceState(null, '', qs ? '?' + qs : location.pathname);
  }

  function refreshTimes(){
    timeline.querySelectorAll('[data-iso]').forEach(function(el){
      el.textContent = relTime(el.dataset.iso);
    });
  }

  chips.addEventListener('click', function(e){
    var pill = e.target.closest('wk-badge[data-source]');
    if (!pill) return;
    var src = pill.dataset.source;
    activeSources[src] = !activeSources[src];
    if (activeSources[src]) pill.setAttribute('active', ''); else pill.removeAttribute('active');
    syncURL();
    resetAndLoad();
  });

  levelSeg.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-level]');
    if (!btn) return;
    level = btn.dataset.level;
    this.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b === btn); });
    syncURL();
    resetAndLoad();
  });

  // Debounced so a fetch fires per pause in typing, not per keystroke.
  var qTimer = 0;
  qInput.addEventListener('input', function(){
    q = this.value.trim();
    syncURL();
    clearTimeout(qTimer);
    qTimer = setTimeout(resetAndLoad, 250);
  });

  timeline.addEventListener('click', function(e){
    var tag = e.target.closest('.ev-tag');
    if (tag){
      qInput.value = tag.textContent;
      q = tag.textContent;
      syncURL();
      resetAndLoad();
      return;
    }
    var group = e.target.closest('wk-card[data-group-key]');
    if (group){
      var key = group.dataset.groupKey;
      expanded[key] = !expanded[key];
      render();
    }
  });

  // Filters are applied server-side so matches older than the loaded window
  // still surface. The API takes a single source=, so with several chips
  // active one request per source goes out; the responses merge newest-first.
  function pageURLs(param, cursor){
    var base = '/api/events?limit=' + PAGE;
    if (level) base += '&level=' + encodeURIComponent(level);
    if (q) base += '&q=' + encodeURIComponent(q);
    if (cursor) base += '&' + param + '=' + encodeURIComponent(cursor);
    var srcs = activeSourceList();
    if (!srcs.length) return [base];
    return srcs.map(function(s){ return base + '&source=' + encodeURIComponent(s); });
  }

  function fetchMerged(param, cursor){
    return Promise.all(pageURLs(param, cursor).map(function(u){
      return fetch(u).then(function(r){ return r.json(); });
    })).then(function(lists){
      var merged = [];
      lists.forEach(function(l){ if (l && l.length) merged = merged.concat(l); });
      merged.sort(function(a, b){ return a.id < b.id ? 1 : a.id > b.id ? -1 : 0; });
      return merged;
    });
  }

  // loadPage fetches one page older than `before` ('' = the newest page) and
  // appends it. An empty page marks the store exhausted until the next reset.
  function loadPage(before){
    if (loading) return;
    loading = true;
    var myGen = gen;
    fetchMerged('before', before).then(function(merged){
      if (myGen !== gen) return;
      loading = false;
      // Cut multi-source merges back to one page; the discarded tail is
      // refetched under the next page's cursor.
      if (merged.length > PAGE) merged = merged.slice(0, PAGE);
      if (!merged.length){
        done = true;
      } else {
        all = before ? all.concat(merged) : merged;
        newestId = all[0].id; // API returns newest-first
      }
      render();
      maybeLoadMore();
    }).catch(function(){
      if (myGen === gen) loading = false;
    });
  }

  // maybeLoadMore keeps fetching while the sentinel sits in or near the
  // viewport, so short pages still fill the screen.
  function maybeLoadMore(){
    if (loading || done || !all.length) return;
    var r = sentinel.getBoundingClientRect();
    if (r.top <= (window.innerHeight || document.documentElement.clientHeight) + 200){
      loadPage(all[all.length - 1].id);
    }
  }

  // resetAndLoad drops the scroll window and refetches page one with the
  // current filters; the gen bump invalidates in-flight responses.
  function resetAndLoad(){
    gen++;
    loading = false;
    done = false;
    all = [];
    newestId = '';
    loadPage('');
    fetch('/api/sources').then(function(r){ return r.json(); }).then(renderChips).catch(function(){});
  }

  function tail(){
    refreshTimes();
    maybeLoadMore();
    if (!newestId){
      // An empty (or fully filtered-out) store has no cursor to tail from;
      // re-probe page one so the first event still shows up.
      if (!loading && done){ done = false; loadPage(''); }
      return;
    }
    var myGen = gen;
    fetchMerged('since', newestId).then(function(list){
      if (myGen !== gen || !list.length) return;
      all = list.concat(all);
      newestId = all[0].id;
      fetch('/api/sources').then(function(r){ return r.json(); }).then(renderChips).catch(function(){});
      render();
    }).catch(function(){});
  }

  new IntersectionObserver(function(entries){
    for (var i = 0; i < entries.length; i++){
      if (entries[i].isIntersecting){ maybeLoadMore(); return; }
    }
  }, {rootMargin: '200px'}).observe(sentinel);

  initFromURL();
  resetAndLoad();
  setInterval(tail, TAIL_MS);
})();
</script>
</body>
</html>
