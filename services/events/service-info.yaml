apiVersion: catalog.mad01/v1alpha1
kind: Component
metadata:
  name: events
  description: Local event/audit log service, CLI + MCP + webkit timeline, archive-only JSONL store
  tags: [go, cli, mcp]
spec:
  type: cli
  lifecycle: production
  owner: mad01
  system: thismoon
  # Sandbox access, rendered to recipes/events/events.srt.json by
  # `make sandbox-settings` (docs/SANDBOXING.md, "Declaring access").
  access:
    sandbox: srt
    workdir: ~/.local/share/events
    listen: 7430
    reads: [~/code/bin, workdir]
    writes: [workdir, temp]
