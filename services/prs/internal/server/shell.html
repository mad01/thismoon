<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open PRs</title>
<script src="/webkit/boot.js"></script>
<link href="/webkit/webkit.css" rel="stylesheet">
<style>
/* Palette, header chrome, page-header, card, badge visuals all come from
   /webkit/webkit.css. Only prs-specific layout lives here. The PR list is
   rendered client-side by /app.js into <div id="app">. */
.wrap{padding-top:1.5rem}
.hint{color:var(--text-3);font-size:0.85rem;margin:0 0 1.25rem}
.hint code{background:var(--chip-bg);padding:0.05rem 0.35rem;border-radius:3px}
.empty{color:var(--text-3);font-size:0.9375rem;padding:2rem 0}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:0.6rem;margin:0 0 1.5rem}
.filters select{appearance:none;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.7rem;font-family:inherit;font-size:0.85rem;color:var(--text-1)}
.filters select:focus{outline:none;border-color:var(--accent)}
.filters button{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.7rem;font-family:inherit;font-size:0.85rem;color:var(--text-2);cursor:pointer}
.filters button:hover{border-color:var(--accent);color:var(--text-1)}
.pr-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;background:var(--card-bg)}
.pr-row{display:flex;align-items:center;gap:0.55rem;flex-wrap:wrap;padding:0.45rem 0.75rem;border-bottom:1px solid var(--border)}
.pr-row:last-child{border-bottom:none}
.pr-time{font-size:0.72rem;color:var(--text-3);font-variant-numeric:tabular-nums;flex:none;width:2.4rem}
.pr-title{flex:1;min-width:14rem;font-size:0.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-title a{color:var(--text-1);text-decoration:none}
.pr-title a:hover{color:var(--accent)}
.pr-meta{flex:none;font-size:0.75rem;color:var(--text-3);font-variant-numeric:tabular-nums}
.pr-open{flex:none;font-size:0.78rem;color:var(--accent);text-decoration:none;white-space:nowrap}
.pr-open:hover{text-decoration:underline}
.pr-error{margin:0 0 0.75rem}
.footer{color:var(--text-3);font-size:0.78rem;margin-top:1.5rem;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<wk-header brand="prs" title="Open PRs"></wk-header>
<main class="wrap"><div id="app"></div></main>
<wk-toast-host id="toast-host"></wk-toast-host>
<script src="/webkit/webkit.js"></script>
<script src="/app.js"></script>
</body>
</html>
