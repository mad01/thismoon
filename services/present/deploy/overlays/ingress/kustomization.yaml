# Expose the shared instance through an Ingress. The hostname lives in the
# present-host ConfigMap alone and is replaced into the Ingress host and the
# external-dns annotation, so a private overlay redefines one value:
#
#   configMapGenerator:
#     - name: present-host
#       behavior: replace
#       literals: [host=present.corp.example]
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: present
resources:
  - ../../base
  - ingress.yaml
configMapGenerator:
  - name: present-host
    literals:
      - host=present.example.com
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: present-host
      fieldPath: data.host
    targets:
      - select:
          kind: Ingress
          name: present
        fieldPaths:
          - spec.rules.0.host
          - metadata.annotations.[external-dns.alpha.kubernetes.io/hostname]
