# Everything the store does: get, list and watch (the page cache, the
# sweeper, and Ping), create, update (read-modify-write under
# resourceVersion), delete. No patch, and nothing outside the pages
# resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: present-pages
  labels:
    app: present
rules:
  - apiGroups: [present.thismoon.mad01.dev]
    resources: [pages]
    verbs: [get, list, watch, create, update, delete]
