<!-- present-template:v9 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<script src="/webkit/boot.js"></script>
<link href="/assets/css/fonts.css" rel="stylesheet">
<link href="/webkit/webkit.css" rel="stylesheet">
<script src="/assets/js/cytoscape-3.31.0.min.js"></script>
<script src="/assets/js/dagre-0.8.5.min.js"></script>
<script src="/assets/js/cytoscape-dagre-2.5.0.js"></script>
<script src="/assets/js/chart-4.4.6.umd.min.js"></script>
<style>
/* Palette, header chrome, and the font/bionic/size/theme controls now come from
   /webkit/webkit.css. Only present-specific content styles live here. */
@keyframes briefEnter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.brief { max-width: var(--page-width, 1080px); margin: 0 auto; padding: 2rem 1.5rem 6rem; animation: briefEnter 0.35s ease-out; }

.brief-title {
  font-size: 2.125rem;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.15;
  margin-bottom: 0.625rem;
}
.brief-meta { font-size: 0.8125rem; color: var(--text-3); margin-bottom: 0.5rem; letter-spacing: 0.02em; }
.brief-summary { font-size: 1.0625rem; color: var(--text-2); line-height: 1.75; margin-bottom: 2.5rem; max-width: 640px; }

.chip-row { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.5rem; }

wk-kv-value code, code { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; background: var(--chip-bg); padding: 0.125rem 0.375rem; border-radius: 3px; }

.brief a:not(.topbar-link):not(wk-toc a) { color: var(--primary); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; cursor: pointer; transition: text-decoration-color 0.15s; }
.brief a:not(.topbar-link):not(wk-toc a):hover { text-decoration-color: var(--primary); }

.cy-container { width: 100%; height: 520px; border-radius: 8px; overflow: hidden; }

.cy-wrapper { position: relative; }
.cy-controls {
  position: absolute; top: 0.5rem; right: 0.5rem; z-index: 10;
  display: flex; gap: 0.25rem;
}
.cy-controls .size-btn {
  background: var(--card-bg); opacity: 0.85;
  box-shadow: var(--shadow-sm);
}
.cy-controls .size-btn:hover { opacity: 1; }
.cy-close-btn { display: none !important; }
.cy-backdrop {
  display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.5); z-index: 9998;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.cy-backdrop.active { display: block; animation: backdropIn 0.2s ease-out; }
@keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
.cy-wrapper.cy-fullscreen {
  position: fixed; top: 1.5rem; left: 1.5rem; right: 1.5rem; bottom: 1.5rem;
  z-index: 9999; background: var(--card-bg);
  border-radius: 14px; border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  animation: graphExpand 0.25s ease-out;
}
@keyframes graphExpand {
  from { opacity: 0.9; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}
.cy-wrapper.cy-fullscreen .cy-container { height: 100% !important; border-radius: 14px; }
.cy-wrapper.cy-fullscreen .cy-controls { top: 0.75rem; right: 0.75rem; }
.cy-wrapper.cy-fullscreen .cy-close-btn { display: flex !important; }

.brief-list { padding-left: 1.5rem; margin: 0.75rem 0; font-size: 0.875rem; color: var(--text-2); line-height: 1.7; }
.brief-list li { margin-bottom: 0.375rem; }

/* Metric charts (Chart.js). Container holds a relative canvas wrapper so
   Chart.js can size responsively; title comes from the data-chart-title attr. */
.present-chart {
  margin: 1rem 0 1.5rem;
  padding: 1rem 1.25rem 1.25rem;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.present-chart[data-chart-title]::before {
  content: attr(data-chart-title);
  display: block;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-2);
  letter-spacing: 0.01em;
  margin-bottom: 0.75rem;
}
.present-chart-canvas { position: relative; width: 100%; height: 300px; }
/* Sparkline: compact, chromeless. */
.present-chart.is-sparkline { padding: 0.5rem 0.75rem; }
.present-chart.is-sparkline .present-chart-canvas { height: 56px; }
.present-chart .chart-spec { display: none; }

.refs-section { margin-top: 3.5rem; padding-top: 2rem; border-top: 1px solid var(--border); }
.refs-list { list-style: none; display: flex; flex-direction: column; gap: 0.625rem; }
.refs-item { display: flex; flex-direction: column; gap: 0.125rem; }
.refs-item a { font-size: 0.875rem; font-weight: 500; color: var(--primary); text-decoration: none; transition: color 0.15s; }
.refs-item a:hover { text-decoration: underline; }
.refs-url { font-size: 0.75rem; color: var(--text-3); }

@media (max-width: 600px) {
  .brief { padding: 1rem 1rem 4rem; }
  .brief-title { font-size: 1.625rem; }
  .cy-container { height: 380px; }
  .cy-controls .size-btn { width: 2rem; height: 2rem; }
  .cy-wrapper.cy-fullscreen { top: 0; left: 0; right: 0; bottom: 0; border-radius: 0; }
  .cy-wrapper.cy-fullscreen .cy-container { border-radius: 0; }
}
</style>
</head>
<body>
<wk-header back-href="/" back-label="← All" title="Brief" controls="cmdk,font,bionic,size,speed,reload,theme" bionic-targets="[data-bionic], wk-panel-title, wk-panel-subtitle, wk-kv-value, wk-callout, wk-section p"></wk-header>
<div class="brief">

  <!-- CONTENT START -->
{{CONTENT}}
  <!-- CONTENT END -->

  <!-- REFERENCES -->
{{REFERENCES}}

</div>

<script>
// ── Cytoscape capture + graph controls ──
(function() {
  var orig = window.cytoscape;
  if (!orig) return;
  // cytoscape-dagre auto-registers against the global at load time, but make
  // the dagre layout registration explicit and idempotent here so initGraph's
  // `layout: 'dagre'` is self-documenting and survives any script-load-order
  // change. cytoscape.use() re-running for an already-registered layout is a
  // no-op, so this is safe to call unconditionally.
  if (window.cytoscapeDagre && typeof orig.use === 'function') {
    try { orig.use(window.cytoscapeDagre); } catch (e) {}
  }
  window._cyInstance = null;
  window.cytoscape = function() {
    var cy = orig.apply(this, arguments);
    if (arguments[0] && arguments[0].container) window._cyInstance = cy;
    return cy;
  };
  for (var k in orig) if (orig.hasOwnProperty(k)) window.cytoscape[k] = orig[k];
})();

(function() {
  var el = document.getElementById('cy-graph');
  if (!el) return;

  var wrapper = document.createElement('div');
  wrapper.className = 'cy-wrapper';
  el.parentNode.insertBefore(wrapper, el);
  wrapper.appendChild(el);

  var backdrop = document.createElement('div');
  backdrop.className = 'cy-backdrop';
  document.body.appendChild(backdrop);

  var svgFit = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 8V5a2 2 0 012-2h3"/><path d="M21 8V5a2 2 0 00-2-2h-3"/><path d="M3 16v3a2 2 0 002 2h3"/><path d="M21 16v3a2 2 0 01-2 2h-3"/><circle cx="12" cy="12" r="3"/></svg>';
  var svgExpand = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>';
  var svgCollapse = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/></svg>';
  var svgClose = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>';

  var ctrls = document.createElement('div');
  ctrls.className = 'cy-controls';
  ctrls.innerHTML =
    '<button class="size-btn cy-close-btn" data-cy="close" title="Close">' + svgClose + '</button>' +
    '<button class="size-btn" data-cy="in" title="Zoom in">+</button>' +
    '<button class="size-btn" data-cy="out" title="Zoom out">&minus;</button>' +
    '<button class="size-btn" data-cy="fit" title="Reset view">' + svgFit + '</button>' +
    '<button class="size-btn" data-cy="fs" title="Fullscreen">' + svgExpand + '</button>';
  wrapper.appendChild(ctrls);

  function cy() { return window._cyInstance; }
  function mid() { return { x: el.clientWidth / 2, y: el.clientHeight / 2 }; }

  function openPopup() {
    wrapper.classList.add('cy-fullscreen');
    backdrop.classList.add('active');
    ctrls.querySelector('[data-cy="fs"]').innerHTML = svgCollapse;
    ctrls.querySelector('[data-cy="fs"]').title = 'Exit fullscreen';
    var c = cy();
    if (c) setTimeout(function() { c.resize(); c.fit(undefined, 40); c.center(); }, 120);
  }

  function closePopup() {
    wrapper.classList.remove('cy-fullscreen');
    backdrop.classList.remove('active');
    ctrls.querySelector('[data-cy="fs"]').innerHTML = svgExpand;
    ctrls.querySelector('[data-cy="fs"]').title = 'Fullscreen';
    var c = cy();
    if (c) setTimeout(function() { c.resize(); c.fit(undefined, 30); }, 80);
  }

  ctrls.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-cy]');
    if (!btn) return;
    var action = btn.getAttribute('data-cy'), c = cy();
    if (action === 'close') { closePopup(); return; }
    if (action === 'fs') {
      wrapper.classList.contains('cy-fullscreen') ? closePopup() : openPopup();
      return;
    }
    if (!c) return;
    if (action === 'in') c.zoom({ level: c.zoom() * 1.3, renderedPosition: mid() });
    else if (action === 'out') c.zoom({ level: c.zoom() / 1.3, renderedPosition: mid() });
    else if (action === 'fit') { c.fit(undefined, 30); c.center(); }
  });

  backdrop.addEventListener('click', closePopup);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && wrapper.classList.contains('cy-fullscreen')) closePopup();
  });
})();
</script>

<script>
// ── Metric charts (Chart.js) ──
// Each {t:"chart"} Doc block renders a .present-chart div carrying a JSON spec
// in a <script type="application/json">. We read every block, build a Chart.js
// instance into its canvas, and rebuild on theme change so colors track the
// palette — mirroring how the Cytoscape graph recolors via getGraphColors().
function getChartColors() {
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  return dark
    ? { series:['#E8956A','#7AAAE8','#6BC48A','#8B6BB0'], grid:'#4A453D', text:'#B8B2A7' }
    : { series:['#C4704B','#5B8EC4','#4A9E6B','#8B6BB0'], grid:'#D8D4CD', text:'#6B6459' };
}
function chartSeriesColor(colors, name, i) {
  var map = { terracotta:0, blue:1, green:2, purple:3 };
  var idx = (name && Object.prototype.hasOwnProperty.call(map, name)) ? map[name] : (i % colors.series.length);
  return colors.series[idx];
}
function buildChartOptions(kind, spec, colors) {
  var spark = kind === 'sparkline';
  var multi = (spec.series || []).length > 1;
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    plugins: {
      legend: { display: multi && !spark, labels: { color: colors.text, boxWidth: 12, font: { size: 11 } } },
      title: { display: false },
      tooltip: { enabled: !spark }
    },
    scales: {
      x: { display: !spark, grid: { color: colors.grid, drawBorder: false }, ticks: { color: colors.text, font: { size: 11 } } },
      y: { display: !spark, beginAtZero: true, grid: { color: colors.grid, drawBorder: false },
           ticks: { color: colors.text, font: { size: 11 } },
           title: { display: !!spec.unit, text: spec.unit || '', color: colors.text, font: { size: 11 } } }
    }
  };
}
function initPresentCharts() {
  if (typeof Chart === 'undefined') return;
  document.querySelectorAll('.present-chart').forEach(function(block) {
    var specEl = block.querySelector('.chart-spec');
    var canvas = block.querySelector('canvas');
    if (!specEl || !canvas) return;
    var spec;
    try { spec = JSON.parse(specEl.textContent); } catch (e) { return; }
    if (block._chart) { block._chart.destroy(); block._chart = null; }
    var kind = spec.kind || 'bar';
    block.classList.toggle('is-sparkline', kind === 'sparkline');
    var colors = getChartColors();
    var series = spec.series || [];
    var labels = ((series[0] && series[0].points) || []).map(function(p) { return p.x || ''; });
    var datasets = series.map(function(s, i) {
      var col = chartSeriesColor(colors, s.color, i);
      var ds = { label: s.name || '', data: (s.points || []).map(function(p) { return p.y; }),
                 borderColor: col, backgroundColor: col };
      if (kind === 'area') { ds.fill = true; ds.backgroundColor = col + '33'; ds.tension = 0.3; ds.pointRadius = 2; ds.borderWidth = 2; }
      else if (kind === 'sparkline') { ds.fill = false; ds.pointRadius = 0; ds.borderWidth = 1.5; ds.tension = 0.3; }
      else { ds.borderWidth = 0; }
      return ds;
    });
    block._chart = new Chart(canvas, {
      type: kind === 'bar' ? 'bar' : 'line',
      data: { labels: labels, datasets: datasets },
      options: buildChartOptions(kind, spec, colors)
    });
  });
}
</script>

<!-- GRAPH SCRIPT -->
{{GRAPH_SCRIPT}}

<!-- Read aloud: per-section TTS playback via the speak service (speak.this).
     Injects play buttons only when the service is reachable. -->
<wk-read-aloud targets=".brief-summary, wk-section"></wk-read-aloud>

<script src="/webkit/webkit.js"></script>
<script>
// ── Chrome is the <wk-header> element above; it self-upgrades. ──
// Recolor the graph on theme change via the wk-themechange event.
document.addEventListener('wk-themechange', function () {
  if (typeof initGraph === 'function') initGraph();
  if (typeof initPresentCharts === 'function') initPresentCharts();
});
if (typeof initGraph === 'function') initGraph();
if (typeof initPresentCharts === 'function') initPresentCharts();
document.querySelectorAll('.brief a[href]:not([href^="#"])').forEach(function(a) { a.target = '_blank'; a.rel = 'noopener'; });
</script>

<!-- LIVE RELOAD -->
{{LIVE_RELOAD}}
</body>
</html>
