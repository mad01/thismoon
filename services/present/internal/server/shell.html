<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>present</title>
<script src="/webkit/boot.js"></script>
<link href="/assets/css/fonts.css" rel="stylesheet">
<link href="/webkit/webkit.css" rel="stylesheet">
<script src="/assets/js/cytoscape-3.31.0.min.js"></script>
<script src="/assets/js/dagre-0.8.5.min.js"></script>
<script src="/assets/js/cytoscape-dagre-2.5.0.js"></script>
<script src="/assets/js/elk-0.12.0.bundled.js"></script>
<script src="/assets/js/cytoscape-elk-2.3.0.js"></script>
<script src="/assets/js/chart-4.4.6.umd.min.js"></script>
<script src="/assets/js/chartjs-chart-sankey-0.15.3.min.js"></script>
<style>
/* Palette, header chrome, and the font/fixation/size/theme controls come from
   /webkit/webkit.css. Only present-specific content styles live here. The page
   body is rendered client-side by /app.js into <main id="root">. */
@keyframes briefEnter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.brief { max-width: var(--page-width, 1080px); margin: 0 auto; padding: 2rem 1.5rem 6rem; animation: briefEnter 0.35s ease-out; }

/* Softer ink for the page body. webkit's primary text is near-black in
   light mode and near-white in dark, which reads harsh in a monospace face,
   more so with fixation's bold halves. The brief's summary and lists already
   sit at the secondary ink; this moves the rest of the content (paragraphs,
   titles, headings, table cells, kv values) to the palette's text-body role,
   a step between the two inks in every family, while the header chrome keeps
   webkit's default. The root re-resolves its own color: elements that only
   inherit (the title, section headings) would otherwise keep the computed
   color body derived from the unchanged variable. */
#root { --text-1: var(--text-body); color: var(--text-1); }

.brief-title {
  font-size: 2.125rem;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.15;
  margin-bottom: 0.625rem;
}
.brief-meta { font-size: 0.8125rem; color: var(--text-3); margin-bottom: 0.5rem; letter-spacing: 0.02em; }
.brief-summary { font-size: 1.0625rem; color: var(--text-2); line-height: 1.75; margin-bottom: 2.5rem; max-width: 640px; }

.chip-row { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.5rem; }

wk-kv-value code, code { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; background: var(--chip-bg); padding: 0.125rem 0.375rem; border-radius: 3px; }

.brief a:not(.topbar-link):not(wk-toc a) { color: var(--primary); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; cursor: pointer; transition: text-decoration-color 0.15s; }
.brief a:not(.topbar-link):not(wk-toc a):hover { text-decoration-color: var(--primary); }

.cy-container { width: 100%; height: 520px; border-radius: 8px; overflow: hidden; }

.cy-wrapper { position: relative; }
.cy-controls {
  position: absolute; top: 0.5rem; right: 0.5rem; z-index: 10;
  display: flex; gap: 0.25rem;
}
.cy-controls .size-btn {
  background: var(--card-bg); opacity: 0.85;
  box-shadow: var(--shadow-sm);
}
.cy-controls .size-btn:hover { opacity: 1; }
.cy-controls .cy-engine { width: auto; padding: 0 0.6rem; font-family: var(--mono, ui-monospace, monospace); font-size: 0.7rem; }
.cy-close-btn { display: none !important; }
.cy-backdrop {
  display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.5); z-index: 9998;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.cy-backdrop.active { display: block; animation: backdropIn 0.2s ease-out; }
@keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
.cy-wrapper.cy-fullscreen {
  position: fixed; top: 1.5rem; left: 1.5rem; right: 1.5rem; bottom: 1.5rem;
  z-index: 9999; background: var(--card-bg);
  border-radius: 14px; border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  animation: graphExpand 0.25s ease-out;
}
@keyframes graphExpand {
  from { opacity: 0.9; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}
.cy-wrapper.cy-fullscreen .cy-container { height: 100% !important; border-radius: 14px; }
.cy-wrapper.cy-fullscreen .cy-controls { top: 0.75rem; right: 0.75rem; }
.cy-wrapper.cy-fullscreen .cy-close-btn { display: flex !important; }

.brief-list { padding-left: 1.5rem; margin: 0.75rem 0; font-size: 0.875rem; color: var(--text-2); line-height: 1.7; }
.brief-list li { margin-bottom: 0.375rem; }

/* Metric charts (Chart.js). Container holds a relative canvas wrapper so
   Chart.js can size responsively; title comes from the data-chart-title attr. */
.present-chart {
  margin: 1rem 0 1.5rem;
  padding: 1rem 1.25rem 1.25rem;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.present-chart[data-chart-title]::before {
  content: attr(data-chart-title);
  display: block;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-2);
  letter-spacing: 0.01em;
  margin-bottom: 0.75rem;
}
.present-chart-canvas { position: relative; width: 100%; height: 300px; }
/* Sparkline: compact, chromeless. */
.present-chart.is-sparkline { padding: 0.5rem 0.75rem; }
.present-chart.is-sparkline .present-chart-canvas { height: 56px; }
.present-chart .chart-spec { display: none; }
.present-chart-note { font-size: 0.8125rem; color: var(--text-3); margin: 0.5rem 0 0; }

.refs-section { margin-top: 3.5rem; padding-top: 2rem; border-top: 1px solid var(--border); }
.refs-list { list-style: none; display: flex; flex-direction: column; gap: 0.625rem; }
.refs-item { display: flex; flex-direction: column; gap: 0.125rem; }
.refs-item a { font-size: 0.875rem; font-weight: 500; color: var(--primary); text-decoration: none; transition: color 0.15s; }
.refs-item a:hover { text-decoration: underline; }
.refs-url { font-size: 0.75rem; color: var(--text-3); }

@media (max-width: 600px) {
  .brief { padding: 1rem 1rem 4rem; }
  .brief-title { font-size: 1.625rem; }
  .cy-container { height: 380px; }
  .cy-controls .size-btn { width: 2rem; height: 2rem; }
  .cy-wrapper.cy-fullscreen { top: 0; left: 0; right: 0; bottom: 0; border-radius: 0; }
  .cy-wrapper.cy-fullscreen .cy-container { border-radius: 0; }
}
/* Deck view (/p/{id}/deck). The deck's compiled fragment is split into
   .slide sections client-side; only the active one is displayed. The bar
   is present-specific chrome, so it lives here rather than in webkit. */
.deck { padding-bottom: 5.5rem; }
.slide { display: none; }
.slide.active {
  display: flex; flex-direction: column;
  min-height: calc(100vh - 12rem); max-height: calc(100vh - 9rem);
  overflow: auto; animation: briefEnter 0.25s ease-out;
}
/* Auto margins centre the body without clipping its top when it overflows,
   which justify-content: center would do. */
.slide-body { margin: auto 0; width: 100%; }
.slide .brief-summary { margin-bottom: 1.25rem; }
.slide wk-section { margin-bottom: 0; }
.slide-title .brief-title { font-size: 2.75rem; }
.slide-title .brief-summary { font-size: 1.25rem; max-width: 760px; }
.slide .refs-section { margin-top: 0; padding-top: 0; border-top: 0; }
.deck-bar {
  position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%); z-index: 30;
  display: flex; align-items: center; gap: 0.375rem;
  padding: 0.375rem 0.5rem; border-radius: 999px;
  background: var(--card-bg); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  transition: opacity 0.2s ease;
}
.deck-bar .btn { border-radius: 999px; }
.deck-bar .deck-arrow { width: 2rem; padding: 0.375rem 0; justify-content: center; font-size: 1rem; }
.deck-counter { font-size: 0.75rem; color: var(--text-2); font-variant-numeric: tabular-nums; padding: 0 0.375rem; min-width: 3.5rem; text-align: center; }
.deck-hint { font-size: 0.75rem; color: var(--text-3); text-align: center; margin: 0.75rem 0 0; }
.deck-hint kbd { font-family: var(--mono, ui-monospace, monospace); font-size: 0.6875rem; background: var(--chip-bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.0625rem 0.3125rem; }
/* Presenting: the chrome goes, one slide fills the window at a larger size.
   The bar stays reachable under the pointer at the bottom edge. */
html.presenting wk-header { display: none; }
html.presenting body { overflow: hidden; }
html.presenting .deck { max-width: none; padding: 0; animation: none; }
html.presenting .slide.active {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 40;
  min-height: 0; max-height: none; padding: 5vh 7vw; background: var(--bg);
}
html.presenting .slide.active:not(.has-viz) .slide-body { zoom: var(--deck-zoom, 1.3); }
html.presenting .slide.has-viz .cy-container { height: 62vh; }
html.presenting .slide.has-viz .present-chart-canvas { height: 52vh; }
html.presenting .slide.has-viz wk-section-heading { font-size: 1.75rem; }
html.presenting .deck-bar { opacity: 0; z-index: 41; }
html.presenting .deck-bar:hover, html.presenting .deck-bar:focus-within { opacity: 1; }
@media (max-width: 600px) {
  .slide-title .brief-title { font-size: 1.875rem; }
  .slide.active { min-height: calc(100vh - 10rem); }
  html.presenting .slide.active { padding: 1.5rem 1rem; }
}
#share-result code { word-break: break-all; }
#share-status { color: var(--text-3); }
</style>
</head>
<body>
<wk-header back-href="/" back-label="← All" title="Brief" controls="cmdk,font,fixation,size,speed,reload,theme,help" fixation-targets="[data-fixation], wk-panel-title, wk-panel-subtitle, wk-kv-value, wk-callout, wk-section p, wk-section li"><a data-nav href="/webkit/themes">Themes</a><a data-extra class="btn btn-ghost" id="deckLink" hidden title="Open this page as a slide deck">Slides</a><a data-extra class="btn btn-ghost" id="briefLink" hidden title="Read this page as a brief">Brief</a><button data-extra class="btn btn-ghost" id="shareBtn" hidden>Share</button></wk-header>
<main id="root"></main>
<wk-modal hidden id="share-modal">
  <wk-modal-panel role="dialog" aria-modal="true" aria-labelledby="share-heading">
    <wk-modal-head>
      <h2 id="share-heading">Share this page</h2>
      <button class="btn btn-ghost" id="share-x" aria-label="Close">✕</button>
    </wk-modal-head>
    <wk-modal-body>
      <p>Push a copy to the shared instance. Anyone with the link can read it; only this machine's author key can change it.</p>
      <label><input type="checkbox" id="share-ephemeral"> Expires 30 days after the last share</label>
      <p id="share-result" hidden><code id="share-url"></code> <wk-button variant="ghost" id="share-copy">Copy</wk-button><br><small id="share-status"></small></p>
    </wk-modal-body>
    <wk-modal-actions>
      <wk-button variant="ghost" id="share-cancel">Cancel</wk-button>
      <wk-button variant="primary" id="share-confirm">Share</wk-button>
    </wk-modal-actions>
  </wk-modal-panel>
</wk-modal>
<script src="/webkit/webkit.js"></script>
<script src="/app.js"></script>
</body>
</html>
