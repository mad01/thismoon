<style>
/* Palette, header chrome, and the font/fixation/size/theme controls come from
   /webkit/webkit.css. Only present-specific content styles live here. The page
   body is rendered client-side by /app.js into <main id="root">. */
@keyframes briefEnter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* No top padding: webkit's header margin is the one space above the title,
   as on every other page. */
.brief { max-width: var(--page-width, 1080px); margin: 0 auto; padding: 0 1.5rem 6rem; animation: briefEnter 0.35s ease-out; }

/* Softer ink for the page body. webkit's primary text is near-black in
   light mode and near-white in dark, which reads harsh in a monospace face,
   more so with fixation's bold halves. The brief's summary and lists already
   sit at the secondary ink; this moves the rest of the content (paragraphs,
   titles, headings, table cells, kv values) to the palette's text-body role,
   a step between the two inks in every family, while the header chrome keeps
   webkit's default. The root re-resolves its own color: elements that only
   inherit (the title, section headings) would otherwise keep the computed
   color body derived from the unchanged variable. */
#root { --text-1: var(--text-body); color: var(--text-1); }

/* Compatibility for stored pages (MAD-371). A panel accent named terracotta
   now renders as var(--primary), the role it always stood for, and webkit no
   longer declares --terracotta. Pages rendered before that change still
   carry var(--terracotta) in their stored HTML. A local serve rewrites them
   in its startup sweep. A shared instance never rerenders, so this rule
   keeps the accent bar resolving there until an update rewrites the page. */
:root { --terracotta: var(--primary); }

.brief-title {
  font-size: 2.125rem;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.15;
  margin-bottom: 0.625rem;
}
.brief-meta { font-size: 0.8125rem; color: var(--text-3); margin-bottom: 0.5rem; letter-spacing: 0.02em; }
/* The deck's presenter byline, a sibling of the meta line: outside the
   summary's read-aloud target and without data-fixation, so neither walk
   enters it. */
.brief-presenter { font-size: 0.8125rem; color: var(--text-3); margin: -0.125rem 0 0.5rem; letter-spacing: 0.02em; }
.brief-summary { font-size: 1.0625rem; color: var(--text-2); line-height: 1.75; margin-bottom: 2.5rem; max-width: 640px; }
/* Read-aloud puts its play button and status badge inside the summary as
   right floats, which cut into its first lines wherever the text reaches
   them: in any column the summary fills, from a phone up. So they leave the
   text's flow (an empty shape-outside) and rise into a band the summary
   keeps above its text while they show, at any width. A summary narrower
   than the column moves them on to the column's edge, where the section
   headings carry theirs: 100cqw is the brief's content width, 100% (for
   left) is the summary's, and the two are equal in a column the summary
   fills. The band takes half the dateline's gap. The badge leaves room in
   the band for the play and Retry buttons, so the row stays one row. */
.brief:not(.deck) { container: brief / inline-size; }
.brief:not(.deck) > .brief-summary:has(> .wk-ra-btn):not(html[data-audio="off"] *) {
  margin-top: -0.75rem; padding-top: calc(var(--wk-control-h) + 0.5rem);
}
.brief:not(.deck) > .brief-summary > :is(.wk-ra-btn, wk-badge.wk-ra-state) {
  position: relative; top: calc(-1 * (var(--wk-control-h) + 0.5rem));
  left: calc(100cqw - 100%); shape-outside: inset(50%);
}
.brief:not(.deck) > .brief-summary > wk-badge.wk-ra-state { max-width: min(16rem, 100% - 8rem); }

.chip-row { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.5rem; }

wk-kv-value code, code { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 0.75rem; background: var(--chip-bg); padding: 0.125rem 0.375rem; border-radius: 3px; }

.brief a:not(.topbar-link):not(wk-toc a) { color: var(--primary); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; cursor: pointer; transition: text-decoration-color 0.15s; }
.brief a:not(.topbar-link):not(wk-toc a):hover { text-decoration-color: var(--primary); }

.cy-container { width: 100%; height: 520px; border-radius: 8px; overflow: hidden; }
/* The graph in a column (MAD-374): shorter than the full-width one, so the
   paragraph beside it sits level with the drawing; the presenting rule
   below still wins on a slide. */
wk-col .cy-container { height: 400px; }

.cy-wrapper { position: relative; }
.cy-controls {
  position: absolute; top: 0.5rem; right: 0.5rem; z-index: 10;
  display: flex; gap: 0.25rem;
}
.cy-controls .size-btn {
  background: var(--card-bg); opacity: 0.85;
  box-shadow: var(--shadow-sm);
}
.cy-controls .size-btn:hover { opacity: 1; }
.cy-controls .cy-engine { width: auto; padding: 0 0.6rem; font-family: var(--mono, ui-monospace, monospace); font-size: 0.7rem; }
.cy-close-btn { display: none !important; }
.cy-backdrop {
  display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.5); z-index: 9998;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.cy-backdrop.active { display: block; animation: backdropIn 0.2s ease-out; }
@keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
.cy-wrapper.cy-fullscreen {
  position: fixed; top: 1.5rem; left: 1.5rem; right: 1.5rem; bottom: 1.5rem;
  z-index: 9999; background: var(--card-bg);
  border-radius: 14px; border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  animation: graphExpand 0.25s ease-out;
}
@keyframes graphExpand {
  from { opacity: 0.9; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}
.cy-wrapper.cy-fullscreen .cy-container { height: 100% !important; border-radius: 14px; }
.cy-wrapper.cy-fullscreen .cy-controls { top: 0.75rem; right: 0.75rem; }
.cy-wrapper.cy-fullscreen .cy-close-btn { display: flex !important; }

.brief-list { padding-left: 1.5rem; margin: 0.75rem 0; font-size: 0.875rem; color: var(--text-2); line-height: 1.7; }
.brief-list li { margin-bottom: 0.375rem; }

/* --surface is the colour content sits on: the page (a slide paints no
   box of its own, toned or not), and a card resets it to the card. SVG uses it
   through var(); app.js reads the painted colour behind an element
   (surfaceColor) for Cytoscape and Chart.js, which need a literal. */
:root { --surface: var(--bg); }
wk-panel, wk-section details, .present-chart[data-frame="true"], .cy-wrapper.cy-fullscreen { --surface: var(--card-bg); }

/* Metric charts (Chart.js). Container holds a relative canvas wrapper so
   Chart.js can size responsively; title comes from the data-chart-title attr.
   A chart sits straight on the page; frame: true keeps the card. */
.present-chart { margin: 1rem 0 1.5rem; }
.present-chart[data-frame="true"] {
  padding: 1rem 1.25rem 1.25rem;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.present-chart[data-chart-title]::before {
  content: attr(data-chart-title);
  display: block;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-2);
  letter-spacing: 0.01em;
  margin-bottom: 0.75rem;
}
.present-chart-canvas { position: relative; width: 100%; height: 300px; }
/* Sparkline: compact, chromeless. */
.present-chart[data-frame="true"].is-sparkline { padding: 0.5rem 0.75rem; }
.present-chart.is-sparkline .present-chart-canvas { height: 56px; }
.present-chart .chart-spec { display: none; }
.present-chart-note { font-size: 0.8125rem; color: var(--text-3); margin: 0.5rem 0 0; }
/* Ribbon chart (d3, MAD-386): an svg straight on the page like every chart
   now. Fills are palette variables set inline
   by app.js; stepping, the entry, and hover only toggle classes, and the
   opacity transition here does the motion (app.js reads --ribbon-fade for
   its timers; a cutting deck gets .cut from the step hook). .off follows
   .dim so a hidden column stays hidden under the pointer. A segment's name is knocked out in
   the surface colour: chart-label is ink for the page, and on the series
   fills it reads under 3:1 in most families, dark mode above all. The
   11px sizes are the brief's; app.js sets the svg's and the legend's size
   on every draw, which on a slide follows the slide's unit, and the
   swatch keeps to its legend's size. */
.present-ribbon { --ribbon-fade: 350ms; display: block; width: 100%; height: 100%; overflow: visible; font-size: 11px; }
.present-ribbon text { fill: var(--chart-text); font-family: inherit; }
.present-ribbon .seg-label { fill: var(--surface); pointer-events: none; }
.present-ribbon .grid line { stroke: var(--chart-grid); }
.present-ribbon .seg, .present-ribbon .rib, .present-ribbon .seg-label { transition: opacity var(--ribbon-fade) ease; }
.present-ribbon .rib { fill-opacity: 0.45; }
.present-ribbon .rib.hover { fill-opacity: 0.65; }
.present-ribbon .dim { opacity: 0.2; }
.present-ribbon .off { opacity: 0; pointer-events: none; }
.present-ribbon.cut .seg, .present-ribbon.cut .rib, .present-ribbon.cut .seg-label { transition: none; }
@media (prefers-reduced-motion: reduce) {
  .present-ribbon .seg, .present-ribbon .rib, .present-ribbon .seg-label { transition: none; }
}
.present-ribbon-legend {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0.25rem 1rem;
  font-size: 11px; color: var(--chart-text); margin-bottom: 0.5rem;
}
.present-ribbon-key { cursor: default; }
.present-ribbon-key::after { content: attr(data-name); }
.present-ribbon-swatch {
  display: inline-block; width: calc(12em / 11); height: calc(12em / 11); border-radius: 2px;
  margin-right: 0.375rem; vertical-align: -1px;
}
/* Diagrams (elk + d3, MAD-382): an svg straight on the page or slide, no
   card ever, laid out once in the browser. Every colour is a role through
   a variable, so a theme change redraws nothing: a toned group or node
   sets the --dtone-* trio its parts read, an untoned one falls back to the
   card, chip, and border roles, and an edge label's halo is the surface
   behind the diagram. Steps, focus, and the entry only toggle off, dim,
   and focus on the groups, nodes, and edges; the opacity transition here
   is the motion, and a cutting deck (.cut) or Reduce Motion drops it. .off
   follows .dim so an element a step has not reached stays hidden. */
.present-diagram { margin: 1rem 0 1.5rem; }
.present-diagram-canvas { display: flex; justify-content: center; max-height: 420px; }
/* In the brief a diagram has the page width and no height cap, and one
   drawn narrower than the page sits in its middle; safe keeps the start of
   a drawing wider than the page in reach of the sideways scroll. The
   wrapper's font is the body size, which caps a box name's scale. */
.brief:not(.deck) .present-diagram-canvas { max-height: none; justify-content: safe center; font-size: var(--fs-body); }
.present-diagram-svg { --diagram-fade: 350ms; display: block; overflow: visible; font-family: inherit; }
.present-diagram-caption { font-size: 0.875rem; color: var(--text-2); margin: 0.5rem 0 0; }
/* A caption and a step list are prose: they end where the section's
   paragraphs do. Their 0.875rem font reads the ch-based measure smaller, so
   the cap scales by the paragraph's 0.9375rem, as the kit's callout does;
   the deck's --wk-measure: none lifts it. */
.present-diagram-caption, .present-steps { max-width: calc(var(--wk-measure) * 0.9375 / 0.875); }
.deck .present-diagram-caption, .deck .present-diagram .present-steps { text-align: center; }
/* A diagram's key (MAD-580): a centred row under the canvas, one swatch
   and label per tone, wrapping on a narrow screen. A swatch is a box of
   its tone in small, its fill and border the same --dtone-* pair a box
   reads, so the key follows every theme the boxes do. The text is the
   caption's size; the "Key" heading and each tone's name are for
   read-aloud and screen readers only, and the swatch is decorative. */
.present-diagram-key { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.4; color: var(--text-2); }
.present-diagram-key ul { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.25em 1.25em; list-style: none; margin: 0; padding: 0; }
.present-diagram-key li { margin: 0; padding: 0; }
.present-diagram-swatch {
  display: inline-block; box-sizing: border-box; width: 0.9em; height: 0.9em; border-radius: 0.2em;
  margin-right: 0.4em; vertical-align: -0.08em;
  background: var(--dtone-bg, var(--card-bg)); border: 1.5px solid var(--dtone-border, var(--border));
}
.present-sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}
:is(.present-diagram-svg, .present-diagram-key) .tone-neutral { --dtone-bg: var(--tone-neutral-bg); --dtone-border: var(--tone-neutral-border); --dtone-text: var(--tone-neutral-text); }
:is(.present-diagram-svg, .present-diagram-key) .tone-green { --dtone-bg: var(--tone-green-bg); --dtone-border: var(--tone-green-border); --dtone-text: var(--tone-green-text); }
:is(.present-diagram-svg, .present-diagram-key) .tone-red { --dtone-bg: var(--tone-red-bg); --dtone-border: var(--tone-red-border); --dtone-text: var(--tone-red-text); }
:is(.present-diagram-svg, .present-diagram-key) .tone-blue { --dtone-bg: var(--tone-blue-bg); --dtone-border: var(--tone-blue-border); --dtone-text: var(--tone-blue-text); }
:is(.present-diagram-svg, .present-diagram-key) .tone-amber { --dtone-bg: var(--tone-amber-bg); --dtone-border: var(--tone-amber-border); --dtone-text: var(--tone-amber-text); }
:is(.present-diagram-svg, .present-diagram-key) .tone-purple { --dtone-bg: var(--tone-purple-bg); --dtone-border: var(--tone-purple-border); --dtone-text: var(--tone-purple-text); }
.present-diagram-svg .dgroup-box {
  fill: var(--dtone-bg, var(--chip-bg)); fill-opacity: 0.5;
  stroke: var(--dtone-border, var(--border)); stroke-width: 1px; stroke-dasharray: 4 3;
}
.present-diagram-svg .dgroup-label { fill: var(--dtone-text, var(--text-3)); font-size: 11.5px; font-weight: 600; }
.present-diagram-svg .dnode-shape { fill: var(--dtone-bg, var(--card-bg)); stroke: var(--dtone-border, var(--border)); stroke-width: 1.5px; }
.present-diagram-svg .kind-external .dnode-shape { stroke-dasharray: 5 4; }
.present-diagram-svg .dnode-detail { fill: none; stroke: var(--dtone-border, var(--border)); stroke-width: 1px; }
.present-diagram-svg .dnode-figure { fill: var(--text-3); }
.present-diagram-svg .dnode-label, .present-diagram-svg .dnode-text, .present-diagram-svg .dedge-label text { text-anchor: middle; dominant-baseline: central; }
.present-diagram-svg .dnode-label { fill: var(--dtone-text, var(--text-1)); font-size: 13px; font-weight: 600; }
.present-diagram-svg .dnode-text { fill: var(--text-2); font-size: 11.5px; }
.present-diagram-svg .dedge-line { fill: none; stroke: var(--graph-edge); stroke-width: 1.5px; }
.present-diagram-svg .dedge.flow .dedge-line { stroke-dasharray: 6 5; }
.present-diagram-svg .dedge-arrow { fill: var(--graph-edge-arrow); }
.present-diagram-svg .dedge-label rect { fill: var(--surface); }
.present-diagram-svg .dedge-label text { fill: var(--text-2); font-size: 11.5px; }
.present-diagram-svg .dflow { fill: var(--graph-hot); pointer-events: none; }
.present-diagram-svg .dgroup, .present-diagram-svg .dnode, .present-diagram-svg .dedge, .present-diagram-svg .dflow { transition: opacity var(--diagram-fade) ease; }
.present-diagram-svg .dnode.focus { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--primary) 55%, transparent)); }
.present-diagram-svg .dnode.focus .dnode-shape { stroke-width: 2.5px; }
.present-diagram-svg .dim { opacity: 0.35; }
.present-diagram-svg .off { opacity: 0; pointer-events: none; }
.present-diagram-svg.entering .dflow, .present-diagram-svg .dedge.off .dflow, .present-diagram-svg .dedge.dim .dflow { opacity: 0; }
.present-diagram-svg.cut .dgroup, .present-diagram-svg.cut .dnode, .present-diagram-svg.cut .dedge, .present-diagram-svg.cut .dflow { transition: none; }
@media (prefers-reduced-motion: reduce) {
  .present-diagram-svg .dgroup, .present-diagram-svg .dnode, .present-diagram-svg .dedge { transition: none; }
}
/* Live terminals (xterm.js, MAD-414): the code block's frame, which
   wk-code-block gives (border, radius, the header bar with its dots and
   badge), with the terminal under the bar. app.js sets the canvas height
   from the block's rows; a slide whose only block is the terminal sets
   --terminal-fill and a height in the slide unit instead, which a block
   naming no rows fills. The block, its header bar (2.125rem) and border
   (2px) included, is 33u, a diagram's cap, so a two-line claim and the
   block fit the 46.75u the body leaves at fit 1, and the fit shrinks the
   canvas with the rest of the slide. The unit grows while presenting, so
   no rule sets another height there.
   --terminal-font-size is the px size xterm draws at, larger while
   presenting. The padding sits on xterm's element, in whole pixels,
   because the fit addon subtracts it as integers. It comes from
   --terminal-pad-y, which app.js adds to the canvas height, so the
   placeholder set before xterm opens holds the same height. webkit's header bar
   ignores the pointer, so the buttons take it back. The terminal frame is
   allowed on a slide, unlike any other box: it is what the slide shows. */
.present-terminal { --terminal-font-size: 13; margin: 1rem 0 1.5rem; padding-top: 2.125rem; }
.present-terminal-canvas { position: relative; --terminal-pad-y: 8px; }
.present-terminal-canvas .xterm { padding: var(--terminal-pad-y) 10px; }
/* xterm 6 paints the theme background on its scrollable element and leaves
   its own stylesheet's black on the viewport, which spans the padding; the
   block's --code-bg is the theme background, so the viewport shows it. */
.present-terminal-canvas .xterm .xterm-viewport { background-color: transparent; }
.present-terminal-status { font-family: var(--mono); font-size: 0.68rem; color: var(--code-muted); }
.present-terminal[data-state="live"] .present-terminal-status { color: var(--code-string); }
.present-terminal[data-state="disconnected"] .present-terminal-status { color: var(--red); }
.present-terminal-run, .present-terminal-kill {
  pointer-events: auto; appearance: none; cursor: pointer;
  font-family: inherit; font-size: 0.68rem; font-weight: 500; color: var(--text-2);
  background: var(--code-bg); border: 1px solid var(--border-hover); border-radius: 5px;
  padding: 0.15rem 0.5rem; transition: border-color 0.15s, color 0.15s;
}
.present-terminal-run { margin-left: auto; }
/* A shared instance hides Run and Kill: it has no sessions. A block showing
   the off note has nothing to kill either. */
.present-terminal-run[hidden], .present-terminal-kill[hidden],
.present-terminal[data-state="off"] .present-terminal-kill { display: none; }
.present-terminal-run:hover, .present-terminal-kill:hover { border-color: var(--text-3); color: var(--text-1); }
.present-terminal-run:focus-visible, .present-terminal-kill:focus-visible { outline: 2px solid var(--code-keyword); outline-offset: 1px; }
.present-terminal-note {
  position: absolute; inset: 0; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  padding: 1rem; text-align: center; background: var(--code-bg);
  font-size: 0.8125rem; color: var(--text-2);
}
.slide.solo-terminal .present-terminal-canvas { --terminal-fill: 1; height: calc(33 * var(--u) - 2.125rem - 2px); }
html.presenting .slide .present-terminal { --terminal-font-size: 16; }

.refs-section { margin-top: 3.5rem; padding-top: 2rem; border-top: 1px solid var(--border); }
.refs-list { list-style: none; display: flex; flex-direction: column; gap: 0.625rem; }
.refs-item { display: flex; flex-direction: column; gap: 0.125rem; }
.refs-item a { font-size: 0.875rem; font-weight: 500; color: var(--primary); text-decoration: none; transition: color 0.15s; }
.refs-item a:hover { text-decoration: underline; }
.refs-url { font-size: 0.75rem; color: var(--text-3); }
/* The reading probe (app.js watchReading): one hidden line in the page's
   face at the root size, whose box moves with the reader's face and size.
   Fixed, so it takes no room in the page and adds no scroll. */
.present-reading-probe {
  position: fixed; top: 0; left: 0; visibility: hidden; pointer-events: none;
  white-space: pre; font-size: 1rem; font-weight: 400; font-style: normal;
  line-height: normal; letter-spacing: normal;
}

@media (max-width: 600px) {
  .brief { padding: 0 1rem 4rem; }
  .brief-title { font-size: 1.625rem; }
  .cy-container, wk-col .cy-container { height: 380px; }
  .cy-controls .size-btn { width: 2rem; height: 2rem; }
  .cy-wrapper.cy-fullscreen { top: 0; left: 0; right: 0; bottom: 0; border-radius: 0; }
  .cy-wrapper.cy-fullscreen .cy-container { border-radius: 0; }
}
/* The brief's reading styles. Two token rules open the block, :root and
   #root (the type scale), and set only custom properties; every other
   selector in it carries .brief:not(.deck), so the deck keeps its own
   sizes. TestBriefStylesStayInTheBrief pins both. Colours are palette roles.
   --ink-strong is the palette's text-1 resolved on :root, before #root
   softens it to the body ink: headings keep the true ink. */
:root { --ink-strong: var(--text-1); }
#root {
  --fs-micro: 0.8125rem;
  --fs-small: 0.9375rem;
  --fs-body: 1.125rem;
  --fs-h3: 1.25rem;
  --fs-lede: 1.375rem;
  --fs-h2: 1.75rem;
  --fs-title: 2.75rem;
}
/* The measure is the kit's --wk-measure, in ch of each block's own font.
   A block set at another size than the paragraph's --fs-body scales it by
   the paragraph's size over its own (1.125 / 0.9375 for a 15px caption,
   1.125 for a block that keeps the 1rem root size), so every block on the
   measure ends where the paragraphs do, as the kit's callout rule does. */

/* Opening: title, dateline, summary, read-aloud bar, chips, contents. The
   title runs the page width: a 44px monospace line holds about 39
   characters, and a cap would wrap most titles to three lines. */
.brief:not(.deck) .brief-title {
  font-size: var(--fs-title); font-weight: 700; line-height: 1.1; letter-spacing: 0;
  text-wrap: balance; color: var(--ink-strong); margin: 0 0 0.875rem;
}
.brief:not(.deck) .brief-meta {
  font-family: var(--mono); font-size: var(--fs-micro); font-weight: 500; line-height: 1.4;
  letter-spacing: 0; color: var(--text-2); margin: 0 0 1.5rem;
}
.brief:not(.deck) .brief-summary {
  font-size: var(--fs-lede); line-height: 1.45; color: var(--text-1); text-wrap: pretty;
  max-width: calc(var(--wk-measure) * 1.125 / 1.375); margin: 0 0 1.5rem;
}
.brief:not(.deck) .chip-row { gap: 0.5rem; margin: 0 0 1.5rem; }
.brief:not(.deck) .chip-row wk-badge { padding: 0.3125rem 0.625rem; }
.brief:not(.deck) :is(.chip-row, wk-section) wk-badge:not(.wk-ra-state) { font-family: var(--mono); font-size: var(--fs-micro); }
/* The contents list: no card, no numbers, no capitals, and none under four
   sections. Stacked, it sits under the chips in two columns on the measure. */
.brief:not(.deck) wk-toc {
  font-size: var(--fs-small); background: none; border: 0; border-radius: 0; box-shadow: none;
  padding: 0; margin: 0 0 2.5rem; max-width: calc(var(--wk-measure) * 1.125 / 0.9375);
}
.brief:not(.deck) wk-toc:not(:has(li:nth-child(4))) { display: none; }
.brief:not(.deck) wk-toc-title {
  font-size: var(--fs-small); font-weight: 600; text-transform: none; letter-spacing: 0;
  color: var(--text-1); margin-bottom: 0.5rem;
}
.brief:not(.deck) wk-toc ul { display: block; columns: 2 16rem; column-gap: 2.5rem; }
.brief:not(.deck) wk-toc li { break-inside: avoid; padding: 0.25rem 0; line-height: 1.4; }
.brief:not(.deck) wk-toc a { font-size: inherit; font-weight: 400; color: var(--text-2); }
.brief:not(.deck) wk-toc a:hover { color: var(--primary); text-decoration: none; }
/* On a wide window the contents list stands beside the opening, under the
   title, with a rule on its left. Monospace entries wrap more than
   proportional ones, so the opening column leaves the list about 25rem of a
   1080px page; the summary still holds about 43 characters a line. The last
   opening row is the flexible one, so a list taller than the opening adds
   its height under the chips, not between the dateline and the summary.
   Grid items keep their margins, so the first section's is the rest of the
   2.5rem the opening ends with. The read-aloud controls stay at the
   summary's edge, in its band: the shift to the page edge would land them
   on the list. */

  .brief:not(.deck):has(> wk-toc li:nth-child(4)) {
    display: grid; grid-template-columns: minmax(0, 36rem) minmax(0, 1fr);
    grid-template-rows: repeat(4, auto) 1fr; column-gap: 3rem; align-items: start;
  }
  .brief:not(.deck):has(> wk-toc li:nth-child(4)) > * { grid-column: 1 / -1; min-width: 0; }
  .brief:not(.deck):has(> wk-toc li:nth-child(4)) > :is(.brief-meta, .brief-summary, wk-read-aloud, .chip-row) { grid-column: 1; }
  .brief:not(.deck):has(> wk-toc li:nth-child(4)) > wk-toc {
    grid-column: 2; grid-row: 2 / span 4; max-width: none;
    margin: 0 0 1.5rem; padding-left: 1.25rem; border-left: 1px solid var(--border);
  }
  .brief:not(.deck):has(> wk-toc li:nth-child(4)) > wk-toc ul { columns: auto; }
  .brief:not(.deck):has(> wk-toc li:nth-child(4)) > wk-section:first-of-type { margin-top: 1rem; }
  .brief:not(.deck):has(> wk-toc li:nth-child(4)) > .brief-summary > :is(.wk-ra-btn, wk-badge.wk-ra-state) { left: auto; }
}

/* Sections: a rule across the page, the accent moved onto it, no rule under
   the heading. A toned section keeps its band, and the accent starts at the
   band's outer edge. */
.brief:not(.deck) > wk-section:first-of-type { margin-top: 2.5rem; }
.brief:not(.deck) wk-section { position: relative; margin-bottom: 4.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
.brief:not(.deck) wk-section-heading {
  position: static; font-size: var(--fs-h2); font-weight: 650; line-height: 1.2; letter-spacing: 0;
  color: var(--ink-strong); text-wrap: balance;
  border-bottom: 0; padding-bottom: 0; margin-bottom: 1.25rem;
}
.brief:not(.deck) wk-section-heading::after { top: -2px; bottom: auto; left: 0; width: 2.5rem; height: 3px; border-radius: 0; }
.brief:not(.deck) wk-section[data-tone] wk-section-heading::after { left: -3px; }
.brief:not(.deck) wk-section.section-changed > wk-section-heading::before { font-size: var(--fs-micro); }
.brief:not(.deck) wk-section-subheading {
  font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; color: var(--ink-strong);
  max-width: calc(var(--wk-measure) * 1.125 / 1.25); margin: 2rem 0 0.625rem;
}

/* Prose */
.brief:not(.deck) wk-section p { font-size: var(--fs-body); line-height: 1.6; margin-bottom: 1rem; }
.brief:not(.deck) wk-section p + p { margin-top: 0; }
/* The indent holds a monospace "1. " inside the page edge. */
.brief:not(.deck) .brief-list {
  font-size: var(--fs-body); line-height: 1.55; color: var(--text-1);
  padding-left: 1.75rem; margin: 0.25rem 0 1.25rem;
}
.brief:not(.deck) ol.brief-list { padding-left: 2rem; }
.brief:not(.deck) ol.brief-list:has(> li:nth-child(10)) { padding-left: 2.75rem; }
.brief:not(.deck) .brief-list li { margin-bottom: 0.5rem; padding-left: 0.25rem; }
.brief:not(.deck) .brief-list li::marker { color: var(--text-3); }
.brief:not(.deck) wk-section > blockquote { font-size: var(--fs-body); }
.brief:not(.deck) wk-section blockquote cite { font-size: var(--fs-small); color: var(--text-2); }
.brief:not(.deck) wk-columns { gap: 2rem; margin: 1.75rem 0 2rem; }
.brief:not(.deck) wk-columns[cols="3"] wk-col p { font-size: var(--fs-small); }

/* Blocks */
.brief:not(.deck) wk-callout {
  font-size: var(--fs-body); line-height: 1.6; color: var(--text-1); box-shadow: none;
  padding: 1rem 1.25rem; margin: 1.75rem 0 2rem; max-width: var(--wk-measure);
}
.brief:not(.deck) wk-panel { box-shadow: none; }
/* A panel is a measure block; the one that frames the graph is a figure. */
.brief:not(.deck) wk-section > wk-panel:not(:has(.cy-container)) { max-width: calc(var(--wk-measure) * 1.125); }
.brief:not(.deck) wk-panel-title { font-size: var(--fs-body); letter-spacing: 0; }
.brief:not(.deck) wk-panel-subtitle { font-size: var(--fs-small); }
.brief:not(.deck) wk-stat { box-shadow: none; }
.brief:not(.deck) wk-section > wk-stat { max-width: calc(var(--wk-measure) * 1.125); }
.brief:not(.deck) wk-stat-value { font-size: var(--fs-title); font-weight: 650; letter-spacing: 0; color: var(--ink-strong); }
.brief:not(.deck) wk-stat-label, .brief:not(.deck) wk-stat-sub { font-size: var(--fs-small); }
.brief:not(.deck) wk-stat-label { margin-top: 0.5rem; color: var(--text-1); }
/* Key-value rows: the key column holds about 20 characters and wraps a
   longer key inside it, with a clear gap before the value. */
.brief:not(.deck) wk-kv { margin: 1.25rem 0 1.75rem; }
.brief:not(.deck) wk-section > wk-kv { max-width: calc(var(--wk-measure) * 1.125); }
.brief:not(.deck) wk-kv-row { font-size: var(--fs-body); line-height: 1.5; gap: 1.5rem; padding: 0.5rem 0; }
.brief:not(.deck) wk-kv-label { flex: 0 0 min(14rem, 35%); min-width: 0; overflow-wrap: anywhere; }
/* Progress: the bar takes the whole row and the label wraps under it, so
   bars on one page share a length to compare, and no label widens the page
   (the kit's label does not wrap). */
.brief:not(.deck) wk-section > wk-progress { max-width: calc(var(--wk-measure) * 1.125); margin: 0.75rem 0 1rem; }
.brief:not(.deck) wk-progress { flex-wrap: wrap; row-gap: 0.375rem; }
.brief:not(.deck) wk-progress-bar { flex: 1 0 100%; }
.brief:not(.deck) wk-progress-label { font-size: var(--fs-small); line-height: 1.45; white-space: normal; min-width: 0; overflow-wrap: anywhere; }
.brief:not(.deck) wk-section details { box-shadow: none; }
.brief:not(.deck) wk-section > details { max-width: calc(var(--wk-measure) * 1.125); }
.brief:not(.deck) wk-section details > summary { font-size: var(--fs-body); }
/* Tables: body-size cells in the main ink. Three columns or fewer sit on
   the measure; four or more take the page. */
.brief:not(.deck) wk-table { margin: 1.75rem 0 2rem; }
.brief:not(.deck) wk-table:not(:has(th:nth-child(4))) { max-width: calc(var(--wk-measure) * 1.125); }
.brief:not(.deck) wk-table table { font-size: var(--fs-body); line-height: 1.45; margin: 0; }
.brief:not(.deck) wk-table th {
  font-size: var(--fs-small); font-weight: 600; text-transform: none; letter-spacing: 0;
  color: var(--text-2); background: none; vertical-align: bottom;
  border-bottom: 1.5px solid var(--text-3); padding: 0.5rem 1.25rem 0.5rem 0;
}
.brief:not(.deck) wk-table td { padding: 0.625rem 1.25rem 0.625rem 0; vertical-align: top; font-variant-numeric: tabular-nums; }
.brief:not(.deck) wk-table :is(th, td):last-child { padding-right: 0; }
.brief:not(.deck) wk-table tr:hover td { background: none; }

/* Code: monospace at the small size, and no ligatures, so ==, !=, := and ||
   read as the characters typed. The live terminal draws its own. */
.brief:not(.deck) code, .brief:not(.deck) pre { font-variant-ligatures: none; }
.brief:not(.deck) :not(pre) > code { font-size: 0.85em; }
.brief:not(.deck) pre.wk-code-block > code { font-size: var(--fs-small); }

/* Figures: charts, diagrams and the graph take the page; captions, notes
   and step lists are prose on the measure. */
.brief:not(.deck) .present-chart { margin: 1.75rem 0 2rem; }
.brief:not(.deck) .present-chart[data-chart-title]::before {
  font-size: var(--fs-small); font-weight: 600; color: var(--ink-strong); letter-spacing: 0; margin-bottom: 0.625rem;
}
.brief:not(.deck) .present-chart-canvas { height: 21rem; }
.brief:not(.deck) .present-chart.is-sparkline .present-chart-canvas { height: 3.5rem; }
.brief:not(.deck) .present-chart-note { font-size: var(--fs-small); color: var(--text-2); max-width: calc(var(--wk-measure) * 1.125 / 0.9375); }
.brief:not(.deck) .present-diagram { margin: 1.75rem 0 2rem; }
.brief:not(.deck) .present-diagram-caption, .brief:not(.deck) wk-figcaption {
  font-size: var(--fs-small); line-height: 1.5; color: var(--text-2);
  max-width: calc(var(--wk-measure) * 1.125 / 0.9375);
}
.brief:not(.deck) .present-diagram-caption { margin-top: 0.75rem; }
.brief:not(.deck) .present-diagram-key { font-size: var(--fs-small); line-height: 1.5; margin-top: 0.75rem; }
.brief:not(.deck) .present-steps {
  font-size: var(--fs-body); line-height: 1.55; color: var(--text-1);
  max-width: var(--wk-measure); margin-top: 1rem; padding-left: 2rem;
}
.brief:not(.deck) .present-steps li { margin: 0.25rem 0; padding-left: 0.25rem; }
.brief:not(.deck) .cy-container { height: 32rem; }
.brief:not(.deck) wk-col .cy-container { height: 25rem; }
/* The heading's own margin is the space under it, whatever block comes
   first; the larger space a figure or table keeps above it is for prose. */
.brief:not(.deck) wk-section-heading + * { margin-top: 0; }

/* References */
.brief:not(.deck) .refs-section { margin-top: 0; padding-top: 1.5rem; }
.brief:not(.deck) .refs-item a { font-size: var(--fs-body); }
.brief:not(.deck) .refs-url { font-family: var(--mono); font-size: var(--fs-small); color: var(--text-2); overflow-wrap: anywhere; }

@media (max-width: 600px) {
  .brief:not(.deck) .brief-title { font-size: 2rem; }
  .brief:not(.deck) .brief-summary { font-size: 1.25rem; }
  .brief:not(.deck) wk-section-heading { font-size: 1.5rem; }
  .brief:not(.deck) wk-section { margin-bottom: 3.5rem; }
}
/* End of the brief's reading styles. */
/* Deck view (/p/{id}/deck). The deck's compiled fragment is split into
   .slide sections client-side; only the active one is displayed. The bar
   is present-specific chrome, so it lives here rather than in webkit. A
   slide sets its own text widths, so the reading measure is off in the
   deck. */
.deck { max-width: none; padding-top: 1.25rem; padding-bottom: 5.5rem; --wk-measure: none; }
.slide { display: none; }

/* The slide canvas. The active slide is a size container and its body,
   one level down, declares the unit every size on the slide is written in
   (a container unit on the container itself would resolve against its
   parent). --u0 is 1% of the width of a 16:9 canvas fitted in the slide,
   never fitted; --u is the unit sizes are written in, --u0 times the fit
   app.js sets per slide (--fit, 1 by default); --floor is the smallest
   text after the fit, 1.1% of the canvas width. The three are registered
   lengths, so app.js reads them resolved for charts and diagrams. --bump
   is the reader's size control: large text adds two of it, small text one,
   and every size of 1.8u or less is held at the floor. The canvas is 100u
   by 56.25u; the body's padding leaves 86u by 46.75u for the slide. */
@property --u0 { syntax: '<length>'; inherits: true; initial-value: 0px; }
@property --u { syntax: '<length>'; inherits: true; initial-value: 0px; }
@property --floor { syntax: '<length>'; inherits: true; initial-value: 0px; }
:root { --bump: calc(1rem - 16px); }
.deck .slide.active { container-type: size; display: block; position: relative; overflow: hidden; animation: briefEnter 0.25s ease-out; }
.deck .slide-body {
  --u0: min(1cqw, 1.7778cqh);
  --u: calc(var(--u0) * var(--fit, 1));
  --floor: calc(1.1 * var(--u0));
  box-sizing: border-box; width: 100%; height: 100%; margin: 0;
  display: flex; flex-direction: column; justify-content: safe center;
  padding: calc(4 * var(--u)) calc(7 * var(--u)) calc(5.5 * var(--u));
  font-size: calc(3 * var(--u) + 2 * var(--bump)); line-height: 1.4;
}
/* A slide that still overflows at the smallest fit scrolls (app.js sets
   the class); safe center above keeps its top in reach. */
.deck .slide.active.slide-overflow { overflow: auto; }
/* Not presenting, the active slide is a 16:9 stage in the page: the same
   container as the presenting slide, so the author sees the real slide.
   Its frame is chrome around the slide, not a box on it. */
html:not(.presenting) .deck .slide.active {
  box-sizing: border-box; width: min(100%, calc((100vh - 13.5rem) * 16 / 9)); aspect-ratio: 16 / 9;
  margin: 0 auto; border: 1px solid var(--border); border-radius: 12px; background: var(--bg);
}
.deck-bar {
  position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%); z-index: 30;
  display: flex; align-items: center; gap: 0.375rem;
  padding: 0.375rem 0.5rem; border-radius: 999px;
  background: var(--card-bg); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  transition: opacity 0.2s ease;
}
.deck-bar .btn { border-radius: 999px; }
.deck-bar .deck-arrow { width: 2rem; padding: 0.375rem 0; justify-content: center; font-size: 1rem; }
.deck-counter { font-size: 0.75rem; color: var(--text-2); font-variant-numeric: tabular-nums; padding: 0 0.375rem; min-width: 3.5rem; text-align: center; }
.deck-hint { font-size: 0.75rem; color: var(--text-3); text-align: center; margin: 0.75rem 0 0; }
.deck-hint kbd { font-family: var(--mono, ui-monospace, monospace); font-size: 0.6875rem; background: var(--chip-bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.0625rem 0.3125rem; }
/* Presenting: the chrome goes and the slide fills the window; the unit
   grows with it, so no rule here sets a size. The bar stays reachable
   under the pointer at the bottom edge. */
html.presenting wk-header { display: none; }
html.presenting body { overflow: hidden; }
html.presenting .deck { padding: 0; animation: none; }
html.presenting .deck .slide.active { position: fixed; inset: 0; z-index: 40; background: var(--bg); }
/* An image drops its border with frame: false (a transparent PNG from
   another tool); the radius stays. */
wk-figure[data-frame="false"] img { border: 0; }
html.presenting .deck-bar { opacity: 0; z-index: 41; }
html.presenting .deck-bar:hover, html.presenting .deck-bar:focus-within { opacity: 1; }
/* Deck chrome: a strip along the bottom edge built by app.js from the
   deck's chrome island, with the footer line left, the progress marker
   centre, and the logo right (a bottom-left logo swaps sides with the
   footer; a top corner logo is its own fixed element under the header).
   The deck bar moves up above the strip while browsing and keeps its fade
   while presenting, when the strip stays visible above the fixed slide,
   inside its bottom padding. Every colour is a palette role, so themes
   recolour the dots with no change here. The strip ignores the pointer
   except for the dots, so it never blocks a click on the slide. */
.deck.has-strip { padding-bottom: 7.5rem; }
.deck-bar.raised { bottom: 3.25rem; }
.deck-strip {
  position: fixed; left: 1.25rem; right: 1.25rem; bottom: 0.875rem; z-index: 30;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem;
  min-height: 1.75rem; pointer-events: none;
}
.deck-strip > div { min-width: 0; display: flex; align-items: center; }
.deck-strip-start { justify-content: flex-start; }
.deck-strip-centre { justify-content: center; }
.deck-strip-end { justify-content: flex-end; }
.deck-footer { font-size: 0.75rem; color: var(--text-3); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deck-logo { height: 1.75rem; width: auto; pointer-events: none; }
.deck-logo-corner { position: fixed; z-index: 30; }
.deck-logo-top-left { top: 4.25rem; left: 1.25rem; }
.deck-logo-top-right { top: 4.25rem; right: 1.25rem; }
.deck-dots { display: flex; align-items: center; gap: 0.375rem; pointer-events: auto; }
.deck-dot {
  width: 0.5rem; height: 0.5rem; padding: 0; border-radius: 50%; display: block;
  border: 1.5px solid var(--border); background: transparent; cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.deck-dot:hover { border-color: var(--primary); }
.deck-dot.done { background: var(--primary); border-color: var(--primary); }
.deck-dot.current { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--primary); }
.deck-dot:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
.deck-progress { width: min(16rem, 30vw); height: 3px; border-radius: 2px; background: var(--border); overflow: hidden; }
.deck-progress-fill { height: 100%; width: 0; background: var(--primary); transition: width 0.15s; }
html.presenting .deck-strip, html.presenting .deck-logo-corner { z-index: 41; }
html.presenting .deck-logo-corner { top: 1.25rem; }
html.has-deck-strip.presenting .deck .slide-body { padding-bottom: max(calc(5.5 * var(--u)), 3.25rem); }
/* The slide scale, in u. Large text adds two bumps, small text one; every
   size of 1.8u or less is held at the floor. Line height 1.4 for body text
   and lists, 1.15 for claims; tracking zero. */
.deck .slide wk-section { margin: 0; }
.deck .slide wk-section > :last-child { margin-bottom: 0; }
.deck .slide wk-section-heading {
  font-size: calc(4 * var(--u) + 2 * var(--bump)); font-weight: 650; line-height: 1.15; letter-spacing: 0;
  color: var(--ink-strong); text-wrap: balance;
  padding-bottom: calc(1.3 * var(--u)); margin-bottom: calc(2.6 * var(--u));
}
/* A claim's rule spans the body at every fit; only its text is capped, at
   86u0, the body's text width at fit 1, so a lower fit never widens it.
   Statement and section headings carry no rule and cap their own box. */
.deck .slide:not([data-layout="statement"], [data-layout="section"]) wk-section-heading { padding-right: max(0px, calc(100% - 86 * var(--u0))); }
.deck .slide[data-layout="center"] wk-section-heading { padding-inline: max(0px, calc((100% - 86 * var(--u0)) / 2)); }
.deck .slide wk-section-heading::after { width: calc(5 * var(--u)); height: max(2px, calc(0.35 * var(--u))); bottom: calc(-0.175 * var(--u)); }
.deck .slide wk-section-subheading { font-size: calc(3 * var(--u) + 2 * var(--bump)); font-weight: 600; line-height: 1.3; color: var(--ink-strong); margin: calc(1.6 * var(--u)) 0 calc(0.8 * var(--u)); }
.deck .slide wk-section p { font-size: 1em; line-height: 1.4; color: var(--text-1); max-width: 27em; margin: 0 0 0.7em; }
.deck .slide .brief-list { font-size: 1em; line-height: 1.4; color: var(--text-1); max-width: 27em; padding-left: 1.1em; margin: 0 0 0.7em; }
.deck .slide .brief-list li { margin-bottom: 0.6em; padding-left: 0.25em; }
.deck .slide .brief-list li:last-child { margin-bottom: 0; }
.deck .slide .brief-list li::marker { color: var(--slide-accent, var(--primary)); }
.deck .slide :not(pre) > code { font-size: 0.85em; }
.deck .slide pre.wk-code-block > code { font-size: max(var(--floor), calc(1.8 * var(--u) + var(--bump))); }
.deck .slide wk-section wk-badge { font-size: max(var(--floor), calc(1.5 * var(--u) + var(--bump))); }
/* A visual on a default slide sits under the heading at the top; a text
   slide centres heading and body as a group. */
.deck .slide.has-viz:not([data-layout]) .slide-body, .deck .slide.has-viz[data-layout="default"] .slide-body { justify-content: flex-start; }

/* The title slide: left-aligned and centred on the vertical. From the
   top: an accent bar, the dateline, the title, the summary, the chips,
   the presenter; order moves the bar and the dateline above the title. */
.deck .slide-title .slide-body::before { content: ''; order: -2; flex: none; width: calc(6 * var(--u)); height: max(3px, calc(0.5 * var(--u))); background: var(--primary); margin-bottom: calc(3 * var(--u)); }
.deck .slide-title .brief-meta { order: -1; font-family: var(--mono); font-size: max(var(--floor), calc(1.5 * var(--u) + var(--bump))); line-height: 1.4; color: var(--text-2); letter-spacing: 0; margin: 0 0 calc(1.6 * var(--u)); }
.deck .slide-title .brief-title { font-size: calc(6.4 * var(--u) + 2 * var(--bump)); font-weight: 700; line-height: 1.05; letter-spacing: 0; color: var(--ink-strong); max-width: 13em; text-wrap: balance; margin: 0 0 calc(2.2 * var(--u)); }
.deck .slide-title .brief-summary { font-size: calc(2.8 * var(--u) + 2 * var(--bump)); line-height: 1.35; color: var(--text-2); max-width: 25em; margin: 0 0 calc(2.4 * var(--u)); }

/* Slide layouts (data-layout, copied from the wk-section by the splitter):
   center is the default centred on the horizontal; statement is the
   heading as the slide; section is a divider: a large centred heading with
   its accent bar in the tone. A lone stat or quote is the big-number or
   quote slide through the solo class, no field needed. A tone (data-tone
   with --slide-accent as var(--<role>), set by the renderer) colours the

.deck .slide[data-layout="section"] .slide-body { text-align: center; }
.deck .slide[data-layout="section"] wk-section-heading { font-size: calc(5.6 * var(--u) + 2 * var(--bump)); line-height: 1.1; border-bottom: 0; max-width: 15em; padding-bottom: calc(2 * var(--u)); margin: 0 auto calc(2 * var(--u)); }

.deck .slide[data-layout="statement"][data-tone] wk-section-heading { padding-bottom: calc(2 * var(--u)); }
.deck .slide[data-layout="section"] wk-section p { font-size: calc(2.6 * var(--u) + 2 * var(--bump)); color: var(--text-2); max-width: 24em; margin: 0 auto; }

/* Visuals: heights sized so a two-line claim and the visual fit in the
   46.75u the body leaves. Captions under a visual are centred and capped
   at 36em. On a slide a diagram's largest scale reads the wrapper's font

  margin: calc(1.2 * var(--u)) 0 0;
}
.deck .slide .present-chart { margin: 0; }
.deck .slide .present-chart[data-chart-title]::before { font-size: calc(2 * var(--u) + var(--bump)); font-weight: 600; color: var(--ink-strong); letter-spacing: 0; margin-bottom: var(--u); }

   kept and centred when it stands alone. In a column it fills the
   column's width up to its own size. */
.deck .slide wk-figure { margin: 0; }

.deck .slide wk-col wk-figure img { margin: 0; }
/* Split (MAD-581): the claim and a few words on the left, the one visual
   on the right. decorateSlide in app.js moves the heading and the text
   blocks into .split-text and the visual into .split-visual, side by side
   in one .split row, so read-aloud's buttons sit above it. The columns
   stand 2:3 with a 6u gap, 32u and 48u of the body's 86u at fit 1: the
   visual gets a near-square 48u by the body's 46.75u, the shape a chart
   or a diagram fills, and the claim keeps a column it wraps in, where the
   86u0 cap above comes to nothing. Both columns centre on the vertical.

.deck .slide[data-layout="split"] .present-chart[data-steps] .present-chart-canvas { height: calc(32 * var(--u)); }

.deck .slide[data-layout="split"] .present-diagram:is([data-steps], :has(.present-diagram-caption)) .present-diagram-canvas { max-height: calc(36 * var(--u)); }

.deck .slide[data-layout="split"] wk-figure:has(wk-figcaption) img { max-height: calc(36 * var(--u)); }
.deck .slide[data-layout="split"] .cy-container { height: calc(42 * var(--u)); }
.deck .slide[data-layout="split"] .present-terminal-canvas { --terminal-fill: 1; height: calc(42 * var(--u) - 2.125rem - 2px); }

/* References: two columns; the title in the text ink, the address in mono
   on one line, cut with an ellipsis. */
.deck .slide .refs-section { margin: 0; padding: 0; border: 0; }
.deck .slide .refs-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: calc(4 * var(--u)); row-gap: calc(1.6 * var(--u)); padding: 0; margin: 0; }
.deck .slide .refs-item { min-width: 0; gap: calc(0.3 * var(--u)); }
.deck .slide .refs-item a { font-size: calc(2 * var(--u) + var(--bump)); line-height: 1.3; color: var(--text-1); }
.deck .slide .refs-url { font-family: var(--mono); font-size: max(var(--floor), calc(1.5 * var(--u) + var(--bump))); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.deck-notes-drawer {
  position: fixed; left: 1.25rem; bottom: 4.75rem; z-index: 45;

.deck-notes-empty { color: var(--text-3); margin: 0; }

/* Slide transitions through the View Transitions API. The active slide

   collapses the pseudo-elements to a cut; show skips the API there too. */
.slide.active { view-transition-name: deck-slide; }

@keyframes deckInFromRight { from { opacity: 0; transform: translateX(24px); } }
@keyframes deckInFromLeft { from { opacity: 0; transform: translateX(-24px); } }

#share-status { color: var(--text-3); }

<wk-header back-href="/" back-label="← All" title="Brief" controls="cmdk,font,fixation,size,audio,speed,reload,theme,help" fixation-targets="[data-fixation], wk-panel-title, wk-panel-subtitle, wk-kv-value, wk-callout, wk-section p, wk-section li"><a data-nav href="/webkit/themes">Themes</a><a data-extra class="btn btn-ghost" id="deckLink" hidden title="Open this page as a slide deck">Slides</a><a data-extra class="btn btn-ghost" id="briefLink" hidden title="Read this page as a brief">Brief</a><button data-extra class="btn btn-ghost" id="shareBtn" hidden>Share</button></wk-header>
