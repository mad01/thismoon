/* Palette, header chrome, and the font/fixation/size/theme controls come from
   /webkit/webkit.css. Only present-specific content styles live here. The page
   body is rendered client-side by /app.js into <main id="root">. */
@keyframes briefEnter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }

.brief { max-width: var(--page-width, 1080px); margin: 0 auto; padding: 2rem 1.5rem 6rem; animation: briefEnter 0.35s ease-out; }

/* Softer ink for the page body. webkit's primary text is near-black in
   light mode and near-white in dark, which reads harsh in a monospace face,
   more so with fixation's bold halves. The brief's summary and lists already
   sit at the secondary ink; this moves the rest of the content (paragraphs,
   titles, headings, table cells, kv values) to the palette's text-body role,
   a step between the two inks in every family, while the header chrome keeps
   webkit's default. The root re-resolves its own color: elements that only
   inherit (the title, section headings) would otherwise keep the computed
   color body derived from the unchanged variable. */

/* Compatibility for stored pages (MAD-371). A panel accent named terracotta
   now renders as var(--primary), the role it always stood for, and webkit no
   longer declares --terracotta. Pages rendered before that change still
   carry var(--terracotta) in their stored HTML. A local serve rewrites them
   in its startup sweep. A shared instance never rerenders, so this rule
   keeps the accent bar resolving there until an update rewrites the page. */

  font-size: 2.125rem;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.15;
  margin-bottom: 0.625rem;
}

   enters it. */

.brief-summary { font-size: 1.0625rem; color: var(--text-2); line-height: 1.75; margin-bottom: 2.5rem; max-width: 640px; }

   its timers; a cutting deck gets .cut from the step hook). .off follows

  .brief-title { font-size: 1.625rem; }
  .cy-container, wk-col .cy-container { height: 380px; }
  .cy-controls .size-btn { width: 2rem; height: 2rem; }

  .cy-wrapper.cy-fullscreen .cy-container { border-radius: 0; }

.deck { padding-bottom: 5.5rem; }

.deck-logo { height: 1.75rem; width: auto; pointer-events: none; }

.deck-dot:hover { border-color: var(--primary); }

.deck-progress-fill { height: 100%; width: 0; background: var(--primary); transition: width 0.15s; }
html.presenting .deck-strip, html.presenting .deck-logo-corner { z-index: 41; }
html.presenting .deck-logo-corner { top: 1.25rem; }
html.has-deck-strip.presenting .slide.active { padding-bottom: max(5vh, 3.25rem); }

   the slide; section is a divider on a tone band. A lone stat or quote is
   the big-number or quote slide through the solo class, no field needed.
   A tone (data-tone with --slide-accent as var(--<role>), set by the
   renderer) tints the slide's surface and heading rule in the deck and

.deck .fragment { visibility: hidden; }

   crossfade; the strip, the corner logo, the bar, and the drawer carry

.deck-logo-corner { view-transition-name: deck-logo; }
.deck-bar { view-transition-name: deck-bar; }
.deck-notes-drawer { view-transition-name: deck-notes; }

::view-transition-group(deck-logo), ::view-transition-old(deck-logo), ::view-transition-new(deck-logo),

html[data-transition="slide"].deck-prev::view-transition-old(deck-slide) { animation-name: deckOutToRight; }
html[data-transition="slide"].deck-prev::view-transition-new(deck-slide) { animation-name: deckInFromLeft; }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}
/* The graph fades in once its first layout has stopped (app.js adds ready),
   opacity only so the canvas composites once; the brief gets the same. */
.cy-container { opacity: 0; transition: opacity 0.2s ease-out; }
.cy-container.ready { opacity: 1; }
html[data-transition="none"] .cy-container { transition: none; }
@media (max-width: 600px) {
  .slide-title .brief-title { font-size: 1.875rem; }
  .slide.active { min-height: calc(100vh - 10rem); }
  html.presenting .slide.active { padding: 1.5rem 1rem; }
  html.has-deck-strip.presenting .slide.active { padding-bottom: 3.25rem; }
  .deck-strip { left: 0.75rem; right: 0.75rem; }
  .slide[data-layout="statement"] wk-section-heading { font-size: 1.875rem; }
  .slide[data-layout="section"] wk-section-heading { font-size: 1.75rem; }
  .slide.solo-stat wk-stat-value { font-size: 3.5rem; }
  .slide.solo-quote blockquote p { font-size: 1.25rem; }
}
#share-result code { word-break: break-all; }
#share-status { color: var(--text-3); }
</style>
