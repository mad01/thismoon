<!DOCTYPE html>
<html lang="en" data-present-mode="export">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}}</title>
<!--
{{.Notice}}
-->
<script>{{.Boot}}</script>
{{- if .Fonts}}
<style>{{.Fonts}}</style>
{{- end}}
<style>{{.WebkitCSS}}</style>
<style>{{.ShellCSS}}</style>
</head>
<body>
<wk-header title="{{.HeaderTitle}}" controls="font,fixation,size,theme,help" fixation-targets="{{.FixationTargets}}"></wk-header>
<main id="root"><div class="brief">{{.Body}}</div></main>
<script type="application/json" id="present-export">{{.Data}}</script>
<script>{{.Guard}}</script>
<script>{{.WebkitJS}}</script>
{{- range .Scripts}}
<script src="{{.URL}}" integrity="{{.Integrity}}" crossorigin="anonymous"></script>
{{- end}}
<script>{{.VizJS}}</script>
<script>{{.AppJS}}</script>
</body>
</html>
