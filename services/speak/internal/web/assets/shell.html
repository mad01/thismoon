<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>speak</title>
<script src="/webkit/boot.js"></script>
<link href="/webkit/webkit.css" rel="stylesheet">
<style>
/* Palette and chrome come from /webkit/webkit.css; only speak-specific styles
   live here. The page body (header, upload form, rendered doc) is built
   client-side by /app.js into <div id="app">. */
main.wrap { max-width: var(--page-width); margin: 0 auto; padding: 1.5rem 2rem 4rem; }
.upload-form { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
.upload-form input[type="file"] { font-size: 0.8125rem; color: var(--text-2); }
.upload-form input[type="file"]::file-selector-button {
  appearance: none; background: var(--chip-bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.375rem 0.625rem; margin-right: 0.75rem;
  font-family: inherit; font-size: 0.75rem; font-weight: 500; color: var(--text-2);
  cursor: pointer; transition: all 0.15s;
}
.upload-form input[type="file"]::file-selector-button:hover { border-color: var(--border-hover); color: var(--text-1); }
.upload-form button[type="submit"] {
  appearance: none; background: var(--primary); border: 1px solid var(--primary);
  border-radius: 6px; padding: 0.375rem 0.875rem; font-family: inherit;
  font-size: 0.75rem; font-weight: 500; color: #fff; cursor: pointer; transition: all 0.15s;
}
.upload-form button[type="submit"]:hover { filter: brightness(1.05); }
.upload-error { margin-top: 1rem; color: var(--st-down, #d65745); font-size: 0.8125rem; }
wk-callout { margin-top: 1rem; }
.recent-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
.recent-label { font-size: 0.75rem; color: var(--text-3); }
.recent-chip {
  appearance: none; background: var(--chip-bg); border: 1px solid var(--border);
  border-radius: 999px; padding: 0.25rem 0.75rem; font-family: var(--mono);
  font-size: 0.75rem; color: var(--text-2); cursor: pointer; transition: all 0.15s;
  max-width: 20rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.recent-chip:hover { border-color: var(--border-hover); color: var(--text-1); }
.drop-hint {
  margin-top: 2rem; padding: 2rem 1.5rem; text-align: center;
  border: 1.5px dashed var(--border); border-radius: 10px;
  color: var(--text-3); font-size: 0.8125rem;
}
.drop-overlay {
  position: fixed; inset: 0; z-index: 100; display: none;
  align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--bg, #fff) 75%, transparent);
  border: 3px dashed var(--primary); font-size: 1.125rem; color: var(--primary);
  pointer-events: none;
}
.drop-overlay.visible { display: flex; }
.doc { margin-top: 2rem; }
.doc-name { font-size: 0.75rem; color: var(--text-3); margin-bottom: 1rem; font-family: var(--mono); }
.doc-section {
  display: block; background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; box-shadow: var(--shadow-xs);
}
.doc-section h1, .doc-section h2, .doc-section h3 { margin: 0 0 0.75rem; line-height: 1.3; }
.doc-section h1 { font-size: 1.375rem; } .doc-section h2 { font-size: 1.125rem; } .doc-section h3 { font-size: 1rem; }
.doc-section p, .doc-section ul, .doc-section ol { margin-bottom: 0.75rem; }
.doc-section ul, .doc-section ol { padding-left: 1.5rem; }
.doc-section pre { background: var(--chip-bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem 1rem; overflow-x: auto; font-size: 0.8125rem; margin-bottom: 0.75rem; }
.doc-section code { font-family: var(--mono); font-size: 0.875em; background: var(--chip-bg); padding: 0.1rem 0.3rem; border-radius: 3px; }
.doc-section pre code { background: none; padding: 0; }
.doc-section table { border-collapse: collapse; margin-bottom: 0.75rem; }
.doc-section td, .doc-section th { border: 1px solid var(--border); padding: 0.375rem 0.625rem; font-size: 0.875rem; }
.doc-section blockquote { border-left: 3px solid var(--border-hover); padding-left: 1rem; color: var(--text-2); margin-bottom: 0.75rem; }
.doc-section a { color: var(--primary); }
/* Audio preparation: the page-level line above the sections and each
   section's badge, floated beside its play buttons. */
.doc-audio { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; font-size: 0.8125rem; color: var(--text-2); }
.doc-audio-reason { color: var(--red); }
.audio-btn {
  appearance: none; background: var(--chip-bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.25rem 0.625rem; font-family: inherit;
  font-size: 0.75rem; font-weight: 500; color: var(--text-2); cursor: pointer; transition: all 0.15s;
}
.audio-btn:hover { border-color: var(--border-hover); color: var(--text-1); }
.audio-btn:disabled { opacity: 0.6; cursor: default; }
.audio-dl { font-size: 0.75rem; color: var(--primary); }
.section-audio {
  float: right; display: flex; align-items: center; gap: 0.5rem;
  min-height: 1.75rem; margin: 0 0 0 0.75rem;
}
/* No bottom margin on the floated controls: under a short h2 it pushed the
   float past the heading, and the paragraph's first line wrapped early. */
.doc-section > .wk-ra-btn { margin-bottom: 0; }
/* inline-block, not the badge's inline-flex, so a long failure reason can
   ellipsize (the full text is in the title). */
.section-audio wk-badge { display: inline-block; max-width: 18rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<wk-header brand="speak·aloud" controls="cmdk,font,fixation,size,speed,reload,theme,help" fixation-targets="[data-fixation], .doc-section p, .doc-section li"></wk-header>
<template data-wk-help>
  <div class="wk-help-section-title">This tool</div>
  <div class="wk-help-row"><div class="wk-help-term">Read a document</div>
  <div class="wk-help-desc">Choose a markdown file and speak reads it aloud, section by section, over your speakers — a hands-free way to get through a long document by ear.</div></div>
  <div class="wk-help-row"><div class="wk-help-term">Prepared audio</div>
  <div class="wk-help-desc">An upload is prepared in the background, so play starts from ready audio instead of waiting on the voice model. Each section shows how far that got, and once a section (or the whole page) is ready it can be downloaded as one audio file. Prepare all queues whatever is left.</div></div>
</template>
<main class="wrap"><div id="app"></div></main>
<script src="/webkit/webkit.js"></script>
<script src="/app.js"></script>
</body>
</html>
