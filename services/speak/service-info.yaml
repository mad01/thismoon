apiVersion: catalog.mad01/v1alpha1
kind: Component
metadata:
  name: speak
  description: Text-to-speech over localhost, document audio API + CORS speech proxy for local pages, MCP tools for agents
  tags: [go, cli, tts]
spec:
  type: cli
  lifecycle: production
  owner: mad01
  system: thismoon
  # The recipe registers two agents: speak-web and sandbox-watch.
  access:
    sandbox: none
    reason: >-
      sandbox-watch streams the unified log through logd, posts notification
      banners, and reports every other sandbox's denials, so it stays outside
      srt (docs/adr/0006). speak-web is first-party and has not been probed
      under srt yet.
