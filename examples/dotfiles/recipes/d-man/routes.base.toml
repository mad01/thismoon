# Machine-personal route set (base) for the d-man front door.
# Shared by every profile. The ACTIVE config the daemon reads
# (~/.config/d-man/routes.toml) is GENERATED from this file by d-man-profile,
# which prepends blocklist.work.toml for the "work" profile. Edit this file to
# change routes, not the generated one.
#
# Each route is either port-backed (port) or a CNAME alias (cname) that
# resolves to another route's backend. The daemon re-applies edits live.
suffix = "this"

# Optional: extra block-page games, loaded as plugins. Point this at a local
# checkout of a private games repo (kept fresh by its own companion recipe) or
# any flat directory of <name>.js files that call ARCADE.register. Missing dir
# = only the games bundled into the d-man binary.
# games_dir = "~/.config/d-man/games"

[[route]]
name = "present"   # http://present.this/ -> 127.0.0.1:7423
port = 7423

[[route]]
name = "reminder"  # http://reminder.this/ -> 127.0.0.1:7428
port = 7428

[[route]]
name = "p"         # http://p.this/ -> alias of present.this
cname = "present"
