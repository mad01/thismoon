# ~/.config/belt/config.yaml (symlinked there by this recipe).
# Every key is optional; guards and hints default to enabled when a key is
# missing. Full reference: tools/belt/config.md in the thismoon repo, or
# `belt config --help`. Verify the resolved result with `belt doctor`.

# There is no machine-profile concept in this file (thismoon
# docs/adr/0010): render one config per machine class instead (a
# profile-gated recipe per class, or a template), so a guard or rule that
# should exist only on some machines is simply absent from the others'
# files. This example is a work-machine rendering; a personal machine's
# file would drop the work-hours rule and carry its own git-push-main
# allow_repos list.

# Name sources for the write-internal-names guard. belt reads only this
# file — the suspenders pre-commit guard has an identically shaped section
# in its own config, so keep the two in step (render both from one template
# if your dotfiles can). Every git repo found under workspace_dirs
# contributes its org, repo, and directory names as blocked words in public
# (github.com) repos — the list is derived, never enumerated.
internal_names:
  workspace_dirs:
    - ~/work-checkouts
  blocked_words:
    - internal-codename
  allowlist:
    - some-safe-name

# belt reads the Claude settings files (settings.json + settings.local.json)
# for the permissions.deny Bash entries that script-deny-list enforces
# inside scripts. Default true; set false to stop belt opening them.
# claude_settings:
#   enabled: true

# The repo decides the commit identity, whatever machine you are on.
git_identity:
  - repos:
      - github.com/you/*
    email: you@personal.example
    mode: hard

# Work-hours nudge: soft-warn on personal-repo commits during work hours.
# Belongs in the work machines' rendered config only. `belt override set
# vacation --reason "..."` disables it.
commit_guards:
  - repos:
      - github.com/you/*
    block_hours: "09:00-17:00"
    mode: soft
    override: vacation

guards:
  git-push-main:
    enabled: true
    allow_repos:
      - github.com/you/dotfiles # direct pushes to main allowed here only
  script-deny-list:
    enabled: true
    extra_patterns:
      - rm -rf # settings.json lists bare `rm` under "ask" only
  write-internal-names:
    enabled: true
    exclude_paths:
      - ~/notes # internal references are deliberate here

hints:
  # The post-commit half of the git-push-main pair: a commit landing on
  # main/master in any repo not opted out here draws the branch + PR advice.
  # Keep the list in step with guards.git-push-main.allow_repos (hints opt
  # repos out with exclude_repos; allow_repos belongs to guards).
  commit-policy:
    exclude_repos:
      - github.com/you/dotfiles
