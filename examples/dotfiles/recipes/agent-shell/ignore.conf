# sandbox-watch's machine ignore list, ~/.config/sandbox-watch/ignore.conf:
# one extended regex per line, read in addition to the fleet list that ships
# with thismoon (recipes/speak/sandbox-ignore.conf, whose header explains the
# two forms a pattern can match). A match keeps the denial in the ledger
# tagged IGNORED and sends no banner. The watcher reads one such file per
# machine and re-reads it every batch, so this recipe owns it in this
# example; if another recipe of yours owns it already, move the line there.

# The agent's shell. Every command the agent runs carries this label, and
# an agent probes paths all day: a dotenv loader, a credential chain, a
# tool reading its config under ~. Blocking that is the point; a
# banner for each one is noise. The ledger keeps every line, so
# `sandbox-audit.sh ledger agent-shell` still shows what the agent tried.
# Delete this line to be notified of each denial instead.
^agent-shell ·
