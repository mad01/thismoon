# Example overlay: choose which thismoon mods Claude Code runs on this machine.
#
# Mods are optional Claude Code plugins. thismoon ships them under mods/ and
# lists them in its root marketplace, .claude-plugin/marketplace.json, named
# thismoon. No thismoon recipe installs one: registering the marketplace and
# picking the mods is machine-private wiring (docs/adr/0006 and
# docs/adr/0021 in thismoon), so it lives in the consuming repo.
#
# The marketplace is the ralph sources cache, ~/.config/ralph/sources/thismoon,
# which the [[recipe_sources]] stanza in config.toml pulls on every `ralph up`.
# That checkout is a local directory, so Claude Code runs each installed mod
# from its folder there (`readFromFolder` in `claude plugin list --json`).
# A merged mod change reaches this machine with that pull, and a new session
# or /reload-plugins loads it. The version bump in the mod's
# .claude-plugin/plugin.json marks the change. While the install record's
# version differs from it, the sync runs `claude plugin update`, which
# brings the record in step; one run settles it.
#
# mods.list is the declarative half: one line per mod, marked on, off or
# retired. sync-mods.sh reconciles it through the `claude plugin` CLI and
# never edits Claude Code's state files by hand; `sh sync-mods.sh --check`
# prints what it would do and changes nothing. Grow the script, not the
# recipe, when you need more: per-host lines or a second marketplace.
#
# Wave 1: ralph pulls the sources cache before any wave runs, and the sync
# writes only Claude Code's plugin state, so it needs no depends_on.
[recipe]
name = "claude-mods"
description = "Register thismoon's mod marketplace from the sources cache and reconcile the mods listed in mods.list"
wave = 1

# run = "always", not idempotent. ralph's idempotent flag hashes the
# commands and working_dir, not the files they read, so it would miss an
# edit to mods.list. It would miss a new mod in the sources cache too. The
# script skips cleanly when claude or jq is missing, or when the sources
# cache has no marketplace yet. `ralph doctor` runs the verify command,
# which exits 1 while any action is pending or a line in mods.list can't be
# used.
[hooks.builds.claude_mods_sync]
commands = ["sh ./sync-mods.sh"]
working_dir = "~/code/src/github.com/you/dotfiles/recipes/claude-mods"
run = "always"
verify = "sh ./sync-mods.sh --check"
