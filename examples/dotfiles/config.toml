# Example ralph config for a dotfiles repo that consumes thismoon.
# Path to the dotfiles repo this config lives in (supports ~ expansion).
dotfiles_repo_path = "~/code/src/github.com/you/dotfiles"

# Auto-discover local recipes (the machine-private overlays) from recipes/.
[recipes_config]
auto_discover = true

# Remote recipe source: the thismoon monorepo. ralph caches the checkout under
# ~/.config/ralph/sources/thismoon and merges each recipe with the identity
# thismoon/<recipe>. A branch ref with update = true follows the branch on
# every `ralph up`; a tag or commit ref stays pinned until you change it.
[[recipe_sources]]
name = "thismoon"
url = "git@github.com:mad01/thismoon.git"
ref = "main"
update = true

# --- Host-scoping remote recipes -----------------------------------------
# Remote recipes are enabled on every machine by default. Override one by its
# namespaced key (source/recipe, quoted). Two axes:
#
#   enable = false      turn the recipe off everywhere
#   hosts = [...]       run it ONLY on the listed hostnames (others skip it)
#
# Uncomment and set your hostnames (`hostname -s`) to scope. Example: run the
# deps service only on your two personal machines, and turn present off on a
# host that shouldn't serve it.
#
# [recipes_config.overrides."thismoon/deps"]
# hosts = ["your-laptop", "your-desktop"]
#
# [recipes_config.overrides."thismoon/present"]
# enable = false
#
# Recipe-level `hosts`/`profiles` (see recipes/secrets-env/recipe.toml) gate a
# recipe you own; the overrides here gate a recipe that ships from a source.
